<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Fly Premium V2 — isolated art gate</title>
<style>body{margin:0;background:#bad4da}#concept{width:100vw;height:100vh}.rytni-arcade.mf-premium .rytni-arcade-stage{height:100vh!important;border-radius:0!important}.rytni-arcade.mf-premium .rytni-arcade-menu-scene{display:block!important;position:absolute;inset:0;z-index:0}.rytni-arcade-overlay{height:100%}</style>
<div id="concept"></div><script>
(async()=>{
 const raw=await(await fetch('/tilda-test/blocks/08_T123_BROWSER_ARCADE_2.15.34.html')).text();const style=document.createElement('style');style.textContent=raw.match(/<style[^>]*>([\s\S]*?)<\/style>/)[1]+'\n'+await(await fetch('premium.css')).text();document.head.append(style);
 const q=new URLSearchParams(location.search),screen=q.get('screen')||'main',A='/grib/mushroom-fly-v2/',P='/grib/mushroom-fly-premium-v2/';
 const button=(a,l,p=false)=>`<button type="button" class="rytni-arcade-start ${p?'is-primary':''}" data-menu-action="${a}">${l}</button>`;
 const row=(n,name,score)=>`<li class="mf-ranking-row ${n===1?'is-leader':''} ${n===7?'is-me':''}"><span class="mf-rank-number">${n===1?`<img class="mf-leader-badge" src="${A}ui/icons-recovery-v1/leader-first-v1.png">`:n}</span><span class="mf-rank-name">${name}</span><strong>${score}</strong></li>`;
 const rows=Array.from({length:10},(_,i)=>row(i+1,['Nebula','Грибник','Mira','CyberFox','Raven','Лис','Вы','Искра','Sky','Nova'][i],['12 480','10 920','9 650','8 710','7 940','7 200','6 840','6 120','5 300','4 950'][i]));
 const console=`<div class="mf-status-console"><div><small>ЕЖЕДНЕВНЫЕ</small><span class="mf-tokens">${[1,2,3].map(()=>`<img class="mf-token is-available" src="${A}items/coin.webp">`).join('')}</span><strong>3 / 3</strong></div><div><small>ОТ СПОНСОРА</small><span class="mf-tokens">${[1,2].map(()=>`<img class="mf-token" src="${A}items/coin.webp">`).join('')}</span><strong>0 / 2</strong></div><div><small>РЕКОРД</small><strong>${q.has('stress')?'99 999 999':'6 840'}</strong></div><div><small>МЕСТО</small><strong>${q.has('stress')?'№9999':'№7'}</strong></div></div>`;
 let mode=screen,title='',body='',actions='',intro='',ranking='';
 if(screen==='main'||screen==='status'){mode='main';title='Лети выше. Собирай больше.';intro=`<div class="rytni-arcade-menu-brand" id="arcadeIntro"><img class="rytni-arcade-menu-logo" src="${A}ui/logo.webp" alt="Mushroom Fly"></div>`;body=console;actions=button('play','ИГРАТЬ',true)+button('training','Тренировка · Без ограничений')+button('rules','Как играть?')+button('mute','♪')+button('settings','Настройки')+button('fullscreen','⛶');ranking=`<aside class="mf-sky-ranking"><small>НЕБЕСНАЯ ЛИГА</small><h3>Лидеры сезона</h3><ol class="mf-ranking-list">${rows.slice(0,3).join('')}</ol>${button('ranking','Открыть рейтинг')}</aside>`;}
 else if(screen==='ranking'){title='Небесная лига';body=`<ol class="mf-ranking-list">${rows.join('')}</ol><p class="mf-ranking-own">Ваше место: №7 · Рекорд: 6 840</p>`;actions=button('back','Главное меню');}
 else if(screen==='pause'){title='Пауза';actions=button('resume','Продолжить',true)+button('restart','Начать заново')+button('settings','Настройки')+button('home','Главное меню');}
 else if(screen==='result'){title='Новый рекорд!';body=`<div id="arcadeResult"><div class="mf-result-score"><small>ИТОГОВЫЙ СЧЁТ</small><strong>38 760</strong></div><div class="mf-result-stats"><span><strong>87</strong><small>разломы</small></span><span><strong>128</strong><small>монеты</small></span><span><strong>5</strong><small>серия PERFECT</small></span></div><dl class="mf-result-details"><div><dt>Время</dt><dd>146 сек.</dd></div><div><dt>Усиления</dt><dd>12</dd></div><div><dt>Порталы</dt><dd>3</dd></div></dl></div>`;actions=button('play','Сыграть снова',true)+button('share','Поделиться')+button('home','Главное меню');}
 else if(screen==='rules'){title='Путеводитель по небесам';body=`<div class="mf-tabs"><button class="mf-tab">Основы</button><button class="mf-tab is-active">Бонусы</button><button class="mf-tab">Опасности</button></div><div class="mf-power-grid">${[['Звезда','×2 очков монет','items/star.webp'],['Магнит','Притягивает монеты','items/magnet.webp'],['Клевер','Больше монет','items/clover.webp'],['Призрак','Проход сквозь препятствия','items/ghost-dew-v1.webp'],['Цветок времени','Замедляет мир','items/time-bloom-v1.webp'],['Портал','Бонусное измерение','portal/portal-idle-v1.webp']].map(([n,t,f])=>`<article class="mf-guide-card"><img src="${A+f}"><span><b>${n}</b><small>${t}</small></span></article>`).join('')}</div>`;actions=button('back','Понятно!',true);}
 else if(screen.startsWith('settings')){mode='settings';title='Настройки';const sound=screen==='settings-sound';body=`<div class="mf-tabs"><button class="mf-tab ${sound?'is-active':''}">ЗВУК</button><button class="mf-tab ${sound?'':'is-active'}">ИГРА</button></div>`+(sound?['Общая громкость','Музыка','Эффекты'].map(l=>`<div class="rytni-arcade-volume"><label>${l}</label><output>80%</output><input type="range" value="80"></div>`).join('')+`<div class="rytni-arcade-setting"><b>Все звуки</b><button>Выключить</button></div>`:`<div class="rytni-arcade-setting"><span><b>Визуальные эффекты</b><small>Частицы, сияние и анимации</small></span><button>Яркие</button></div><div class="rytni-arcade-setting"><span><b>Полный экран</b><small>Удобнее для активной игры</small></span><button>Открыть</button></div>`);actions=button('back','Готово',true);}
 document.querySelector('#concept').innerHTML=`<section class="rytni-arcade mf-premium"><div class="rytni-arcade-layout"><article class="rytni-arcade-stage has-menu is-title-scene"><div class="rytni-arcade-menu-scene"></div><div class="rytni-arcade-overlay"><div id="arcadeDialog" data-menu="${mode}"><div class="rytni-arcade-dialog-frame"></div><header class="rytni-arcade-modal-header">${intro}<small class="rytni-arcade-menu-kicker">${screen==='result'?'ЛУЧШИЙ ПОЛЁТ СЕЗОНА':'MUSHROOM FLY'}</small><h6>${title}</h6>${screen==='main'?'<p>Покоряй волшебное небо. Забирай первое место.</p>':''}</header><div class="rytni-arcade-modal-body"><div class="rytni-arcade-menu-content">${body}</div></div><footer class="rytni-arcade-modal-footer"><div class="rytni-arcade-actions">${actions}</div></footer>${ranking}</div></div></article></div></section>`;
 document.querySelector('.mf-premium').style.setProperty('--mf-celebrate',`url('${P}celebration-v2.png')`);document.querySelector('.rytni-arcade-stage').style.setProperty('height','100vh','important');window.conceptReady=true;
})();
</script></html>
