<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Mushroom Snake — Forest Training DEV</title>
<link rel="stylesheet" href="./forest-training/style.css">
<div id="loading" role="status">Mushroom Snake — Загрузка леса…</div>
<main id="game" hidden>
  <canvas aria-label="Mushroom Snake — игровое поле"></canvas>
  <header id="hud">
    <img class="logo" alt="Mushroom Snake">
    <div class="stat"><small>СЧЁТ</small><strong id="score">0</strong></div>
    <div class="stat"><small>ДЛИНА</small><strong id="length">8</strong></div>
    <div class="stat"><small>КОМБО</small><strong id="combo">×1</strong></div>
    <div id="effects" aria-live="polite"></div>
    <button class="icon" data-action="pause" aria-label="Пауза">Ⅱ</button>
    <button class="icon" data-action="fullscreen" aria-label="Полный экран">⛶</button>
  </header>
  <div id="pad" hidden aria-label="Управление Snake">
    <button data-dir="0" aria-label="Вверх">▲</button><button data-dir="1" aria-label="Вправо">▶</button>
    <button data-dir="3" aria-label="Влево">◀</button><button data-dir="2" aria-label="Вниз">▼</button>
  </div>
  <section id="overlay" class="card" aria-live="polite">
    <h1 id="heading">Mushroom Snake</h1><div id="copy"></div><div id="actions"></div>
  </section>
</main>
<script type="module" src="./forest-training/runtime.js"></script>
</html>
