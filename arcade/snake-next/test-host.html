<!-- Snake Next TEST Hub. The current Fly block and legacy rollback stay untouched. -->
<style>
#msHub,#msNextSnake,#msFlyWrap{box-sizing:border-box;color:#fff1c6;font:500 15px/1.45 system-ui,sans-serif}
#msHub[hidden],#msNextSnake[hidden],#msFlyWrap[hidden]{display:none!important}
#msHub{padding:34px;border:1px solid #716347;border-radius:20px;background:#080b1a url('https://rytni.github.io/rytni-assets/grib/arcade-v2/arcade-backdrop-desktop.png') center/cover;box-shadow:inset 0 0 0 1px #aaa5dd12,0 10px 28px #05071955}
.ms-next-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.ms-next-heading h2{font:700 clamp(24px,4vw,38px)/1.1 Georgia,serif;margin:6px 0}.ms-next-heading p{max-width:340px;color:#c8c4a3;margin:0}
.ms-next-cards{display:flex;gap:20px}.ms-next-card{flex:1;min-width:0;border:1px solid #a58347;border-radius:18px;overflow:hidden;background:#111524ed;display:flex;flex-direction:column;box-shadow:inset 0 1px #d3c5ee16}.ms-next-card img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 50%;background:#10251b}.ms-next-copy{padding:20px;flex:1;display:flex;flex-direction:column}.ms-next-copy h3{font:700 28px Georgia,serif;margin:0 0 8px}.ms-next-copy p{color:#d5ceb0;margin:0 0 14px;flex:1}.ms-next-copy .ms-next-btn{align-self:start;margin-top:auto}
.ms-next-btn{min-height:48px;min-width:48px;border:1px solid #a77d42;border-radius:10px;padding:10px 20px;background:linear-gradient(#714625,#342013);color:#fff0c5;font:700 14px system-ui,sans-serif;cursor:pointer}.ms-next-btn:focus-visible{outline:3px solid #e8df93;outline-offset:2px}.ms-next-primary{background:linear-gradient(#86bc31,#3b741a);border-color:#d9e584;min-height:54px}
/* Fly technical accounting note is documentation, not player-facing space. */
#msFlyWrap .rytni-arcade-note{display:none}
.ms-next-stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#06251d;border-radius:14px}.ms-next-stage iframe{position:absolute;inset:0;border:0;width:100%;height:100%;display:block}.ms-next-stage:fullscreen,.ms-next-stage.ms-next-full{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0}.ms-next-stage.ms-next-full{position:fixed;inset:0;z-index:2147483000}
.ms-player-header{display:flex;align-items:center;gap:18px;min-height:66px;padding:10px 18px;margin-bottom:10px;border:1px solid #555371;border-radius:14px;background:linear-gradient(120deg,#191d34,#27243d 65%,#161f30);color:#eae9f5;box-sizing:border-box}
.ms-player-back{flex:none;min-height:44px;padding:8px 14px;border-color:#68647f;background:linear-gradient(#37374c,#1d2235);color:#eeeafa;border-radius:8px}
.ms-player-profile{display:flex;align-items:center;gap:12px;min-width:0;flex:1;color:#d4d4e9;font:500 14px/1.35 system-ui,sans-serif}
.ms-player-profile img{width:36px;height:36px;object-fit:cover;border-radius:50%;border:1px solid #7c7392;flex:none}
.ms-player-profile strong{color:#faf5ff;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-player-profile .ms-player-level{border:1px solid #665984;border-radius:5px;background:#38304a;padding:3px 7px;font-size:12px;white-space:nowrap}
.ms-player-test{font:700 10px/1.3 system-ui,sans-serif;border:1px solid #625b79;border-radius:4px;padding:3px 6px;color:#bdb5cb;flex:none;letter-spacing:1px}
.ms-player-header [hidden]{display:none!important}
@media(max-width:700px){.ms-player-header{gap:10px;padding-inline:16px}.ms-player-profile{gap:8px}.ms-player-status{display:none}.ms-player-profile strong{max-width:100px}}
@media(max-width:560px){#msHub{padding:24px 18px;background-image:url('https://rytni.github.io/rytni-assets/grib/arcade-v2/arcade-backdrop-mobile.png')}.ms-next-cards{flex-direction:column}.ms-next-heading{display:block}.ms-next-heading p{margin-top:10px}.ms-next-copy{padding:14px}.ms-next-copy p{min-height:44px}.ms-next-copy h3{font-size:25px}}
@media(max-width:560px) and (orientation:portrait){.ms-next-stage{aspect-ratio:9/16}}
/* Dedicated phone header. Wide/desktop ownership remains unchanged. */
@media(max-width:560px) and (orientation:portrait){
 .ms-player-header{gap:8px;padding:8px 48px 8px 8px;min-height:60px;position:sticky;top:0;z-index:5;margin-bottom:6px}
 .ms-player-back{padding:8px;min-width:0;font-size:12px}
 .ms-player-profile{display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-rows:22px 18px;gap:0 5px;font-size:12px}
 .ms-player-profile img{width:28px;height:28px;grid-row:1/3}
 .ms-player-profile strong{max-width:none;min-width:0;grid-column:2;grid-row:1;font-size:13px}
 .ms-player-profile .ms-player-level{grid-column:3;grid-row:1;padding:1px 3px;font-size:10px}
 .ms-player-profile [data-player=points]{grid-column:2/4;grid-row:2;font-size:11px;white-space:nowrap}
 .ms-player-profile .ms-player-status{display:none}.ms-player-test{padding:2px 3px;font-size:9px;letter-spacing:0}
 .ms-next-stage{height:calc(100dvh - 86px);min-height:580px;aspect-ratio:auto}
}
</style>
<script>
(() => {
 'use strict';
 if(window.RytniArcadeHub)return;
 const runtime='__SNAKE_NEXT_RUNTIME_URL__',protocol='snake-next-test-v1';
 const $=id=>document.getElementById(id);
 const button=(action,text,primary=false)=>`<button type="button" class="ms-next-btn${primary?' ms-next-primary':''}" data-ms-action="${action}">${text}</button>`;
 function playerHeader(){return `<header class="ms-player-header" aria-label="Игрок аркады"><button type="button" class="ms-next-btn ms-player-back" data-ms-action="hub">← Аркада</button><div class="ms-player-profile"><img data-player="avatar" hidden alt=""><strong data-player="name" hidden></strong><span class="ms-player-level" data-player="level" hidden></span><span data-player="points" hidden></span><span class="ms-player-status" data-player="status" hidden></span></div><span class="ms-player-test">TEST</span></header>`;}
 function refreshPlayer(){
  const headers=document.querySelectorAll('#msNextSnake .ms-player-header,#msFlyWrap .ms-player-header');if(!headers.length)return;
  // Same authoritative application object as Fly. Unknown fields stay absent;
  // participant_number is not a rank and is deliberately not rendered.
  const p=typeof currentApplication!=='undefined'?currentApplication:window.currentApplication;
  for(const header of headers){
  const put=(key,value)=>{const e=header.querySelector('[data-player="'+key+'"]');const text=value==null?'':String(value);if(e.textContent!==text)e.textContent=text;if(e.hidden!==!text)e.hidden=!text;};
  put('name',p?.name);put('level',Number.isFinite(Number(p?.level))&&p?.level!=null?'LVL '+Number(p.level):null);put('points',Number.isFinite(Number(p?.points))&&p?.points!=null?Number(p.points).toLocaleString('ru-RU')+' очков':null);put('status',p?.rank_name||(p?.in_top_10===true?'В ТОП-10':null));
  const src=$('profileAvatar'),avatar=header.querySelector('[data-player=avatar]');const available=!!p&&!!src&&!src.hidden&&src.complete&&src.naturalWidth>0;
  if(available&&avatar.src!==src.src)avatar.src=src.src;if(avatar.hidden!==!available)avatar.hidden=!available;
  }
 }
 let iframe=null,channel=null,runtimeOrigin=null,mounted=false,fullscreenEscapeEvent=null,savedOverflow='',pseudoAncestors=[],snakeParticipant=null;
 const player=()=>typeof currentApplication!=='undefined'?currentApplication:window.currentApplication;
 const snakeRelease=()=>new URL(runtime,location.href).pathname.match(/\/(snake-next-[a-f0-9]{12})\//)?.[1]||String(window.RYTNI_RELEASE||'unknown');
 // Narrow authenticated gateway, not an arbitrary RPC proxy. No token crosses the frame.
 async function snakeRanked(method,payload={}){
  if(!payload||typeof payload!=='object'||Array.isArray(payload))return {success:false,status:'invalid_request'};
  const p=player(),release=snakeRelease();
  if(!p?.id)return {success:false,status:'not_authenticated'};
  if(p.id!==snakeParticipant)return {success:false,status:'account_changed'};
  if(typeof callSupabaseRpc!=='function'||typeof getClientToken!=='function')return {success:false,status:'backend_unavailable'};
  const names={hub:'get_snake_product_hub_v1',start:'start_snake_product_attempt_v1',claim:'claim_snake_product_sponsor_v1',finish:'finish_snake_product_attempt_v1'};
  if(!Object.hasOwn(names,method))return {success:false,status:'invalid_request'};
  const args={p_participant_id:p.id};
  if(method!=='hub'){
   if(payload.release!==release)return {success:false,status:'release_mismatch'};
   Object.assign(args,{p_client_token:getClientToken(),p_release:release});
   if(method==='start'||method==='claim')args.p_request_id=payload.requestId;
   else{
    const audit={};for(const key of ['foods','length','max_combo','portal_uses','expansions','stage','bonuses','seed','final_hash'])if(payload[key]!==undefined)audit[key]=payload[key];
    Object.assign(args,{p_attempt_id:payload.attempt_id,p_score:payload.score,p_duration_ms:payload.duration_ms,p_ticks:payload.active_ticks??payload.ticks,p_audit:audit});
   }
  }
  try{const result=await callSupabaseRpc(names[method],args,10000,true,'authenticated',method==='hub');
   return player()?.id===p.id?result:{success:false,status:'account_changed'};
  }catch{return {success:false,status:'network_error'};}
 }
 function pseudoFullscreen(active){const stage=$('msNextStage');if(!stage)return;if(active&&!stage.classList.contains('ms-next-full')){savedOverflow=document.documentElement.style.overflow;for(let node=stage.parentElement;node;node=node.parentElement){const css=getComputedStyle(node);for(const property of ['transform','filter','perspective','contain'])if(css[property]&&css[property]!=='none'){pseudoAncestors.push([node,property,node.style.getPropertyValue(property),node.style.getPropertyPriority(property)]);node.style.setProperty(property,'none','important');}}stage.classList.add('ms-next-full');document.documentElement.style.overflow='hidden';}else if(!active&&stage.classList.contains('ms-next-full')){stage.classList.remove('ms-next-full');for(const [node,property,value,priority]of pseudoAncestors){if(value)node.style.setProperty(property,value,priority);else node.style.removeProperty(property);}pseudoAncestors=[];document.documentElement.style.overflow=savedOverflow;}}
 const Snake={
  activate(){const url=new URL(runtime,location.href);runtimeOrigin=url.origin;channel=crypto.randomUUID();snakeParticipant=player()?.id||null;url.searchParams.set('test','1');url.searchParams.set('host','1');url.searchParams.set('release',snakeRelease());url.searchParams.set('parent_origin',location.origin);url.searchParams.set('channel',channel);const query=new URLSearchParams(location.search);if(query.get('qa')==='1')url.searchParams.set('qa','1');if(query.get('arcade_preview')==='1')url.searchParams.set('mock','ready');iframe=document.createElement('iframe');iframe.title='Mushroom Snake';iframe.allow='fullscreen; autoplay; clipboard-write';iframe.src=url.href;$('msNextStage').replaceChildren(iframe);$('msNextSnake').hidden=false;},
  deactivate(){pseudoFullscreen(false);if(iframe){iframe.contentWindow?.postMessage({protocol,channel,type:'shutdown'},runtimeOrigin);iframe.remove();iframe=null;}channel=null;snakeParticipant=null;if($('msNextSnake'))$('msNextSnake').hidden=true;},
  best:()=>0
 };
 const registry={fly:{name:'Mushroom Fly',description:'Парите над волшебной долиной. Монеты, разломы и новые высоты.',art:'https://rytni.github.io/rytni-assets/grib/mushroom-snake-ui-v4-1/fly-cover.png',activate:()=>window.RytniMushroomFly?.activate(),deactivate:()=>window.RytniMushroomFly?.deactivate(),best:()=>window.RytniMushroomFly?.best()||0},snake:{name:'Mushroom Snake',description:'Расти. Рискуй. Забирай первое место.',art:'https://rytni.github.io/rytni-assets/grib/mushroom-snake-ui-v4/snake-cover.png',activate:()=>Snake.activate(),deactivate:()=>Snake.deactivate(),best:Snake.best}};
 const fullscreenStage=()=>Hub.selected==='fly'?document.querySelector('#msFlyWrap .rytni-arcade-stage'):Hub.selected==='snake'?$('msNextStage'):null;
 const Hub={selected:null,registry,fullscreenExitInProgress:false,snakeScreen:null,
  ownsFullscreenEscape(event){const stage=fullscreenStage();return event===fullscreenEscapeEvent||Boolean(stage&&(document.fullscreenElement===stage||stage.contains(document.fullscreenElement)||stage.classList.contains('is-pseudo-fullscreen')));},
  render(){if(!$('msHub'))return;$('msHub').innerHTML=`<header class="ms-next-heading"><h2>Две тропы. Один волшебный лес.</h2><p>Поднимитесь к облакам или отправьтесь по мицелиевым тропам.</p></header><div class="ms-next-cards">${Object.entries(registry).map(([id,g])=>`<article class="ms-next-card" data-game="${id}"><img src="${g.art}" alt="${g.name}" width="768" height="432"><div class="ms-next-copy"><h3>${g.name}</h3><p>${g.description}</p>${button('game-'+id,'Играть',true)}</div></article>`).join('')}</div>`;},
  select(id){if(!registry[id]||!this.visible())return;this.leave();this.selected=id;$('msHub').hidden=true;if(id==='fly')$('msFlyWrap').hidden=false;registry[id].activate();refreshPlayer();},
  leave(){const id=this.selected;this.selected=null;if(id)registry[id].deactivate();const full=document.fullscreenElement;if(full&&(full.closest('#msFlyWrap')||full.closest('#msNextSnake')))document.exitFullscreen().catch(()=>{});const pseudo=document.querySelector('#msFlyWrap .is-pseudo-fullscreen');if(pseudo){pseudo.classList.remove('is-pseudo-fullscreen');document.documentElement.style.overflow='';}if($('msFlyWrap'))$('msFlyWrap').hidden=true;this.snakeScreen=null;if($('msHub')){$('msHub').hidden=false;this.render();}},
  visible(){const panel=$('progressionPanelArcade');if(!panel)return false;for(let p=panel;p instanceof Element;p=p.parentElement){if(p.hidden||getComputedStyle(p).display==='none'||getComputedStyle(p).visibility==='hidden')return false;}return true;}
 };
 window.RytniArcadeHub=Hub;
 function mount(){if(mounted)return;const panel=$('progressionPanelArcade'),fly=$('rytniArcadeHost');if(!panel||!fly)return;mounted=true;
  const wrap=document.createElement('div');wrap.id='msFlyWrap';wrap.hidden=true;fly.before(wrap);wrap.innerHTML=playerHeader();wrap.append(fly);
  const hub=document.createElement('section');hub.id='msHub';hub.setAttribute('aria-label','Выбор игры');panel.prepend(hub);
  const snake=document.createElement('section');snake.id='msNextSnake';snake.hidden=true;snake.innerHTML=playerHeader()+`<div id="msNextStage" class="ms-next-stage"></div>`;panel.append(snake);Hub.render();window.RytniMushroomFly?.deactivate();refreshPlayer();
  panel.addEventListener('click',e=>{const action=e.target.closest('[data-ms-action]')?.dataset.msAction;if(action==='hub')Hub.leave();else if(action?.startsWith('game-'))Hub.select(action.slice(5));});
 }
 window.addEventListener('message',async e=>{
  if(!iframe||Hub.selected!=='snake'||e.source!==iframe.contentWindow||e.origin!==runtimeOrigin||e.data?.protocol!==protocol||e.data?.channel!==channel)return;
  if(e.data.type==='ranked'){
   const target=iframe,session=channel,origin=runtimeOrigin;
   const result=await snakeRanked(e.data.method,e.data.payload);
   if(iframe===target&&channel===session)target.contentWindow.postMessage({protocol,channel,type:'ranked-result',request:e.data.request,result},origin);
  }else if(e.data.type==='leave')Hub.leave();else if(e.data.type==='state')Hub.snakeScreen=e.data.screen;else if(e.data.type==='ready')iframe.focus();else if(e.data.type==='fullscreen'){pseudoFullscreen(e.data.active===true);iframe.contentWindow.postMessage({protocol,channel,type:'fullscreen-ack',request:e.data.request,active:e.data.active===true},runtimeOrigin);}
 });
 window.addEventListener('keydown',e=>{if(e.key!=='Escape'){fullscreenEscapeEvent=null;return;}const stage=fullscreenStage();if(!stage||Hub.selected!=='fly')return;const native=document.fullscreenElement===stage,pseudo=stage.classList.contains('is-pseudo-fullscreen');if(!native&&!pseudo)return;fullscreenEscapeEvent=e;e.preventDefault();e.stopImmediatePropagation();Hub.fullscreenExitInProgress=true;Promise.resolve(native?document.exitFullscreen():window.RytniMushroomFly?.exitFullscreen?.()).finally(()=>Hub.fullscreenExitInProgress=false);},true);
 document.addEventListener('fullscreenchange',()=>{Hub.fullscreenExitInProgress=false;const diag=window.__RYTNI_ARCADE_DIAG__;if(diag)diag.host.fullscreenChanges++;});
 let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;mount();if(Hub.selected&&!Hub.visible())Hub.leave();else if(Hub.selected)refreshPlayer();});}).observe(document.body,{childList:true,attributes:true,subtree:true,attributeFilter:['hidden','class','style']});
 window.addEventListener('pagehide',()=>Hub.leave());window.addEventListener('pageshow',e=>{if(e.persisted)Hub.leave();});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})();
</script>
