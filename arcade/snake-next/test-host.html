<!-- Snake Next TEST Hub. The current Fly block and legacy rollback stay untouched. -->
<style>
#msHub,#msNextSnake,#msFlyWrap{box-sizing:border-box;color:#fff1c6;font:500 15px/1.45 system-ui,sans-serif}
#msHub[hidden],#msNextSnake[hidden],#msFlyWrap[hidden]{display:none!important}
#msHub{padding:22px;border:1px solid #92703a;border-radius:20px;background:linear-gradient(130deg,#241910,#0f1715)}
.ms-next-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.ms-next-heading h2{font:700 clamp(24px,4vw,38px)/1.1 Georgia,serif;margin:6px 0}.ms-next-heading p{max-width:340px;color:#c8c4a3;margin:0}
.ms-next-cards{display:flex;gap:20px}.ms-next-card{flex:1;min-width:0;border:1px solid #a58347;border-radius:18px;overflow:hidden;background:#1e180e}.ms-next-card img{width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#10251b}.ms-next-card[data-game=snake] img{object-fit:cover}.ms-next-copy{padding:20px}.ms-next-copy h3{font:700 28px Georgia,serif;margin:0 0 8px}.ms-next-copy p{color:#d5ceb0;margin:0 0 14px}
.ms-next-btn{min-height:48px;min-width:48px;border:1px solid #a77d42;border-radius:10px;padding:10px 20px;background:linear-gradient(#714625,#342013);color:#fff0c5;font:700 14px system-ui,sans-serif;cursor:pointer}.ms-next-btn:focus-visible{outline:3px solid #e8df93;outline-offset:2px}.ms-next-primary{background:linear-gradient(#86bc31,#3b741a);border-color:#d9e584;min-height:54px}
.ms-next-backbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.ms-next-backbar small{font-size:11px;color:#b1c995}.ms-next-stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#06251d;border-radius:14px}.ms-next-stage iframe{position:absolute;inset:0;border:0;width:100%;height:100%;display:block}.ms-next-stage:fullscreen,.ms-next-stage.ms-next-full{width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0}.ms-next-stage.ms-next-full{position:fixed;inset:0;z-index:2147483000}
@media(max-width:560px){.ms-next-cards{flex-direction:column}.ms-next-heading{display:block}.ms-next-heading p{margin-top:10px}.ms-next-copy{padding:14px}}
@media(max-width:560px) and (orientation:portrait){.ms-next-stage{aspect-ratio:9/16}}
</style>
<script>
(() => {
 'use strict';
 if(window.RytniArcadeHub)return;
 const runtime='__SNAKE_NEXT_RUNTIME_URL__',protocol='snake-next-test-v1';
 const $=id=>document.getElementById(id);
 const button=(action,text,primary=false)=>`<button type="button" class="ms-next-btn${primary?' ms-next-primary':''}" data-ms-action="${action}">${text}</button>`;
 let iframe=null,channel=null,runtimeOrigin=null,mounted=false,fullscreenEscapeEvent=null,savedOverflow='',pseudoAncestors=[];
 function pseudoFullscreen(active){const stage=$('msNextStage');if(!stage)return;if(active&&!stage.classList.contains('ms-next-full')){savedOverflow=document.documentElement.style.overflow;for(let node=stage.parentElement;node;node=node.parentElement){const css=getComputedStyle(node);for(const property of ['transform','filter','perspective','contain'])if(css[property]&&css[property]!=='none'){pseudoAncestors.push([node,property,node.style.getPropertyValue(property),node.style.getPropertyPriority(property)]);node.style.setProperty(property,'none','important');}}stage.classList.add('ms-next-full');document.documentElement.style.overflow='hidden';}else if(!active&&stage.classList.contains('ms-next-full')){stage.classList.remove('ms-next-full');for(const [node,property,value,priority]of pseudoAncestors){if(value)node.style.setProperty(property,value,priority);else node.style.removeProperty(property);}pseudoAncestors=[];document.documentElement.style.overflow=savedOverflow;}}
 const Snake={
  activate(){const url=new URL(runtime,location.href);runtimeOrigin=url.origin;channel=crypto.randomUUID();url.searchParams.set('test','1');url.searchParams.set('host','1');url.searchParams.set('parent_origin',location.origin);url.searchParams.set('channel',channel);iframe=document.createElement('iframe');iframe.title='Mushroom Snake';iframe.allow='fullscreen; autoplay; clipboard-write';iframe.src=url.href;$('msNextStage').replaceChildren(iframe);$('msNextSnake').hidden=false;},
  deactivate(){pseudoFullscreen(false);if(iframe){iframe.contentWindow?.postMessage({protocol,channel,type:'shutdown'},runtimeOrigin);iframe.remove();iframe=null;}channel=null;if($('msNextSnake'))$('msNextSnake').hidden=true;},
  best:()=>0
 };
 const registry={fly:{name:'Mushroom Fly',description:'Парите над волшебной долиной. Монеты, разломы и новые высоты.',art:'https://rytni.github.io/rytni-assets/grib/mushroom-snake-v1/fly-card.png',activate:()=>window.RytniMushroomFly?.activate(),deactivate:()=>window.RytniMushroomFly?.deactivate(),best:()=>window.RytniMushroomFly?.best()||0},snake:{name:'Mushroom Snake',description:'Расти. Рискуй. Забирай первое место.',art:'https://rytni.github.io/rytni-assets/grib/mushroom-snake-ui-v3/snake-cover.png',activate:()=>Snake.activate(),deactivate:()=>Snake.deactivate(),best:Snake.best}};
 const fullscreenStage=()=>Hub.selected==='fly'?document.querySelector('#msFlyWrap .rytni-arcade-stage'):Hub.selected==='snake'?$('msNextStage'):null;
 const Hub={selected:null,registry,fullscreenExitInProgress:false,snakeScreen:null,
  ownsFullscreenEscape(event){const stage=fullscreenStage();return event===fullscreenEscapeEvent||Boolean(stage&&(document.fullscreenElement===stage||stage.contains(document.fullscreenElement)||stage.classList.contains('is-pseudo-fullscreen')));},
  render(){if(!$('msHub'))return;$('msHub').innerHTML=`<header class="ms-next-heading"><h2>Две тропы. Один волшебный лес.</h2><p>Поднимитесь к облакам или отправьтесь по мицелиевым тропам.</p></header><div class="ms-next-cards">${Object.entries(registry).map(([id,g])=>`<article class="ms-next-card" data-game="${id}"><img src="${g.art}" alt="${g.name}" width="768" height="432"><div class="ms-next-copy"><h3>${g.name}</h3><p>${g.description}</p>${button('game-'+id,'Играть',true)}</div></article>`).join('')}</div>`;},
  select(id){if(!registry[id]||!this.visible())return;this.leave();this.selected=id;$('msHub').hidden=true;if(id==='fly')$('msFlyWrap').hidden=false;registry[id].activate();},
  leave(){const id=this.selected;this.selected=null;if(id)registry[id].deactivate();const full=document.fullscreenElement;if(full&&(full.closest('#msFlyWrap')||full.closest('#msNextSnake')))document.exitFullscreen().catch(()=>{});const pseudo=document.querySelector('#msFlyWrap .is-pseudo-fullscreen');if(pseudo){pseudo.classList.remove('is-pseudo-fullscreen');document.documentElement.style.overflow='';}if($('msFlyWrap'))$('msFlyWrap').hidden=true;this.snakeScreen=null;if($('msHub')){$('msHub').hidden=false;this.render();}},
  visible(){const panel=$('progressionPanelArcade');if(!panel)return false;for(let p=panel;p instanceof Element;p=p.parentElement){if(p.hidden||getComputedStyle(p).display==='none'||getComputedStyle(p).visibility==='hidden')return false;}return true;}
 };
 window.RytniArcadeHub=Hub;
 function mount(){if(mounted)return;const panel=$('progressionPanelArcade'),fly=$('rytniArcadeHost');if(!panel||!fly)return;mounted=true;
  const wrap=document.createElement('div');wrap.id='msFlyWrap';wrap.hidden=true;fly.before(wrap);wrap.innerHTML=`<div class="ms-next-backbar">${button('hub','Аркада')}<small>Mushroom Fly</small></div>`;wrap.append(fly);
  const hub=document.createElement('section');hub.id='msHub';hub.setAttribute('aria-label','Выбор игры');panel.prepend(hub);
  const snake=document.createElement('section');snake.id='msNextSnake';snake.hidden=true;snake.innerHTML=`<div class="ms-next-backbar">${button('hub','Аркада')}<small>TEST · рейтинг демонстрационный</small></div><div id="msNextStage" class="ms-next-stage"></div>`;panel.append(snake);Hub.render();window.RytniMushroomFly?.deactivate();
  panel.addEventListener('click',e=>{const action=e.target.closest('[data-ms-action]')?.dataset.msAction;if(action==='hub')Hub.leave();else if(action?.startsWith('game-'))Hub.select(action.slice(5));});
 }
 window.addEventListener('message',e=>{if(!iframe||Hub.selected!=='snake'||e.source!==iframe.contentWindow||e.origin!==runtimeOrigin||e.data?.protocol!==protocol||e.data?.channel!==channel)return;if(e.data.type==='leave')Hub.leave();else if(e.data.type==='state')Hub.snakeScreen=e.data.screen;else if(e.data.type==='ready')iframe.focus();else if(e.data.type==='fullscreen'){pseudoFullscreen(e.data.active===true);iframe.contentWindow.postMessage({protocol,channel,type:'fullscreen-ack',request:e.data.request,active:e.data.active===true},runtimeOrigin);}});
 window.addEventListener('keydown',e=>{if(e.key!=='Escape'){fullscreenEscapeEvent=null;return;}const stage=fullscreenStage();if(!stage||Hub.selected!=='fly')return;const native=document.fullscreenElement===stage,pseudo=stage.classList.contains('is-pseudo-fullscreen');if(!native&&!pseudo)return;fullscreenEscapeEvent=e;e.preventDefault();e.stopImmediatePropagation();Hub.fullscreenExitInProgress=true;Promise.resolve(native?document.exitFullscreen():window.RytniMushroomFly?.exitFullscreen?.()).finally(()=>Hub.fullscreenExitInProgress=false);},true);
 document.addEventListener('fullscreenchange',()=>{Hub.fullscreenExitInProgress=false;const diag=window.__RYTNI_ARCADE_DIAG__;if(diag)diag.host.fullscreenChanges++;});
 let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;mount();if(Hub.selected&&!Hub.visible())Hub.leave();});}).observe(document.body,{childList:true,attributes:true,subtree:true,attributeFilter:['hidden','class','style']});
 window.addEventListener('pagehide',()=>Hub.leave());window.addEventListener('pageshow',e=>{if(e.persisted)Hub.leave();});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})();
</script>
