<script>
(()=>{
  'use strict';
  if(window.RytniArcadeHub)return;
  const BASE='https://rytni.github.io/rytni-assets/grib/mushroom-snake-v1/';
  const ICON='https://rytni.github.io/rytni-assets/grib/mushroom-fly-v2/ui/icons-recovery-v1/';
  const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('ru-RU');
  const icon=name=>`<img src="${ICON+name}.png" alt="" aria-hidden="true">`;
  const button=(action,text,primary=false,img='')=>`<button type="button" class="ms-btn${primary?' ms-primary':''}" data-ms-action="${action}">${img?icon(img):''}${text}</button>`;
  const bestKey='rytni_mushroom_snake_training_best_v1';
  function readBest(){try{return Math.max(0,Number(localStorage.getItem(bestKey))||0);}catch{return 0;}}
  const W=1200,H=675,R=17,SPACING=19,MAX_BODY=110,TRAIL_SIZE=32768;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),angleDiff=a=>Math.atan2(Math.sin(a),Math.cos(a));
  class SnakeEngine{
    constructor(seed=1){this.trailX=new Float32Array(TRAIL_SIZE);this.trailY=new Float32Array(TRAIL_SIZE);this.bx=new Float32Array(MAX_BODY);this.by=new Float32Array(MAX_BODY);this.food=Array.from({length:25},()=>({x:0,y:0,kind:'food',cool:0}));this.hazards=Array.from({length:12},()=>({x:0,y:0,r:28,active:false,warn:0}));this.reset(seed);}
    random(){this.seed=(Math.imul(1664525,this.seed)+1013904223)>>>0;return this.seed/4294967296;}
    reset(seed=1){this.seed=seed>>>0;this.x=530;this.y=H/2;this.angle=0;this.target=0;this.length=10;this.foodCount=0;this.time=0;this.points=0;this.score=0;this.combo=0;this.maxCombo=0;this.comboUntil=0;this.bonuses=0;this.magnet=0;this.drunk=0;this.alive=true;this.reason='';this.hazardClock=18;this.head=0;this.distance=0;this.speed=95;this.events=[];for(let i=0;i<TRAIL_SIZE;i++){this.trailX[(TRAIL_SIZE-i)%TRAIL_SIZE]=this.x-i*2;this.trailY[(TRAIL_SIZE-i)%TRAIL_SIZE]=this.y;}for(const h of this.hazards)h.active=false;this.updateBody();for(let i=0;i<this.food.length;i++){this.food[i].kind=i===23?'magnet':i===24?'drunk':'food';this.place(this.food[i]);}}
    scoreNow(){return Math.floor(this.points+this.time*2);}
    free(x,y,padding=0){if(x<45+padding||x>W-45-padding||y<45+padding||y>H-45-padding||Math.hypot(x-this.x,y-this.y)<100+padding)return false;for(const h of this.hazards)if(h.active&&Math.hypot(x-h.x,y-h.y)<h.r+40+padding)return false;for(let i=0;i<this.length;i++)if(Math.hypot(x-this.bx[i],y-this.by[i])<40+padding)return false;return true;}
    place(item){for(let i=0;i<120;i++){const x=55+this.random()*(W-110),y=55+this.random()*(H-110);if(this.free(x,y)){item.x=x;item.y=y;item.cool=0;return true;}}item.cool=1;return false;}
    updateBody(){for(let i=0;i<this.length;i++){const distance=i*SPACING,steps=distance/2,index=(this.head-Math.floor(steps)+TRAIL_SIZE)%TRAIL_SIZE,prev=(index-1+TRAIL_SIZE)%TRAIL_SIZE,f=steps%1;this.bx[i]=this.trailX[index]*(1-f)+this.trailX[prev]*f;this.by[i]=this.trailY[index]*(1-f)+this.trailY[prev]*f;}}
    die(reason){this.alive=false;this.reason=reason;this.events.push('death');}
    tick(dt){if(!this.alive)return;this.time+=dt;this.magnet=Math.max(0,this.magnet-dt);this.drunk=Math.max(0,this.drunk-dt);if(this.time>this.comboUntil)this.combo=0;this.speed=95+50*(1-Math.exp(-this.time/220));const turn=2.65,delta=clamp(angleDiff(this.target-this.angle),-turn*dt,turn*dt);this.angle+=delta;const sway=this.drunk>0?Math.sin(this.time*4)*.22:0,heading=this.angle+sway,move=this.speed*dt;this.x+=Math.cos(heading)*move;this.y+=Math.sin(heading)*move;this.distance+=move;
      while(this.distance>=2){this.distance-=2;this.head=(this.head+1)%TRAIL_SIZE;this.trailX[this.head]=this.x-Math.cos(heading)*this.distance;this.trailY[this.head]=this.y-Math.sin(heading)*this.distance;}this.updateBody();this.bx[0]=this.x;this.by[0]=this.y;
      if(this.x<R+20||this.x>W-R-20||this.y<R+20||this.y>H-R-20){this.die('Лесная граница');return;}
      for(let i=8;i<this.length;i++){if(Math.hypot(this.x-this.bx[i],this.y-this.by[i])<R+12){this.die('Собственный хвост');return;}}
      for(const h of this.hazards){if(!h.active)continue;if(h.warn>0)h.warn-=dt;else if(Math.hypot(this.x-h.x,this.y-h.y)<R+h.r){this.die('Лесной камень');return;}}
      for(const item of this.food){if(item.cool>0){item.cool-=dt;if(item.cool<=0)this.place(item);continue;}const d=Math.hypot(item.x-this.x,item.y-this.y);if(item.kind==='food'&&this.magnet>0&&d<160&&d>1){const shift=Math.min(d,170*dt);item.x+=(this.x-item.x)/d*shift;item.y+=(this.y-item.y)/d*shift;}if(d<R+12){if(item.kind==='food'){this.foodCount++;this.combo=this.time<this.comboUntil?Math.min(10,this.combo+1):1;this.maxCombo=Math.max(this.maxCombo,this.combo);this.comboUntil=this.time+Math.max(3.2,7-this.time/160);this.points+=20+5*(this.combo-1);this.length=Math.min(MAX_BODY,this.length+1);this.events.push(this.combo>1?'combo':'pickup');item.cool=.3;}else if(item.kind==='magnet'){this.magnet=7;this.bonuses++;this.events.push('magnet');item.cool=15;}else{this.drunk=4;this.events.push('drunk');item.cool=18;}}}
      this.hazardClock-=dt;if(this.hazardClock<=0){this.hazardClock=22;const count=Math.min(10,1+Math.floor(this.time/45)),h=this.hazards.find(h=>!h.active);if(h&&this.hazards.filter(h=>h.active).length<count&&this.place(h)){h.active=true;h.warn=2.5;this.events.push('warning');}}this.score=this.scoreNow();
    }
  }
  const Snake={active:false,state:'menu',raf:0,epoch:0,assets:{},ready:null,engine:new SnakeEngine(1),keys:new Set(),pointer:null,last:0,acc:0,quality:'balanced',frameCount:0,frameTotal:0,frameMs:0,cpu:0,bad:0,particles:Array.from({length:48},()=>({life:0,x:0,y:0,vx:0,vy:0})),best:readBest(),audio:null,
    mount(){if($('msSnake'))return;const section=document.createElement('section');section.id='msSnake';section.dataset.msView='snake';section.hidden=true;section.innerHTML=`<div class="ms-backbar">${button('hub','Аркада',false,'home')}<small>Тренировка · личный рекорд на устройстве</small></div><div class="ms-stage" id="msStage" style="--ms-key:url('${BASE}snake-card.png')"><div class="ms-hud">${button('pause','Пауза')}${button('fullscreen','Экран',false,'fullscreen')}<span class="ms-hud-stat">Счёт <b id="msScore">0</b></span><span class="ms-hud-stat">Длина <b id="msLength">10</b></span><span class="ms-hud-spacer"></span><span class="ms-effects" id="msEffects"></span></div><canvas id="msCanvas" class="ms-canvas" aria-label="Арена Mushroom Snake"></canvas><div class="ms-overlay ms-title" id="msOverlay"><div class="ms-panel" id="msPanel"></div></div><output id="msPerf" class="ms-perf" hidden></output></div>`;$('progressionPanelArcade').append(section);this.canvas=$('msCanvas');this.ctx=this.canvas.getContext('2d',{alpha:false});this.background=document.createElement('canvas');this.bgCtx=this.background.getContext('2d',{alpha:false});},
    async preload(){if(this.ready)return this.ready;this.ready=(async()=>{await Promise.all(['arena','head','segment','food','magnet','drunk'].map(async name=>{const image=new Image();image.crossOrigin='anonymous';image.src=BASE+name+'.png';await image.decode();if(name==='arena')this.assets[name]=image;else{const cache=document.createElement('canvas'),scale=128/Math.max(image.width,image.height);cache.width=Math.round(image.width*scale);cache.height=Math.round(image.height*scale);cache.getContext('2d').drawImage(image,0,0,cache.width,cache.height);this.assets[name]=cache;}}));this.audio=window.RytniMushroomFly?.audio;const clips={};for(const name of ['ambience','pickup','combo','magnet','drunk','death','warning'])clips['snake-'+name]=BASE+'audio/'+name+'.wav';await this.audio?.loadClips(clips);})();try{await this.ready;}catch(error){this.ready=null;throw error;}},
    activate(){this.mount();this.audio=window.RytniMushroomFly?.audio;this.active=true;this.epoch++;this.state='menu';this.abort=new AbortController();const opt={signal:this.abort.signal};$('msSnake').hidden=false;this.keys.clear();this.pointer=null;this.canvas.addEventListener('pointerdown',e=>this.point(e,true),opt);this.canvas.addEventListener('pointermove',e=>this.point(e,false),opt);for(const event of ['pointerup','pointercancel','lostpointercapture'])this.canvas.addEventListener(event,()=>{this.pointer=null;},opt);window.addEventListener('keydown',e=>{if(!this.active)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)){e.preventDefault();this.keys.add(e.code);}if(e.code==='Escape'||e.code==='Space'){if(this.state==='play')this.pause();else if(this.state==='pause')this.resume();}},opt);window.addEventListener('keyup',e=>this.keys.delete(e.code),opt);window.addEventListener('blur',()=>this.pause(),opt);document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause();},opt);document.addEventListener('fullscreenchange',()=>this.viewport(),opt);window.addEventListener('resize',()=>this.viewport(),opt);window.visualViewport?.addEventListener('resize',()=>this.viewport(),opt);this.resizeObserver=new ResizeObserver(()=>this.viewport());this.resizeObserver.observe($('msStage'));this.menu();const epoch=this.epoch;this.preload().then(()=>{if(this.active&&epoch===this.epoch){this.view=null;this.fit();this.paint();}}).catch(()=>{if(this.active)this.menu('Не удалось загрузить лес. Проверьте соединение и повторите запуск.');});},

    show(html,title=false){$('msOverlay').hidden=false;$('msOverlay').classList.toggle('ms-title',title);$('msPanel').innerHTML=html;$('msPanel').scrollTop=0;},
    menu(message=''){this.pendingStart=false;this.state='menu';cancelAnimationFrame(this.raf);this.raf=0;this.audio?.stop();this.show(`<img class="ms-hero" src="${BASE}head.png" alt="Грибная змейка"><span class="ms-eyebrow">Новая тропа · Mushroom universe</span><h2>Mushroom Snake</h2><p>Собирайте светящиеся споры. Растите, собирайте комбо и оставляйте хвост позади.</p><p>Стрелки / WASD — направление. Мышь — ведите к курсору. На телефоне удерживайте палец и ведите его в сторону поворота.</p><div class="ms-rules"><div class="ms-rule"><img src="${BASE}magnet.png" alt=""><strong>Мицелиевый магнит</strong>7 секунд притягивает споры.</div><div class="ms-rule ms-danger"><img src="${BASE}drunk.png" alt=""><strong>Пьяный гриб</strong>Обходите фиолетовые грибы: 4 секунды покачивания.</div></div><div class="ms-actions">${button('start','Начать тренировку',true,'play')}${button('sound',this.audio?.get().muted?'Включить звук':'Выключить звук',false,'sound-on')}</div><div class="ms-footer">Рекорд на устройстве: ${fmt(this.best)} · Рейтинговые попытки не расходуются.</div>${message?`<p role="status">${message}</p>`:''}`,true);},
    mobile(){return navigator.maxTouchPoints>0&&(matchMedia('(pointer:coarse)').matches||Math.min(screen.width,screen.height)<=900);},

    async fullscreen(){const stage=$('msStage');if(this.full()){this.exitFullscreen();return;}if(stage.requestFullscreen){try{await stage.requestFullscreen();}catch{stage.classList.add('ms-full');}}else stage.classList.add('ms-full');try{await screen.orientation?.lock?.('landscape');}catch{}this.viewport();},
    exitFullscreen(){if(document.fullscreenElement===$('msStage'))document.exitFullscreen().catch(()=>{});$('msStage')?.classList.remove('ms-full');try{screen.orientation?.unlock?.();}catch{}},
    async start(){if(!this.active||this.state==='loading')return;if(this.mobile()&&(!this.full()||innerHeight>innerWidth)){this.pendingStart=true;this.state='rotate';this.show(`<span class="ms-eyebrow">Лес ждёт</span><h2>Горизонтальный экран</h2><p>Разверните телефон и откройте полный экран, чтобы видеть всю арену.</p><div class="ms-actions">${button('enter','Открыть полный экран',true,'fullscreen')}${button('menu','Главное меню')}</div>`);return;}const epoch=this.epoch,audioStart=this.audio?.startExternal();this.state='loading';this.show('<h2>Пробуждаем лес…</h2><p>Готовим споры и звуки.</p>');try{await this.preload();if(!this.active||epoch!==this.epoch)return;await audioStart;if(!this.active||epoch!==this.epoch){this.audio?.stop();return;}this.audio?.playExternal('snake-ambience',true);this.engine.reset((Date.now()^0x7fa23)>>>0);this.view=null;this.quality=this.mobile()?'balanced':'high';this.bad=0;this.frameCount=0;this.frameTotal=0;this.state='play';this.acc=0;this.last=0;this.keys.clear();this.pointer=null;for(const p of this.particles)p.life=0;$('msOverlay').hidden=true;this.fit();this.raf=requestAnimationFrame(t=>this.frame(t));}catch{this.audio?.stop();if(this.active)this.menu('Загрузка не завершена. Попробуйте ещё раз.');}},
    async enter(){this.audio?.startExternal();await this.fullscreen();if(this.pendingStart&&innerWidth>innerHeight){this.pendingStart=false;this.start();}else if(this.state==='pause'&&innerWidth>innerHeight)this.resume();},
    pause(){if(this.state!=='play')return;this.state='pause';cancelAnimationFrame(this.raf);this.raf=0;this.audio?.stop();this.keys.clear();this.pointer=null;this.show(`<span class="ms-eyebrow">Тропа на паузе</span><h2>Передохнём?</h2><p>Ваш лес и хвост дождутся вас.</p><div class="ms-actions">${button('resume','Продолжить',true,'continue')}${button('start','Начать заново',false,'restart')}${button('hub','Аркада',false,'home')}</div>`);},
    async resume(){if(this.state!=='pause')return;if(this.mobile()&&(!this.full()||innerHeight>innerWidth)){this.show(`<h2>Вернитесь на тропу</h2><p>Для продолжения нужен горизонтальный полный экран.</p><div class="ms-actions">${button('enter','Полный экран',true,'fullscreen')}${button('hub','Аркада')}</div>`);return;}const epoch=this.epoch;this.state='resuming';await this.audio?.startExternal();if(!this.active||epoch!==this.epoch){this.audio?.stop();return;}this.audio?.playExternal('snake-ambience',true);this.state='play';this.last=0;this.acc=0;$('msOverlay').hidden=true;this.raf=requestAnimationFrame(t=>this.frame(t));},
    result(){this.state='result';cancelAnimationFrame(this.raf);this.raf=0;this.audio?.stop();const e=this.engine;this.best=Math.max(this.best,e.scoreNow());try{localStorage.setItem(bestKey,String(this.best));}catch{}this.show(`<span class="ms-eyebrow">Тренировочная тропа пройдена</span><h2>Лес запомнит ваш след</h2><p>${e.reason}. Новая тропа — новый рекорд.</p><div class="ms-results"><div class="ms-score">Итоговый счёт<b>${fmt(e.scoreNow())}</b></div><div>Длина<b>${e.length}</b></div><div>Собрано спор<b>${e.foodCount}</b></div><div>Лучшее комбо<b>×${e.maxCombo}</b></div><div>Бонусы<b>${e.bonuses}</b></div><div>Личный рекорд<b>${fmt(this.best)}</b></div></div><div class="ms-actions">${button('start','Играть снова',true,'play')}${button('hub','Аркада',false,'home')}</div>`);const epoch=this.epoch;this.audio?.startExternal().then(()=>{if(this.active&&epoch===this.epoch&&this.state==='result')this.audio?.playExternal('snake-death');else if(!this.active)this.audio?.stop();});},
    point(event,down){if(this.state!=='play')return;if(event.pointerType==='touch'){if(down){this.pointer={x:event.clientX,y:event.clientY};this.canvas.setPointerCapture(event.pointerId);}else if(this.pointer){const dx=event.clientX-this.pointer.x,dy=event.clientY-this.pointer.y;if(Math.hypot(dx,dy)>9)this.engine.target=Math.atan2(dy,dx);}}else{const r=this.canvas.getBoundingClientRect(),x=(event.clientX-r.left-this.view.x)/this.view.scale,y=(event.clientY-r.top-this.view.y)/this.view.scale;if(Math.hypot(x-this.engine.x,y-this.engine.y)>10)this.engine.target=Math.atan2(y-this.engine.y,x-this.engine.x);}},
    viewport(){if(!this.active)return;if(this.state==='play'&&this.mobile()&&(!this.full()||innerHeight>innerWidth))this.pause();if(this.pendingStart&&this.full()&&innerWidth>innerHeight){this.pendingStart=false;this.start();}this.fit();this.paint();},
    fit(){if(!this.canvas)return;const w=this.canvas.clientWidth,h=this.canvas.clientHeight;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,this.mobile()?1.5:2),pw=Math.round(w*dpr),ph=Math.round(h*dpr);if(this.canvas.width===pw&&this.canvas.height===ph&&this.view)return;this.canvas.width=pw;this.canvas.height=ph;this.view={scale:Math.min(w/W,h/H),x:(w-W*Math.min(w/W,h/H))/2,y:(h-H*Math.min(w/W,h/H))/2,dpr,w,h};this.background.width=pw;this.background.height=ph;const c=this.bgCtx;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#13241d';c.fillRect(0,0,w,h);const image=this.assets.arena;if(image){const s=Math.max(w/image.width,h/image.height);c.drawImage(image,(w-image.width*s)/2,(h-image.height*s)/2,image.width*s,image.height*s);}c.fillStyle='#08211777';c.fillRect(0,0,w,h);c.save();c.translate(this.view.x,this.view.y);c.scale(this.view.scale,this.view.scale);c.strokeStyle='#afaa60';c.lineWidth=5;c.strokeRect(20,20,W-40,H-40);c.strokeStyle='#375b31';c.lineWidth=10;c.strokeRect(12,12,W-24,H-24);c.restore();},
    frame(now){this.raf=0;if(!this.active||this.state!=='play')return;const start=performance.now(),dt=this.last?Math.min(.15,(now-this.last)/1000):0;this.last=now;const left=this.keys.has('ArrowLeft')||this.keys.has('KeyA'),right=this.keys.has('ArrowRight')||this.keys.has('KeyD'),up=this.keys.has('ArrowUp')||this.keys.has('KeyW'),down=this.keys.has('ArrowDown')||this.keys.has('KeyS');if(left||right||up||down)this.engine.target=Math.atan2(Number(down)-Number(up),Number(right)-Number(left));this.acc+=dt;while(this.acc>=1/60&&this.engine.alive){this.engine.tick(1/60);this.acc-=1/60;}for(const event of this.engine.events){if(event!=='death')this.audio?.playExternal('snake-'+event);if(event==='pickup'||event==='combo'||event==='magnet'){let n=0;for(const p of this.particles){if(p.life>0)continue;p.life=.45;p.x=this.engine.x;p.y=this.engine.y;p.vx=Math.cos(n*2.4)*40;p.vy=Math.sin(n*2.4)*40;if(++n>=(this.quality==='low'?3:8))break;}}}this.engine.events.length=0;for(const p of this.particles)if(p.life>0){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}this.paint();this.cpu=performance.now()-start;this.frameTotal+=dt*1000;this.frameCount++;if(this.frameTotal>=2000){this.frameMs=this.frameTotal/this.frameCount;this.bad=this.frameMs>24?this.bad+1:0;if(this.bad>=2)this.quality='low';this.frameCount=0;this.frameTotal=0;}if(now-(this.hudAt||0)>120){this.hudAt=now;this.hud();}if(!this.engine.alive){this.hud();this.result();return;}this.raf=requestAnimationFrame(t=>this.frame(t));},
    hud(){const e=this.engine;$('msScore').textContent=fmt(e.scoreNow());$('msLength').textContent=e.length;$('msEffects').textContent=(e.magnet>0?'Магнит '+Math.ceil(e.magnet)+'с · ':'')+(e.drunk>0?'Покачивание '+Math.ceil(e.drunk)+'с · ':'')+(e.combo>1?'Комбо ×'+e.combo:'');if(new URLSearchParams(location.search).get('mf_perf')==='1'){$('msPerf').hidden=false;$('msPerf').textContent=`SNAKE ${this.quality.toUpperCase()} · ${this.frameMs?(1000/this.frameMs).toFixed(0):'—'} FPS · ${this.frameMs.toFixed(1)} ms\nCPU ${this.cpu.toFixed(1)} ms · DPR ${this.view?.dpr} · ${this.engine.length} segments`; }},
    sprite(name,x,y,size,angle=0){const image=this.assets[name];if(!image)return;const c=this.ctx;c.save();c.translate(x,y);c.rotate(angle);const k=size/Math.max(image.width,image.height),w=image.width*k,h=image.height*k;c.drawImage(image,-w/2,-h/2,w,h);c.restore();},
    paint(){if(!this.view)return;const c=this.ctx,v=this.view,e=this.engine;c.setTransform(1,0,0,1,0,0);c.drawImage(this.background,0,0);c.setTransform(v.dpr*v.scale,0,0,v.dpr*v.scale,v.dpr*v.x,v.dpr*v.y);for(const h of e.hazards){if(!h.active)continue;c.globalAlpha=h.warn>0?.45+.2*Math.sin(e.time*10):1;c.fillStyle='#645a52';c.strokeStyle=h.warn>0?'#ffbe76':'#9a9b76';c.lineWidth=4;c.beginPath();c.arc(h.x,h.y,h.r,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#77874b';c.beginPath();c.ellipse(h.x-8,h.y-8,16,8,-.5,0,Math.PI*2);c.fill();}c.globalAlpha=1;for(const item of e.food){if(item.cool>0)continue;if(item.kind==='drunk'){c.strokeStyle='#ed9dc4';c.setLineDash([4,5]);c.lineWidth=2;c.beginPath();c.arc(item.x,item.y,23,0,Math.PI*2);c.stroke();c.setLineDash([]);}this.sprite(item.kind,item.x,item.y,item.kind==='food'?32:52);}if(e.magnet>0){c.strokeStyle='#b3df6477';c.lineWidth=2;c.beginPath();c.arc(e.x,e.y,160,0,Math.PI*2);c.stroke();}for(let i=e.length-1;i>0;i--)this.sprite('segment',e.bx[i],e.by[i],i>e.length-4?31-(i-(e.length-4))*3:36);this.sprite('head',e.x,e.y,61,e.angle-Math.PI/2);for(const p of this.particles)if(p.life>0){c.globalAlpha=p.life*2;c.fillStyle='#f4e48d';c.beginPath();c.arc(p.x,p.y,2.5,0,Math.PI*2);c.fill();}c.globalAlpha=1;if(this.pointer){c.setTransform(v.dpr,0,0,v.dpr,0,0);const r=this.canvas.getBoundingClientRect();c.strokeStyle='#eddda377';c.lineWidth=2;c.beginPath();c.arc(this.pointer.x-r.left,this.pointer.y-r.top,38,0,Math.PI*2);c.stroke();}},
    action(name){if(name==='start')this.start();else if(name==='pause')this.pause();else if(name==='resume')this.resume();else if(name==='enter')this.enter();else if(name==='fullscreen')this.fullscreen();else if(name==='menu'){this.pendingStart=false;this.menu();}else if(name==='sound'){const audio=window.RytniMushroomFly?.audio;audio?.set('muted',!audio.get().muted);this.menu();}},
    snapshot(){return {state:this.state,active:this.active,raf:Boolean(this.raf),score:this.engine.scoreNow(),length:this.engine.length,food:this.engine.foodCount,quality:this.quality,frameMs:this.frameMs,cpuMs:this.cpu,audio:this.audio?.state(),best:this.best,view:this.view};}
  };
  const registry={fly:{name:'Mushroom Fly',tag:'Над облаками',description:'Парите над волшебной долиной. Монеты, разломы и новые высоты.',art:'fly-card',activate:()=>window.RytniMushroomFly?.activate(),deactivate:()=>window.RytniMushroomFly?.deactivate(),best:()=>window.RytniMushroomFly?.best()||0},snake:{name:'Mushroom Snake',tag:'По тайным тропам',description:'Растите, собирайте споры и комбо. Главное — не встретить свой хвост.',art:'snake-card',activate:()=>Snake.activate(),deactivate:()=>Snake.deactivate(),best:()=>Snake.best}};
  const Hub={selected:null,registry,
    mount(){const panel=$('progressionPanelArcade'),fly=$('rytniArcadeHost');if(!panel||!fly||$('msHub'))return;const wrap=document.createElement('div');wrap.id='msFlyWrap';wrap.hidden=true;fly.before(wrap);wrap.innerHTML=`<div class="ms-backbar">${button('hub','Аркада',false,'home')}<small>Mushroom Fly</small></div>`;wrap.append(fly);const hub=document.createElement('section');hub.id='msHub';hub.setAttribute('aria-label','Выбор игры');panel.prepend(hub);this.render();Snake.mount();window.RytniMushroomFly?.deactivate();},
    render(){if(!$('msHub'))return;$('msHub').innerHTML=`<header class="ms-hub-heading"><div><span class="ms-eyebrow">Аркада подарочного созвездия</span><h2>Две тропы. Один волшебный лес.</h2></div><p>Поднимитесь к облакам или отправьтесь по мицелиевым тропам. Выберите своё приключение.</p></header><div class="ms-cards">${Object.entries(registry).map(([id,g])=>`<article class="ms-card"><img class="ms-card-art" src="${BASE+g.art}.png" alt="${g.name}" width="768" height="512"><div class="ms-card-copy"><span class="ms-eyebrow">${g.tag}</span><h3>${g.name}</h3><p>${g.description}</p><div class="ms-card-bottom">${button('game-'+id,'Играть',true,'play')}<span class="ms-best">${id==='snake'?'Рекорд тренировки':'Личный рекорд'}<b>${g.best()?fmt(g.best()):'Ваша история впереди'}</b></span></div></div></article>`).join('')}</div>`;},
    async select(id){if(!registry[id])return;this.leave();this.selected=id;$('msHub').hidden=true;if(id==='fly')$('msFlyWrap').hidden=false;registry[id].activate();},
    leave(){if(this.selected)registry[this.selected].deactivate();this.selected=null;const full=document.fullscreenElement;if(full?.closest('#msFlyWrap'))document.exitFullscreen().catch(()=>{});const flyStage=document.querySelector('#msFlyWrap .is-pseudo-fullscreen');if(flyStage){flyStage.classList.remove('is-pseudo-fullscreen');document.documentElement.style.overflow='';}if($('msFlyWrap'))$('msFlyWrap').hidden=true;if($('msSnake'))$('msSnake').hidden=true;if($('msHub')){$('msHub').hidden=false;this.render();}},
    visible(){const panel=$('progressionPanelArcade');if(!panel)return false;for(let p=panel;p instanceof Element;p=p.parentElement){if(p.hidden||getComputedStyle(p).display==='none'||getComputedStyle(p).visibility==='hidden')return false;}return true;}
  };
  window.RytniArcadeHub=Hub;
  function init(){Hub.mount();const panel=$('progressionPanelArcade');if(!panel)return;panel.addEventListener('click',event=>{const action=event.target.closest('[data-ms-action]')?.dataset.msAction;if(!action)return;if(action==='hub')Hub.leave();else if(action.startsWith('game-'))Hub.select(action.slice(5));else if(Hub.selected==='snake')Snake.action(action);});let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;if(Hub.selected&&!Hub.visible())Hub.leave();});}).observe($('applicationPopup')||document.body,{attributes:true,subtree:true,attributeFilter:['hidden','class','style']});window.addEventListener('pagehide',()=>Hub.leave());window.addEventListener('pageshow',event=>{if(event.persisted)Hub.leave();});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
  if((location.hostname==='127.0.0.1'||location.pathname==='/testpodari')&&new URLSearchParams(location.search).get('arcade_preview')==='1')window.MushroomSnakeQA={engine:SnakeEngine,snapshot:()=>Snake.snapshot(),state:Snake,hub:Hub};
})();
