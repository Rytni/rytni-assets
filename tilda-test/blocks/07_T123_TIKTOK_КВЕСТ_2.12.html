<script>
(() => {
  "use strict";
  const state={profile:null,hub:null,videos:[],index:0,iframe:null,sessionId:"",sessionVideoId:"",playing:false,lastHeartbeat:0,lastFinishAttempt:0,currentTime:0,duration:0,serverProgress:0,visible:false,attentionNonce:"",busy:false,startPromise:null,heartbeatPromise:null,finishPromise:null,finishRetryTimer:0,networkFailures:0,suppressStopUntil:0,playerReady:false,playerTimer:0,playerVideoId:"",playerLoadStartedAt:0,lastDiagnosticEvent:""};

  const icon=(name)=>`<i data-lucide="${name}"></i>`;
  function ensureHub(){
    if($("rytniTikTokQuest")) return;
    const panel=$("applicationBoostPanel"); if(!panel) return;
    const section=document.createElement("section"); section.id="rytniTikTokQuest"; section.className="rytni-tiktok-quest"; section.hidden=true;
    section.innerHTML=`<div class="ttq-head"><span class="ttq-brand">${icon("play")}</span><div class="ttq-head-copy"><span class="ttq-kicker">Watch quest · TikTok</span><h4 class="ttq-title">Смотри. Листай. Получай очки.</h4><p class="ttq-sub">Новые ролики Rytni — полноценное задание внутри личной комнаты.</p></div><span class="ttq-counter" id="ttqCounter">0 роликов</span></div><div class="ttq-grid" id="ttqGrid"><div><div class="ttq-player-wrap" id="ttqPlayerWrap"><iframe class="ttq-player" id="ttqPlayer" title="Видео TikTok Rytni" allow="fullscreen; autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><span class="ttq-viewed">${icon("circle-check") } Просмотр засчитан</span><div class="ttq-player-shade"><strong id="ttqVideoTitle">Видео Rytni</strong><small id="ttqVideoPosition">Ролик 1 из 1</small></div><div class="ttq-attention" id="ttqAttention" hidden><div class="ttq-attention-card"><span class="ttq-attention-icon">${icon("hand")}</span><strong>Вы ещё здесь?</strong><p>Нажмите кнопку в течение 25 секунд — просмотр продолжится и будет засчитан.</p><button class="ttq-attention-btn" id="ttqAttentionBtn" type="button">Да, я смотрю</button></div></div></div></div><div class="ttq-info"><div class="ttq-status-card"><div class="ttq-account"><span class="ttq-avatar" id="ttqAvatar">${icon("user-round")}</span><span class="ttq-account-copy"><small>TikTok из заявки</small><strong id="ttqAccountName">Аккаунт участника</strong></span></div></div><div class="ttq-streak"><span class="ttq-streak-icon">${icon("flame")}</span><span class="ttq-streak-copy"><small>Серия просмотров</small><strong id="ttqStreak">0 дней подряд</strong><em id="ttqStreakNext">Посмотрите новый ролик сегодня</em></span></div><div class="ttq-reward"><span class="ttq-reward-icon">${icon("coins")}</span><span><small>Награда за 90% просмотра</small><strong id="ttqReward">+0 очков</strong><span class="ttq-progress"><i id="ttqProgress"></i></span></span></div><div class="ttq-message" id="ttqMessage">Нажмите Play и посмотрите не менее 90% ролика.</div><div class="ttq-recovery" id="ttqRecovery" hidden><button id="ttqRestartPlayer" type="button">${icon("refresh-cw")} Перезапустить плеер</button></div><a class="ttq-support" id="ttqSupport" href="https://www.tiktok.com/@rytni.blic" target="_blank" rel="noopener noreferrer"><span class="ttq-support-icon">${icon("heart")}</span><span class="ttq-support-copy"><strong>Поддержать Rytni</strong><small>Открыть оригинал, поставить лайк и написать комментарий — это лучшая поддержка</small></span></a><div class="ttq-controls"><button class="ttq-nav" id="ttqPrev" type="button" aria-label="Предыдущий ролик">‹</button><button class="ttq-next" id="ttqNext" type="button">Смотреть следующий ролик</button><button class="ttq-nav" id="ttqForward" type="button" aria-label="Следующий ролик">›</button></div><div class="ttq-dots" id="ttqDots"></div></div></div><div class="ttq-empty" id="ttqEmpty" hidden><div><span class="ttq-empty-icon">${icon("party-popper")}</span><h5>Новых роликов нет</h5><p>Вы посмотрели всё доступное. Возвращайтесь позже — свежие видео автоматически появятся первыми.</p></div></div>`;
    const chest=panel.querySelector(":scope > .daily-chest"); if(chest) chest.after(section); else panel.appendChild(section);
    $("ttqPrev").addEventListener("click",()=>showAt(state.index-1));
    $("ttqForward").addEventListener("click",()=>showAt(state.index+1));
    $("ttqNext").addEventListener("click",showNextUnwatched);
    $("ttqRestartPlayer").addEventListener("click",restartPlayer);
    $("ttqAttentionBtn").addEventListener("click",confirmAttention);

      if(state.visible)armPlayerFallback(state.videos[state.index]?.tiktok_video_id);
      else window.clearTimeout(state.playerTimer);
    },{threshold:[.2,.55,.8]}).observe($("ttqPlayerWrap"));
    $("ttqPlayer").addEventListener("load",()=>armPlayerFallback(state.videos[state.index]?.tiktok_video_id));
    document.addEventListener("visibilitychange",()=>{
      if(document.hidden)window.clearTimeout(state.playerTimer);

    if(window.lucide) lucide.createIcons();

    state.playerReady=true;window.clearTimeout(state.playerTimer);
    $("ttqRecovery").hidden=true;reportPlayerEvent("ready");
    const support=$("ttqSupport");
    if(support?.classList.contains("is-fallback")){
      support.classList.remove("is-fallback");
      support.querySelector("strong").textContent="Поддержать Rytni";
      message("Плеер готов. Нажмите Play и посмотрите не менее 90% ролика.","good");
    }
    const current=state.videos[state.index];
    if(data.type==="onStateChange"){
      const value=Number(data.value);
      state.playing=value===1;
      if(value===1&&!state.sessionId&&!current?.watched){
        state.playing=false;state.suppressStopUntil=Date.now()+1600;postPlayer("pause");
        const started=await startSession();
        if(started&&state.videos[state.index]?.id===current.id){
          if(state.serverProgress>=90&&state.duration)await finish("resume");
          else{state.suppressStopUntil=Date.now()+1200;postPlayer("play");}
        }
      }
      if(value===0&&Date.now()>=state.suppressStopUntil&&state.sessionId&&!current?.watched)await finish("player_stop");
    }else if(data.type==="onCurrentTime"){
      const value=data.value||{};
      state.currentTime=Number(value.currentTime)||0;
      state.duration=Number(value.duration)||0;
      if(state.playing&&state.sessionId&&!current?.watched){heartbeat();if(state.duration>=3&&state.currentTime/state.duration>=.902)finish("progress");}
    }else if(data.type==="onPlayerError"){
      showPlayerFallback(true);
    }
  }
  window.RytniTikTokQuest={open};
})();
</script>

  grid-template-columns:minmax(0,1fr) auto;
  width:100%;
  min-height:50px;
  margin:0;
  padding:10px 14px;
  border:0;
  color:#fff;
  background:linear-gradient(135deg,#9e35e9,#443bd2 55%,#178dcd);
  box-shadow:0 12px 30px rgba(116,42,224,.28);
}
.rytni-sponsor-stage .sponsor-chest-btn>img{display:none}
.rytni-sponsor-stage .sponsor-chest-btn span{display:grid}
.rytni-sponsor-stage .sponsor-chest-btn small{color:#d9d5ff}
.rytni-partner-route{
  position:relative;
  grid-column:1/-1;
  display:grid;
  gap:16px;
  min-height:220px;
  overflow:hidden;
  padding:20px;
  border:1px solid rgba(116,93,255,.4);
  border-radius:24px;
  background:
    radial-gradient(circle at 8% 22%,rgba(40,214,255,.18),transparent 27%),
    radial-gradient(circle at 92% 28%,rgba(255,183,55,.13),transparent 25%),
    radial-gradient(circle at 50% 120%,rgba(154,55,255,.2),transparent 43%),
    linear-gradient(145deg,rgba(4,16,43,.98),rgba(23,10,58,.97));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 20px 46px rgba(0,0,0,.3);
  isolation:isolate;
}
.rytni-partner-route::before{content:"";position:absolute;z-index:-1;inset:0;opacity:.42;background-image:radial-gradient(circle,rgba(176,205,255,.5) 0 1px,transparent 1.5px);background-size:47px 47px;mask-image:linear-gradient(to bottom,#000,transparent 80%);pointer-events:none}
.rytni-partner-route::after{content:"";position:absolute;z-index:-1;top:-35%;bottom:-35%;left:-16%;width:18%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(91,226,255,.1),transparent);pointer-events:none;animation:rytniSignalSweep 6.5s ease-in-out infinite}
.rytni-partner-route.is-complete{border-color:rgba(75,239,198,.5);background:radial-gradient(circle at 50% 0,rgba(52,236,192,.16),transparent 35%),linear-gradient(145deg,rgba(4,24,42,.98),rgba(20,12,55,.97))}
.rytni-signal-hero{position:relative;z-index:1;display:grid;grid-template-columns:112px minmax(0,1fr) 88px;gap:16px;align-items:center;min-width:0}
.rytni-signal-art{position:relative;display:grid;place-items:center;width:112px;height:112px;border:1px solid rgba(111,118,255,.32);border-radius:26px;background:radial-gradient(circle,rgba(138,59,255,.23),rgba(3,12,34,.72) 67%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 28px rgba(3,7,24,.36)}
.rytni-signal-art::before,.rytni-signal-art::after{content:"";position:absolute;border:1px solid rgba(78,226,255,.24);border-radius:50%;inset:15px;animation:rytniSignalOrbit 7s linear infinite}
.rytni-signal-art::after{inset:24px;border-color:rgba(255,189,73,.22);animation-direction:reverse;animation-duration:5.5s}
.rytni-signal-art img{position:relative;z-index:1;width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 0 13px rgba(121,72,255,.34));animation:rytniSignalFloat 4.8s ease-in-out infinite}
.rytni-signal-art.is-fallback::after{inset:32px;background:radial-gradient(circle,#d47aff,#6b35ff 45%,transparent 48%)}
.rytni-partner-route-copy{display:grid;gap:6px;min-width:0}
.rytni-partner-route-kicker{display:inline-flex;align-items:center;gap:7px;width:max-content;max-width:100%;color:#62e9f2;font-size:12px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
.rytni-partner-route-kicker svg{width:15px;height:15px}
.rytni-partner-route-copy h6{margin:0;color:#fff;font-size:21px;line-height:1.18}
.rytni-partner-route-copy p{max-width:680px;margin:0;color:#b4c0d9;font-size:14px;line-height:1.45}
.rytni-signal-progress-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;margin-top:4px}
.rytni-signal-progress-track{height:7px;overflow:hidden;border:1px solid rgba(126,146,201,.2);border-radius:999px;background:rgba(5,11,30,.7)}
.rytni-signal-progress-track span{display:block;width:var(--signal-progress-percent,0%);height:100%;border-radius:inherit;background:linear-gradient(90deg,#34d8ff,#8154ff 52%,#ffbd48);box-shadow:0 0 13px rgba(92,216,255,.38);transition:width .45s ease}
.rytni-signal-progress-line small{color:#b7c7e5;font-size:12px;font-weight:850;white-space:nowrap}
.rytni-signal-progress{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(#45e1e9 var(--signal-progress,0deg),rgba(102,119,170,.2) 0);box-shadow:0 0 24px rgba(63,220,239,.17)}
.rytni-signal-progress::before{content:"";grid-area:1/1;width:68px;height:68px;border:1px solid rgba(255,255,255,.07);border-radius:50%;background:#09132c}
.rytni-signal-progress span{z-index:1;grid-area:1/1;display:grid;text-align:center}
.rytni-signal-progress strong{color:#fff;font-size:19px;line-height:1}
.rytni-signal-progress small{margin-top:4px;color:#87a0c8;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.rytni-sponsor-signal-list{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rytni-sponsor-signal{position:relative;display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;align-items:center;overflow:hidden;padding:15px;border:1px solid rgba(82,203,255,.28);border-radius:19px;background:linear-gradient(145deg,rgba(6,28,57,.85),rgba(5,14,38,.82));box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .22s ease,border-color .22s ease,background .22s ease}
.rytni-sponsor-signal.is-ready:hover{transform:translateY(-2px);border-color:rgba(80,226,255,.52)}
.rytni-sponsor-signal[data-theme="gold"]{border-color:rgba(255,199,79,.34);background:linear-gradient(145deg,rgba(56,34,8,.78),rgba(34,15,53,.8))}
.rytni-sponsor-signal.is-claimed{border-color:rgba(83,236,193,.25);background:linear-gradient(145deg,rgba(11,49,54,.62),rgba(8,18,42,.78))}
.rytni-signal-kind-icon{position:relative;display:grid;place-items:center;width:64px;height:64px;border:1px solid rgba(85,223,255,.34);border-radius:19px;color:#69eaff;background:radial-gradient(circle,rgba(56,203,255,.17),rgba(19,30,74,.34) 62%,rgba(4,13,35,.72));box-shadow:0 0 24px rgba(47,198,236,.16),inset 0 1px 0 rgba(255,255,255,.08)}
.rytni-sponsor-signal[data-theme="gold"] .rytni-signal-kind-icon{border-color:rgba(255,195,64,.4);color:#ffd066;background:linear-gradient(145deg,rgba(160,99,16,.28),rgba(107,44,99,.28));box-shadow:0 0 20px rgba(255,178,40,.14)}
.rytni-sponsor-signal.is-claimed .rytni-signal-kind-icon{border-color:rgba(72,236,191,.34);color:#55ebc6;background:rgba(31,124,106,.2)}
.rytni-signal-kind-icon img{display:block;place-self:center;width:60px;height:60px;max-width:100%;object-fit:contain;object-position:center;transform-origin:50% 50%;filter:drop-shadow(0 0 10px rgba(52,211,255,.34));animation:rytniSignalIconFloat 4.4s ease-in-out infinite}
.rytni-sponsor-signal[data-theme="gold"] .rytni-signal-kind-icon img{filter:drop-shadow(0 0 11px rgba(255,178,44,.36));animation-delay:-1.6s}
.rytni-sponsor-signal.is-claimed .rytni-signal-kind-icon img{filter:saturate(.7) drop-shadow(0 0 8px rgba(72,236,191,.24));opacity:.82}
.rytni-signal-kind-icon svg{width:24px;height:24px}
.rytni-sponsor-signal-copy{display:grid;gap:5px;min-width:0}
.rytni-sponsor-signal-copy strong{overflow:hidden;color:#fff;font-size:15px;line-height:1.3;text-overflow:ellipsis;white-space:nowrap}
.rytni-sponsor-signal-meta{display:flex;flex-wrap:wrap;gap:7px}
.rytni-partner-route-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:5px 9px;border:1px solid rgba(118,146,210,.25);border-radius:999px;color:#dbe8ff;background:rgba(5,12,34,.62);font-size:12px;font-weight:850}
.rytni-partner-route-chip svg{width:14px;height:14px;color:#5ce7e3}
.rytni-sponsor-signal-action{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.rytni-partner-route-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;overflow:hidden;padding:10px 14px;border:0;border-radius:15px;color:#06131f;background:linear-gradient(135deg,#4de8d2,#45baff 58%,#a15cff);box-shadow:0 12px 27px rgba(50,175,225,.24);font:inherit;font-size:14px;font-weight:950;cursor:pointer;transition:transform .18s ease,filter .18s ease}
.rytni-partner-route-button::after{content:"";position:absolute;inset:-60% auto -60% -28%;width:20%;transform:rotate(20deg);background:rgba(255,255,255,.42);filter:blur(5px);animation:rytniSignalButtonShine 4.8s ease-in-out infinite}
.rytni-partner-route-button:hover{transform:translateY(-1px);filter:brightness(1.07)}
.rytni-partner-route-button:active{transform:translateY(1px) scale(.99)}
.rytni-sponsor-signal[data-theme="gold"] .rytni-partner-route-button{background:linear-gradient(135deg,#ffe176,#ffb72f 58%,#d876ff);box-shadow:0 12px 27px rgba(223,154,42,.22)}
.rytni-partner-route-button:disabled{color:#80d7c1;background:rgba(25,71,69,.62);box-shadow:none;cursor:not-allowed;filter:none}
.rytni-partner-route-button:disabled::after{display:none}
.rytni-partner-route-button svg{width:18px;height:18px}
.rytni-signal-button-reward{padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.24);font-size:14px;white-space:nowrap}
.rytni-partner-route-status{color:#9eacc8;font-size:12px;line-height:1.35;text-align:center}
.rytni-sponsor-signal-action>.rytni-partner-route-status{max-width:128px;text-align:right}
.rytni-partner-route.is-celebrating .rytni-signal-art{animation:rytniSignalCelebrate .7s ease-out}
.rytni-partner-route[hidden]{display:none!important}
@keyframes rytniSignalSweep{0%,64%{transform:translateX(0) rotate(18deg);opacity:0}72%{opacity:1}90%,100%{transform:translateX(760%) rotate(18deg);opacity:0}}
@keyframes rytniSignalOrbit{to{transform:rotate(360deg)}}
@keyframes rytniSignalFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rytniSignalIconFloat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes rytniSignalButtonShine{0%,68%{transform:translateX(0) rotate(20deg);opacity:0}74%{opacity:.75}92%,100%{transform:translateX(850%) rotate(20deg);opacity:0}}
@keyframes rytniSignalCelebrate{0%{transform:scale(.94)}45%{transform:scale(1.06);box-shadow:0 0 42px rgba(71,239,198,.36)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.rytni-partner-route::after,.rytni-signal-art::before,.rytni-signal-art::after,.rytni-signal-art img,.rytni-signal-kind-icon img,.rytni-partner-route-button::after{animation:none!important}.rytni-sponsor-signal,.rytni-partner-route-button,.rytni-signal-progress-track span{transition:none!important}}
@media(max-width:380px){.rytni-sponsor-signal-action{grid-template-columns:1fr}.rytni-sponsor-signal-action>.rytni-partner-route-status{max-width:none;text-align:center}}
.rytni-quiz-stage{
  position:relative;
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  gap:22px;
  align-items:stretch;
  min-height:290px;
}
.rytni-quiz-art{
  position:relative;
  display:grid;
  place-items:center;
  min-height:280px;
  overflow:hidden;
  border:1px solid rgba(171,76,255,.28);
  border-radius:22px;
  background:radial-gradient(circle at 50% 45%,rgba(168,65,255,.26),transparent 43%),linear-gradient(145deg,rgba(15,24,65,.9),rgba(25,8,54,.9));
}
.rytni-quiz-art::before,.rytni-quiz-art::after{content:"";position:absolute;border:1px solid rgba(73,230,229,.18);transform:rotate(45deg);animation:rytniRune 8s linear infinite}
.rytni-quiz-art::before{width:150px;height:150px}.rytni-quiz-art::after{width:112px;height:112px;animation-direction:reverse;animation-duration:6s}
.rytni-quiz-art img{position:relative;z-index:1;width:180px;height:180px;object-fit:contain;filter:drop-shadow(0 0 25px rgba(184,67,255,.48))}
.rytni-quiz-content{
  display:grid;
  align-content:center;
  min-width:0;
  padding:22px;
  border:1px solid rgba(83,188,245,.18);

  background:rgba(3,10,29,.68);

.rytni-quiz-content .next-activity-card{margin:0 0 14px}
.rytni-quiz-content .quiz-zone{
  display:block!important;
  width:100%;
  min-height:0;

  border:0;
  background:none;
  box-shadow:none;
}
.rytni-quiz-content .quiz-zone[hidden]{display:none!important}
.rytni-quiz-content .quiz-question{font-size:clamp(18px,2.2vw,25px)!important}
.rytni-quiz-content .quiz-answer-row{grid-template-columns:minmax(0,1fr) 160px!important}
.rytni-quiz-content .profile-actions{display:block;width:100%}
.rytni-quiz-content .boost-button{width:100%;min-height:52px}
.rytni-quiz-content .boost-rules{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
.rytni-video-stage .rytni-tiktok-quest{

.rytni-video-stage .rytni-tiktok-quest::before{display:none}

  const tabButton=(id,label,sub,emblem)=>`<button class="rytni-progression-tab" type="button" id="progressionTab${id[0].toUpperCase()+id.slice(1)}" role="tab" aria-selected="false" aria-controls="progressionPanel${id[0].toUpperCase()+id.slice(1)}" data-progression-tab="${id}"><span class="rytni-tab-emblem is-${emblem}" aria-hidden="true"><img src="${tabAssets[emblem]}" alt="" loading="lazy" decoding="async"></span><span class="rytni-tab-copy"><strong>${label}</strong><small>${sub}</small></span><span class="rytni-tab-arrow" aria-hidden="true">›</span></button>`;

  function makeHub(){
    const panel=$("applicationBoostPanel");
    if(!panel)return null;
    let hub=$("rytniProgressionHub");
    if(!hub){
      hub=document.createElement("section");
      hub.id="rytniProgressionHub";
      hub.className="rytni-progression-hub";
      hub.setAttribute("aria-label","Способы прокачки заявки");
      hub.innerHTML=`
        <div class="rytni-progression-tabs" role="tablist" aria-label="Разделы прокачки">
          ${tabButton("chests","Сундуки","Ежедневный и спонсорский лут","chest")}
          ${tabButton("quiz","Игровые вопросы","Знания превращаются в очки","quiz")}
          ${tabButton("video","Смотреть видео","Ролики TikTok и награды","video")}
          ${tabButton("arcade","Аркада","Играйте. Ставьте рекорды.","arcade")}
        </div>
        <div class="rytni-progression-panels">
          <section class="rytni-progression-panel" id="progressionPanelChests" role="tabpanel" aria-labelledby="progressionTabChests">
            <div class="rytni-tab-dashboard">
              <div class="rytni-tab-heading"><span class="rytni-tab-kicker">Хранилище наград</span><h5>Сундуки</h5><p>Возвращайтесь за ежедневным лутом и забирайте бонус партнёра.</p></div>
              ${statCard("progressionChestOpened","package-open","открыто")}
              ${statCard("progressionChestStreak","flame","текущая серия")}
              ${statCard("progressionChestBest","crown","лучшая серия")}
            </div>
            <div class="rytni-tab-status is-ready" id="progressionChestStatus" role="status"><i data-lucide="circle-check-big"></i><span><strong>Проверяем доступность сундука</strong><small>Статус обновится после загрузки заявки.</small></span></div>
            <div class="rytni-chest-grid">
              <article class="rytni-chest-card" id="progressionDailyChestCard"><div class="rytni-chest-label"><i data-lucide="gift"></i>Сундук дня</div></article>
              <article class="rytni-chest-card" id="progressionSponsorChestCard">
                <div class="rytni-chest-label"><i data-lucide="sparkles"></i>Сундук от спонсора</div>
                <div class="rytni-sponsor-stage">
                  <span class="rytni-sponsor-orb" aria-hidden="true"><img class="rytni-sponsor-art" src="https://rytni.github.io/rytni-assets/chest/astra_chest_icon.webp" alt="" loading="lazy" decoding="async"></span>
                  <div class="rytni-sponsor-copy"><h6>Особая награда</h6><p>Заберите бонус и откройте страницу партнёра после успешного начисления.</p><div id="progressionSponsorButtonHost"></div></div>
                </div>
              </article>
              <article class="rytni-partner-route" id="progressionSponsorSignals" hidden style="--signal-progress:0deg;--signal-progress-percent:0%">
                <div class="rytni-signal-hero">
                  <span class="rytni-signal-art" aria-hidden="true"><img src="https://rytni.github.io/rytni-assets/ui-v215-test/sponsor-signal-receiver.webp" alt="" loading="lazy" decoding="async" onerror="this.hidden=true;this.parentElement.classList.add('is-fallback')"></span>
                  <div class="rytni-partner-route-copy">
                    <small class="rytni-partner-route-kicker"><i data-lucide="radio-tower"></i>Передача Keysfan</small>
                    <h6>Таинственный сигнал от спонсора</h6>
                    <p id="partnerSignalDescription">Награды и время восстановления загружаются из настроек.</p>
                    <div class="rytni-signal-progress-line"><span class="rytni-signal-progress-track"><span id="partnerSignalProgressBar"></span></span><small id="partnerSignalProgressCopy">Ожидаем сигнал</small></div>
                  </div>
                  <span class="rytni-signal-progress" aria-label="Прогресс перехвата"><span><strong id="partnerSignalProgressValue">0/2</strong><small>принято</small></span></span>
                </div>
                <div class="rytni-sponsor-signal-list" id="partnerSignalList" aria-live="polite"></div>
                <small class="rytni-partner-route-status" id="partnerSignalsStatus">Проверяем доступность сигналов…</small>
              </article>
            </div>
          </section>
          <section class="rytni-progression-panel" id="progressionPanelQuiz" role="tabpanel" aria-labelledby="progressionTabQuiz">
            <div class="rytni-tab-dashboard">
              <div class="rytni-tab-heading"><span class="rytni-tab-kicker">Испытание знаний</span><h5>Игровой вопрос</h5><p>Верный ответ продолжает серию. Неверный обнуляет текущую, а лучший результат сохраняется.</p></div>
              ${statCard("progressionQuizCorrect","circle-check-big","верных ответов")}
              ${statCard("progressionQuizStreak","flame","верных ответов подряд")}
              ${statCard("progressionQuizLevel","shield","уровень")}
            </div>
            <div class="rytni-tab-status" id="progressionQuizStatus" role="status"><i data-lucide="hourglass"></i><span><strong>Проверяем игровое испытание</strong><small>Статус обновится после загрузки заявки.</small></span></div>
            <div class="rytni-quiz-stage">
              <div class="rytni-quiz-art" aria-hidden="true"><img src="https://rytni.github.io/rytni-assets/ui-v213/quiz-rune-mobile.webp" alt="" loading="lazy" decoding="async"></div>
              <div class="rytni-quiz-content" id="progressionQuizHost"></div>
            </div>
          </section>
          <section class="rytni-progression-panel rytni-video-stage" id="progressionPanelVideo" role="tabpanel" aria-labelledby="progressionTabVideo">
            <div class="rytni-tab-dashboard">
              <div class="rytni-tab-heading"><span class="rytni-tab-kicker">Watch quest · TikTok</span><h5>Смотреть видео</h5><p>Смотрите ролики до конца, сохраняйте серию и получайте очки.</p></div>
              ${statCard("progressionVideoWatched","play","просмотрено")}
              ${statCard("progressionVideoStreak","flame","дней подряд")}
              ${statCard("progressionVideoNew","sparkles","новых роликов")}
            </div>
            <div class="rytni-tab-status" id="progressionVideoStatus" role="status"><i data-lucide="play-circle"></i><span><strong>Проверяем новые ролики</strong><small>Статус обновится после загрузки TikTok-заданий.</small></span></div>
            <div id="progressionVideoHost"></div>
          </section>
          <section class="rytni-progression-panel rytni-arcade-panel" id="progressionPanelArcade" role="tabpanel" aria-labelledby="progressionTabArcade">
            <div id="rytniArcadeHost"></div>
          </section>
        </div>`;
      const gamer=$("gamerProfileCard");
      if(gamer)gamer.after(hub);else panel.appendChild(hub);
      hub.querySelectorAll("[data-progression-tab]").forEach(button=>{
        button.addEventListener("click",()=>selectTab(button.dataset.progressionTab,true));
        button.addEventListener("keydown",event=>{
          if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;
          event.preventDefault();
          const tabs=[...hub.querySelectorAll("[data-progression-tab]")];
          const current=tabs.indexOf(button);
          const next=event.key==="Home"?0:event.key==="End"?tabs.length-1:(current+(event.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
          tabs[next].focus();
          selectTab(tabs[next].dataset.progressionTab,true);
        });
      });
      $("partnerSignalList")?.addEventListener("click",event=>{
        const button=event.target.closest("[data-sponsor-signal]");
        if(button)claimSponsorSignal(button.dataset.sponsorSignal,button);
      });
    }
    return hub;
  }

  function placeMechanics(){
    const hub=makeHub();
    if(!hub)return;
    if(typeof applicationToolMode!=="undefined"&&applicationToolMode!=="boost"){
      hub.hidden=true;
      return;
    }
    hub.hidden=false;
    const daily=document.querySelector("#applicationBoostPanel .daily-chest");
    const sponsor=$("sponsorChestBtn");
    const quiz=$("quizZone");
    const cooldown=$("boostCooldown");

    const rewards=signals.map(pointValue),totalReward=rewards.reduce((sum,value)=>sum+value,0),availableReward=signals.filter(signal=>signal.can_claim!==false).reduce((sum,signal)=>sum+pointValue(signal),0);

      meta.appendChild(sponsorSignalChip("ticket",mission.promo_code?`Промокод ${mission.promo_code}`:"Промокод"));

  async function loadSponsorSignals(profile){
    const participant=profile||latestProfile||(typeof currentApplication!=="undefined"?currentApplication:null);
    if(!participant||!participant.id)return;
    if(participant.test_mode&&String(participant.id)==="preview"){
      renderSponsorSignals({success:true,available:true,signals:[
        {id:"preview-windows",title:"Сигнал Windows",promo_code:"BLIC52",reward_points:50,theme:"blue",can_claim:true},
        {id:"preview-office",title:"Сигнал Office",promo_code:"BLIC62",reward_points:50,theme:"gold",can_claim:true}
      ]});return;
    }
    const key=String(participant.id);
    if(sponsorSignalsRequest===key)return;
    sponsorSignalsRequest=key;
    try{
      const result=await callSupabaseRpc("get_sponsor_signals_v21525",{p_participant_id:participant.id,p_group_slug:"keysfan"},8000);
      renderSponsorSignals(result);
    }catch(error){
      sponsorSignalsRequest="";

  }
  async function claimSponsorSignal(missionId,button){
    const participant=latestProfile||(typeof currentApplication!=="undefined"?currentApplication:null);
    const signals=Array.isArray(sponsorSignalsState?.signals)?sponsorSignalsState.signals:[];
    const mission=signals.find(item=>String(item.id)===String(missionId));
    if(!participant||!mission||!button||button.disabled)return;

  function syncStats(profile){
