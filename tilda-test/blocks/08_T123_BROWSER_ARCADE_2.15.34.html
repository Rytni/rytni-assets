@container mf-stage (max-aspect-ratio:4/5){
 .rytni-arcade #arcadeDialog .mf-tabs{display:flex!important;background:transparent;border:0;border-bottom:1px solid #b77c31;border-radius:0;padding:0 0 7px;gap:9px}
 .rytni-arcade #arcadeDialog[data-menu="main"]{grid-template-columns:minmax(0,1fr)!important}
 .rytni-arcade #arcadeDialog:not([data-menu="main"]) .rytni-arcade-modal-header{padding:0 42px 0 0!important;text-align:left!important;justify-items:start!important}
 .rytni-arcade #arcadeDialog:not([data-menu="main"]) .rytni-arcade-modal-header>p{max-width:100%!important;text-align:left!important}
 .rytni-arcade #arcadeDialog .mf-power-grid .mf-guide-card{min-height:84px;padding:6px;gap:5px}
 .rytni-arcade #arcadeDialog .mf-tab{border:1px solid #976127;border-radius:14px 14px 8px 8px;background:linear-gradient(#503015,#28140b);box-shadow:inset 0 1px #c19b59;min-height:46px;font-family:var(--mf-display);font-size:16px}
 .rytni-arcade #arcadeDialog .mf-tab.is-active{border-color:#f2c361;background:linear-gradient(#875020,#4a280f);color:#fff1bd;box-shadow:inset 0 2px #f6ce74,0 3px 6px #160b07}
 .rytni-arcade #arcadeDialog .mf-tab-panel:not(.is-active){display:none!important}
 .rytni-arcade #arcadeDialog .mf-settings-sections{grid-template-columns:1fr!important}
 .rytni-arcade #arcadeDialog .mf-guide-basics{grid-template-columns:1fr!important}
 .rytni-arcade #arcadeDialog .mf-power-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .rytni-arcade #arcadeDialog .mf-settings-sections>.mf-tab-panel{padding:7px}
 .rytni-arcade #arcadeDialog .mf-section-title{display:none}
 .rytni-arcade #arcadeDialog .mf-settings-sections h3{display:none}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-actions{grid-template-columns:48px minmax(0,1fr) 48px!important;width:100%!important;max-width:100%!important}
}
/* Very short embedded module: retain every action in three wide rows. */
@container mf-stage (max-height:300px){
 .rytni-arcade #arcadeDialog:not([data-menu="main"]){--mf-frame-size:18px;border-width:18px!important;border-image-width:18px!important;padding:6px 10px!important;max-height:96cqh!important;gap:5px!important}
 .rytni-arcade #arcadeDialog:not([data-menu="main"]) .rytni-arcade-menu-kicker,.rytni-arcade #arcadeDialog:is([data-menu="settings"],[data-menu="rules"],[data-menu="result"]) .rytni-arcade-modal-header>p{display:none!important}
 .rytni-arcade #arcadeDialog:not([data-menu="main"]) .rytni-arcade-modal-header{padding:0 48px 0 0!important;text-align:left!important;justify-items:start!important}
 .rytni-arcade #arcadeDialog:not([data-menu="main"]) h6{font-size:23px!important;max-width:100%!important}
 .rytni-arcade #arcadeDialog .rytni-arcade-menu-close{top:0!important;right:0!important}
 .rytni-arcade #arcadeDialog .rytni-arcade-modal-body{scrollbar-gutter:stable}
}
@container mf-stage (max-width:560px) and (max-height:300px){
 .rytni-arcade #arcadeDialog[data-menu="main"]{grid-template-columns:1fr!important;grid-template-rows:1fr!important;height:calc(100cqh - 20px)!important;padding:8px!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-modal-header,.rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-modal-body{display:none!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-modal-footer{grid-column:1;grid-row:1;justify-self:center}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-actions{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:5px!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-start{padding:5px!important;min-height:44px!important;font-size:13px!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-start.is-primary{grid-column:1/-1!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-actions:has([data-menu-action="play"]) [data-menu-action="play"],.rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-actions:has([data-menu-action="play"]) [data-menu-action="training"]{grid-column:span 3!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] [data-menu-action="rules"]{grid-column:1/-1!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-start.mf-main-settings{grid-column:span 4!important}
 .rytni-arcade #arcadeDialog[data-menu="main"] .rytni-arcade-menu-foot{position:static;width:100%;margin:5px 0 0!important;padding:3px!important}
}
/* The canvas owns its render aspect ratio; CSS never crops or letterboxes gameplay. */
.rytni-arcade .rytni-arcade-stage .rytni-arcade-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;max-height:none!important;aspect-ratio:auto;object-fit:fill}
.rytni-arcade .rytni-arcade-hud{top:max(13px,env(safe-area-inset-top));left:max(13px,env(safe-area-inset-left));right:max(13px,env(safe-area-inset-right))}
.rytni-arcade .rytni-arcade-powerups{left:max(13px,env(safe-area-inset-left));right:max(13px,env(safe-area-inset-right));bottom:max(13px,env(safe-area-inset-bottom))}
.rytni-arcade-stage:fullscreen,.rytni-arcade-stage.is-pseudo-fullscreen{margin:0!important;padding:0!important;min-width:0!important;min-height:0!important;box-sizing:border-box!important}
.rytni-arcade-stage.is-pseudo-fullscreen{inset:var(--mf-vv-y,0px) auto auto var(--mf-vv-x,0px)!important;width:var(--mf-vv-w,100vw)!important;height:var(--mf-vv-h,100dvh)!important}
#applicationPopup:has(.rytni-arcade-stage.is-pseudo-fullscreen) #applicationSearchClose{visibility:hidden!important;pointer-events:none!important}
.rytni-arcade-stage{isolation:isolate}
.rytni-arcade .rytni-arcade-canvas{z-index:0}
.rytni-arcade #arcadeOverlay{backdrop-filter:none!important;transition:none}
.rytni-arcade #arcadeOverlay:has([data-menu="mobileMode"]){top:var(--mf-gate-top,0px);bottom:auto;height:var(--mf-gate-height,100%);box-sizing:border-box}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"]{display:block!important;box-sizing:border-box;min-width:0!important;width:calc(100% - 24px)!important;max-width:640px!important;max-height:calc(100% - 20px)!important;overflow:auto!important;overscroll-behavior:contain;touch-action:pan-y}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"]{background:radial-gradient(circle at 50% 0,rgba(126,69,27,.34),transparent 40%),linear-gradient(155deg,#3a1c0f,#170b08 74%)!important;background-clip:padding-box!important}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"]:before{display:none!important}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] .rytni-arcade-modal-body{overflow:visible!important;max-height:none!important}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] #arcadeActions{display:grid!important;grid-template-columns:minmax(0,1fr)!important;width:100%!important}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] #arcadeActions>*{box-sizing:border-box;width:100%!important;min-width:0!important;grid-column:auto!important;white-space:normal}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] #arcadeActions span{min-width:0;overflow-wrap:anywhere}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] .mf-orientation-art{width:clamp(40px,12vh,80px);height:clamp(40px,12vh,80px);margin:4px auto}
.rytni-arcade .mf-orientation-art{display:block;width:96px;height:96px;object-fit:contain;margin:0 auto 8px}
.rytni-arcade #arcadeDialog[data-menu="mobileMode"] h6{padding-right:48px!important;box-sizing:border-box}
.rytni-arcade .mf-perf{position:absolute;z-index:8;pointer-events:none;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));margin:0;padding:6px 9px;border-radius:7px;background:#160d09e8;color:#fff1be;font:11px/1.4 monospace;white-space:pre}
.rytni-arcade-stage .rytni-arcade-pill,.rytni-arcade-stage .rytni-arcade-score-card{position:relative;isolation:isolate;backdrop-filter:none!important}
.rytni-arcade-stage .rytni-arcade-pill>:not(.mf-hud-blur-cache),.rytni-arcade-stage .rytni-arcade-score-card>:not(.mf-hud-blur-cache){z-index:1}
.rytni-arcade .mf-hud-blur-cache{position:absolute;z-index:0;inset:0;width:100%;height:100%;border-radius:inherit;opacity:.22;pointer-events:none;image-rendering:auto}
.rytni-arcade-stage:not([data-blur-mode="cached"]) .mf-hud-blur-cache{display:none}
.rytni-arcade-stage[data-quality="low"] #arcadeOverlay{backdrop-filter:none!important}
