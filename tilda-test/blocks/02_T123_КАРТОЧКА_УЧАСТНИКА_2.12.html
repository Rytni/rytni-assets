

<style>
/* Participant Player Pass v3 */
.application-popup{
  width:min(1080px,calc(100vw - 28px));
  padding:18px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:26px;
  background:rgba(244,245,247,.94);
  box-shadow:0 32px 100px rgba(14,15,19,.34);
  scrollbar-gutter:stable;
}
.application-boost-panel{
  --pass-coral:#ff6b61;
  --pass-mint:#83dfc8;
  --pass-ivory:#f5f1e8;
  --pass-ink:#16161b;
  --pass-surface:#202027;
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  grid-template-areas:
    "head action"
    "profile profile"
    "chest chest"
    "drawer drawer"
    "quiz quiz"
    "edit edit"
    "tiktok tiktok"
    "rules rules";
  gap:14px;
  overflow:hidden;
  padding:22px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;
  color:var(--pass-ivory);
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    radial-gradient(circle at 96% -8%,rgba(255,107,97,.17),transparent 34%),
    radial-gradient(circle at -8% 30%,rgba(131,223,200,.12),transparent 32%),
    #141419;
  background-size:38px 38px,38px 38px,auto,auto,auto;
  font-family:Onest,Manrope,sans-serif;
  isolation:isolate;
}
.application-boost-panel::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.025) 48%,transparent 72%);
}
.application-boost-panel .boost-panel-head{grid-area:head;align-self:center}
.application-boost-panel .boost-rank-icon{
  width:48px;
  height:48px;
  border:1px solid rgba(131,223,200,.26);
  border-radius:15px;
  color:#17211f;
  background:linear-gradient(145deg,#c3f4e7,#65cbb2);
  box-shadow:0 12px 26px rgba(83,195,168,.16);
}
.application-boost-panel .boost-panel-title{
  color:#fffaf2;
  font-family:"Russo One",Onest,sans-serif;
  font-size:22px;
  font-weight:400;
  letter-spacing:0;
}
.application-boost-panel .boost-panel-sub{color:#9999a5;font-size:14px;font-weight:600}
.application-boost-panel .next-activity-card{
  grid-area:action;
  min-height:76px;
  padding:12px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  color:#f7f4ed;
  background:rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.application-boost-panel .next-activity-card.is-ready{border-color:rgba(131,223,200,.42);background:rgba(63,132,116,.18)}
.application-boost-panel .next-activity-card.is-waiting{border-color:rgba(255,107,97,.22)}
.application-boost-panel .next-activity-kicker{color:var(--pass-mint);font-size:12px}
.application-boost-panel .next-activity-title{font-family:Onest,sans-serif;font-size:14px}
.application-boost-panel .next-activity-text{color:#aaaab4;font-size:13px}
.application-boost-panel .next-activity-icon{width:40px;height:40px;border-radius:13px;color:#1b1b20;background:var(--pass-mint)}
.application-boost-panel .next-activity-card .boost-button{
  grid-column:1/-1;
  min-height:44px;
  border-radius:13px;
  color:#17171c;
  background:linear-gradient(135deg,#a8ead9,#68cdb4);
  box-shadow:none;
}
.application-boost-panel .player-pass{
  grid-area:profile;
  position:relative;
  display:grid;
  grid-template-columns:112px minmax(0,1fr) 184px;
  grid-template-areas:
    "avatar identity level"
    "meta meta meta"
    "rank rank rank"
    "edit edit edit";
  gap:20px 22px;
  width:100%;
  min-width:0;
  padding:24px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  color:#f5f1e8;
  background:
    linear-gradient(125deg,rgba(255,255,255,.07),transparent 42%),
    linear-gradient(145deg,#26262d 0%,#1c1c22 62%,#211b1d 100%);
  box-shadow:0 24px 52px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.07);
  transform-origin:50% 30%;
  animation:playerPassIn .5s cubic-bezier(.2,.78,.28,1) both;
}
.application-boost-panel .player-pass::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  height:auto;
  border-radius:0;
  background:linear-gradient(180deg,var(--pass-coral),#ffb36a 48%,var(--pass-mint));
}
.application-boost-panel .player-pass-glow{
  position:absolute;
  top:-150px;
  right:-110px;
  width:340px;
  height:300px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,107,97,.17),transparent 67%);
}
.application-boost-panel .player-pass>.gamer-avatar{
  grid-area:avatar;
  position:relative;
  width:112px;
  height:112px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:28px;
  background:#2b2b32;
  box-shadow:0 16px 32px rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.035);
}
.application-boost-panel .player-pass>.gamer-avatar::after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:21px;
  pointer-events:none;
}
.application-boost-panel .player-pass>.gamer-avatar img{border-radius:27px}
.application-boost-panel .player-pass>.gamer-avatar>svg{
  right:7px;
  bottom:7px;
  width:24px;
  height:24px;
  padding:5px;
  border-radius:8px;
  color:#17171c;
  background:var(--pass-mint);
  opacity:1;
}
.application-boost-panel .player-pass-identity{grid-area:identity;align-self:center;min-width:0}
.application-boost-panel .player-pass-eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.application-boost-panel .gamer-kicker{
  margin:0;
  color:#a5a4ae;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
}
.application-boost-panel .player-number{
  display:inline-flex;
  align-items:center;
  min-height:26px;
  padding:4px 9px;
  border:1px solid rgba(255,107,97,.28);
  border-radius:999px;
  color:#ff9c94;
  background:rgba(255,107,97,.08);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}
.application-boost-panel .gamer-name{
  max-width:100%;
  margin:0;
  color:#fffdf7;
  font-family:"Russo One",Onest,sans-serif;
  font-size:clamp(27px,4vw,40px);
  font-weight:400;
  line-height:1.05;
  letter-spacing:0;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.application-boost-panel .gamer-game{
  display:flex;
  max-width:520px;
  margin-top:13px;
  padding:0;
  border:0;
  border-radius:0;
  color:#eeeae1;
  background:transparent;
}
.application-boost-panel .gamer-game>svg{width:18px;height:18px;color:var(--pass-coral)}
.application-boost-panel .gamer-game small{display:block;color:#85858f;font-size:12px;font-weight:700}
.application-boost-panel .gamer-game strong{color:#f5f1e8;font-size:16px;line-height:1.25}
.application-boost-panel .rank-medallion{
  grid-area:level;
  align-self:center;
  justify-self:stretch;
  display:grid;
  grid-template-columns:84px minmax(0,1fr);
  grid-template-rows:auto auto;
  gap:1px 13px;
  min-width:0;
  padding:13px;
  border:1px solid color-mix(in srgb,var(--rank-accent) 42%,rgba(255,255,255,.12));
  border-radius:19px;
  background:rgba(10,10,13,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.application-boost-panel .rank-medallion-icon{
  grid-row:1/3;
  width:84px;
  height:84px;
  border-radius:22px;
  background:transparent;
  box-shadow:none;
}
.application-boost-panel .rank-medallion-icon .rank-emblem-svg{
  display:block;
  width:84px;
  height:84px;
  filter:drop-shadow(0 10px 18px color-mix(in srgb,var(--rank-accent) 28%,transparent));
}
.application-boost-panel .rank-medallion-icon::after{display:none}
.application-boost-panel .rank-medallion strong{
  align-self:end;
  color:#fffdf7;
  font-family:"Russo One",Onest,sans-serif;
  font-size:30px;
  font-weight:400;
  line-height:1;
}
.application-boost-panel .rank-medallion small{align-self:start;color:#9696a1;font-size:13px}
.application-boost-panel .player-pass-meta{
  grid-area:meta;
  display:grid;
  grid-template-columns:.72fr .9fr 1fr 1.35fr;
  gap:8px;
  min-width:0;
  padding:9px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:17px;
  background:rgba(6,6,9,.2);
}
.application-boost-panel .player-meta-item{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  min-width:0;
  min-height:48px;
  padding:6px 9px;
  border-radius:12px;
  color:#e9e6de;
  text-decoration:none;
  transition:background .18s ease,color .18s ease,transform .18s ease;
}
.application-boost-panel .player-meta-item>svg:first-child{
  width:34px;
  height:34px;
  padding:8px;
  border-radius:10px;
  color:#17171c;
  background:#cfcbc2;
}
.application-boost-panel .player-meta-item>svg:last-child{width:15px;height:15px;color:#777782}
.application-boost-panel .player-meta-item span{min-width:0}
.application-boost-panel .player-meta-item small{display:block;color:#777782;font-size:12px;font-weight:800;text-transform:uppercase}
.application-boost-panel .player-meta-item strong{display:block;overflow:hidden;color:#e9e6de;font-size:14px;text-overflow:ellipsis;white-space:nowrap}
.application-boost-panel .player-meta-item em{display:block;overflow:hidden;margin-top:3px;color:#7f8aa6;font-size:12px;font-style:normal;font-weight:700;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
.application-boost-panel .player-meta-link:hover{color:#fff;background:rgba(255,255,255,.06);transform:translateY(-1px)}
.application-boost-panel .player-meta-link:hover>svg:first-child{background:var(--pass-mint)}
.application-boost-panel .player-meta-link.is-unavailable{cursor:default;opacity:.45;pointer-events:none}
.application-boost-panel .gamer-rank-footer{
  grid-area:rank;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"rank scores" "bar scores" "hint scores";
  gap:10px 18px;
  min-width:0;
  padding:18px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  background:rgba(8,8,11,.22);
}
.application-boost-panel .gamer-rank-meta{grid-area:rank;align-self:center}
.application-boost-panel .gamer-rank-meta .rarity-badge{padding:6px 10px;border:0;border-radius:999px;font-size:12px}
.application-boost-panel .gamer-rank-name{color:#f8f4ec;font-size:15px}
.application-boost-panel .gamer-rank-name #profileRankInlineIcon{width:32px;height:32px;border-radius:10px;background:transparent;box-shadow:none}
.application-boost-panel .player-pass .rank-progress{grid-area:bar;height:7px;margin:0;background:rgba(255,255,255,.09)}
.application-boost-panel .player-pass .rank-progress>span{background:linear-gradient(90deg,var(--pass-coral),var(--rank-accent),var(--pass-mint))}
.application-boost-panel .player-pass .cooldown-text{grid-area:hint;color:#8d8d98;font-size:14px;font-weight:650}
.application-boost-panel .gamer-score-line{
  grid-area:scores;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-self:stretch;
  gap:8px;
  min-width:250px;
  margin:0;
}
.application-boost-panel .gamer-score{
  display:grid;
  grid-template-columns:auto 1fr;
  grid-template-rows:auto auto;
  align-content:center;
  gap:1px 8px;
  min-width:0;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;
  background:rgba(255,255,255,.035);
}
.application-boost-panel .gamer-score svg{grid-row:1/3;width:18px;height:18px;color:var(--pass-coral)}
.application-boost-panel .gamer-score:nth-child(2) svg{color:var(--pass-mint)}
.application-boost-panel .gamer-score strong{font-family:"Russo One",Onest,sans-serif;font-size:21px;font-weight:400;line-height:1}
.application-boost-panel .gamer-score small{color:#85858f;font-size:12px;line-height:1.2}
.application-boost-panel .application-edit-spot{
  grid-area:edit;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  margin:0;
}
.application-boost-panel .application-edit-btn{
  min-height:44px;
  padding:10px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  color:#e8e4dc;
  background:rgba(255,255,255,.055);
}
.application-boost-panel .application-edit-btn:hover{border-color:rgba(131,223,200,.38);background:rgba(131,223,200,.09)}
.application-boost-panel .application-edit-note{color:#777782;font-size:12px}
.application-boost-panel>.daily-chest{
  grid-area:chest;
  min-width:0;
  padding:14px;
  border:1px solid rgba(255,179,106,.17);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,179,106,.08),rgba(255,255,255,.025));
}
.application-boost-panel>.daily-chest .progression-section-head{margin:0 0 9px}
.application-boost-panel>.daily-chest .progression-section-title{color:#ebe7df;font-size:14px}
.application-boost-panel>.daily-chest .progression-section-title svg{color:#ffb36a}
.application-boost-panel>.daily-chest .progression-section-note{color:#81818c;font-size:12px}
.application-boost-panel>.daily-chest .daily-chest-card{
  grid-template-columns:50px minmax(0,1fr) auto;
  gap:10px;
  min-height:76px;
  padding:10px;
  border:0;
  border-radius:14px;
  background:rgba(8,8,11,.28);
}
.application-boost-panel>.daily-chest .daily-chest-icon{width:50px;height:50px;border-radius:14px;color:#1d1711;background:linear-gradient(145deg,#ffd195,#ff9f5b)}
.application-boost-panel>.daily-chest .daily-chest-copy{min-width:0;padding:0;background:transparent}
.application-boost-panel>.daily-chest .daily-chest-title{font-size:14px}
.application-boost-panel>.daily-chest .daily-chest-text{color:#aaa5a0!important;font-size:13px!important;line-height:1.35}
.application-boost-panel>.daily-chest .daily-chest-btn{min-width:112px;min-height:44px;border-radius:12px;color:#17171c;background:#ffad67}
.application-boost-panel>.daily-chest .daily-streak-chain{margin-top:8px}
.application-boost-panel .player-progress-drawer{
  grid-area:drawer;
  align-self:start;
  min-width:0;
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  background:rgba(255,255,255,.04);
  overflow:hidden;
}
.application-boost-panel .player-progress-drawer>summary{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  gap:11px;
  align-items:center;
  min-height:76px;
  padding:11px 13px;
  cursor:pointer;
  list-style:none;
}
.application-boost-panel .player-progress-drawer>summary::-webkit-details-marker{display:none}
.application-boost-panel .player-progress-drawer-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;color:#17171c;background:var(--pass-mint)}
.application-boost-panel .player-progress-drawer-icon svg{width:20px;height:20px}
.application-boost-panel .player-progress-drawer summary strong{display:block;color:#f1ede5;font-size:14px}
.application-boost-panel .player-progress-drawer summary small{display:block;margin-top:2px;color:#85858f;font-size:12px;line-height:1.3}
.application-boost-panel .player-progress-chevron{width:18px;height:18px;color:#85858f;transition:transform .22s ease}
.application-boost-panel .player-progress-drawer[open] .player-progress-chevron{transform:rotate(180deg)}
.application-boost-panel .player-progress-drawer-body{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  padding:0 13px 13px;
}
.application-boost-panel .player-progress-drawer-body>.streak-quest,
.application-boost-panel .player-progress-drawer-body>.daily-quests,
.application-boost-panel .player-progress-drawer-body>.room-section{
  width:100%;
  margin:0;
  padding:11px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;
  color:#e8e4dc;
  background:rgba(5,5,8,.22);
}
.application-boost-panel .player-progress-drawer-body>.streak-quest,
.application-boost-panel .player-progress-drawer-body>.daily-quests{
  grid-column:1/-1;
  display:block!important;
}
.application-boost-panel .player-progress-drawer-body>.hud-rank-section,
.application-boost-panel .player-progress-drawer-body>.hud-season-section,
.application-boost-panel .player-progress-drawer-body>.hud-activity-section{
  display:block!important;
}
.application-boost-panel .player-progress-drawer-body .achievement-vault{
  display:block!important;
}
.application-boost-panel .player-progress-drawer-body>.room-section>summary{min-height:42px;color:#e8e4dc}
.application-boost-panel .player-progress-drawer-body .room-section-note{color:#92919c}
.application-boost-panel .quiz-zone{grid-area:quiz}
.application-boost-panel .application-edit-panel{grid-area:edit}
.application-boost-panel .tiktok-room-section{grid-area:tiktok}
.application-boost-panel .boost-rules{grid-area:rules}
.application-boost-panel .room-tabs,
.application-boost-panel .room-tab-panel{display:none!important}
.application-boost-panel :is(button,a,summary,input,textarea):focus-visible{
  outline:3px solid rgba(131,223,200,.75);
  outline-offset:3px;
}
.application-boost-panel :is(button,a){-webkit-tap-highlight-color:transparent}
.application-boost-panel button:active{transform:translateY(1px) scale(.99)}
@keyframes playerPassIn{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media (hover:hover) and (pointer:fine){
  .application-boost-panel .player-pass:hover{box-shadow:0 30px 66px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
}
@media (max-width:760px){
  .application-popup{width:calc(100vw - 12px);max-height:calc(100dvh - 12px);padding:6px;border-radius:20px}
  .application-boost-panel{
    grid-template-columns:1fr;
    grid-template-areas:"head" "profile" "action" "chest" "drawer" "quiz" "edit" "tiktok" "rules";
    gap:10px;
    padding:12px;
    border-radius:17px;
  }
  .application-boost-panel .boost-panel-head{padding:2px}
  .application-boost-panel .boost-rank-icon{width:42px;height:42px;border-radius:13px}
  .application-boost-panel .boost-panel-title{font-size:18px}
  .application-boost-panel .boost-panel-sub{font-size:13px}
  .application-boost-panel .player-pass{
    grid-template-columns:76px minmax(0,1fr);
    grid-template-areas:"avatar identity" "level level" "meta meta" "rank rank" "edit edit";
    gap:14px;
    padding:16px;
    border-radius:19px;
  }
  .application-boost-panel .player-pass>.gamer-avatar{width:76px;height:76px;border-radius:20px}
  .application-boost-panel .player-pass>.gamer-avatar img{border-radius:19px}
  .application-boost-panel .player-pass>.gamer-avatar::after{inset:4px;border-radius:15px}
  .application-boost-panel .player-pass-identity{align-self:center}
  .application-boost-panel .player-pass-eyebrow{flex-wrap:wrap;gap:5px;margin-bottom:5px}
  .application-boost-panel .gamer-kicker{font-size:12px}
  .application-boost-panel .player-number{min-height:22px;padding:3px 7px;font-size:12px}
  .application-boost-panel .gamer-name{font-size:clamp(22px,7vw,30px)}
  .application-boost-panel .gamer-game{margin-top:7px}
  .application-boost-panel .gamer-game small{font-size:12px}
  .application-boost-panel .gamer-game strong{max-width:46vw;font-size:14px}
  .application-boost-panel .rank-medallion{
    grid-template-columns:50px auto auto;
    grid-template-rows:1fr;
    justify-content:start;
    width:100%;
    padding:10px;
  }
  .application-boost-panel .rank-medallion-icon{grid-row:auto;width:64px;height:64px}
  .application-boost-panel .rank-medallion-icon .rank-emblem-svg{width:64px;height:64px}
  .application-boost-panel .rank-medallion strong{align-self:center;font-size:26px}
  .application-boost-panel .rank-medallion small{align-self:center}
  .application-boost-panel .player-pass-meta{grid-template-columns:1fr;padding:6px}
  .application-boost-panel .player-meta-item{min-height:44px}
  .application-boost-panel .gamer-rank-footer{
    grid-template-columns:1fr;
    grid-template-areas:"rank" "bar" "hint" "scores";
    gap:9px;
    padding:13px;
  }
  .application-boost-panel .gamer-rank-meta{flex-wrap:wrap}
  .application-boost-panel .gamer-score-line{grid-template-columns:1fr 1fr;min-width:0}
  .application-boost-panel .gamer-score{padding:9px}
  .application-boost-panel .gamer-score strong{font-size:18px}
  .application-boost-panel .application-edit-spot{justify-content:stretch;align-items:stretch;flex-direction:column}
  .application-boost-panel .application-edit-btn{width:100%;justify-content:center}
  .application-boost-panel>.daily-chest .daily-chest-card{grid-template-columns:44px minmax(0,1fr)}
  .application-boost-panel>.daily-chest .daily-chest-icon{width:44px;height:44px}
