

<style>
/* RYTNI event page: isolated public-page visual layer */
#rytni-event-page{
  --event-bg:#030518;
  --event-bg-soft:#080b25;
  --event-panel:rgba(8,12,39,.84);
  --event-panel-strong:rgba(10,13,44,.94);
  --event-line:rgba(139,77,255,.36);
  --event-line-soft:rgba(119,145,255,.2);
  --event-text:#fff;
  --event-muted:#aeb2cc;
  --event-dim:#747995;
  --event-purple:#8d42ff;
  --event-pink:#cf43ff;
  --event-blue:#5268ff;
  --event-cyan:#24c8ff;
  --event-gold:#ffbd2f;
  --event-radius:18px;
  --event-shadow:0 26px 70px rgba(0,0,0,.38);
  position:relative;
  width:100%;
  min-height:100vh;
  overflow-x:clip;
  color:var(--event-text);
  background:
    linear-gradient(180deg,rgba(3,5,24,.08),rgba(3,5,24,.42) 38%,rgba(2,4,18,.74)),
    url("https://rytni.github.io/rytni-assets/background-1920.webp") center top/cover fixed no-repeat,
    var(--event-bg);
  color-scheme:dark;
  font-family:Manrope,Onest,system-ui,sans-serif;
}
#rytni-event-page::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 11%,rgba(112,49,255,.16),transparent 32%),
    linear-gradient(90deg,rgba(1,3,16,.28),transparent 18% 82%,rgba(1,3,16,.28));
}
#rytni-event-page>.page,
#rytni-event-page>.top-nav,
#rytni-event-page>.announcement-banner,
#rytni-event-page>.sticky-cta{position:relative;z-index:2}
#rytni-event-page>.page{z-index:1}

/* Navigation */
#rytni-event-page .top-nav{
  position:fixed!important;
  z-index:1000!important;
  top:14px;
  left:50%;
  display:flex;
  align-items:center;
  gap:6px;
  width:min(1180px,calc(100% - 28px));
  max-width:none;
  padding:9px 12px;
  transform:translateX(-50%);
  overflow:visible;
  border:1px solid rgba(139,77,255,.26);
  border-radius:16px;
  background:rgba(4,7,27,.78);
  box-shadow:0 18px 46px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  pointer-events:auto;
}
#rytni-event-page .top-nav a{pointer-events:auto}
#rytni-event-page .top-nav .nav-brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
  padding:3px 10px 3px 3px;
  color:#fff;
  border:0;
  background:transparent;
  cursor:pointer;
}
#rytni-event-page .top-nav .nav-brand img{
  width:64px;
  height:64px;
  object-fit:contain;
  filter:drop-shadow(0 0 12px rgba(201,67,255,.62));
}
#rytni-event-page .top-nav .nav-brand span{display:grid;font:800 16px/1 Manrope,sans-serif;letter-spacing:0}
#rytni-event-page .top-nav .nav-brand b{margin-top:3px;color:#d86cff;font:inherit}
#rytni-event-page .top-nav a{
  min-height:44px;
  padding:13px 18px;
  border-radius:11px;
  color:#c5c7da;
  font-size:14px;
  font-weight:750;
  text-shadow:none;
  transition:color .2s ease,background .2s ease,transform .2s ease,box-shadow .2s ease;
}
#rytni-event-page .top-nav a:hover,
#rytni-event-page .top-nav a:focus-visible{
  color:#fff;
  background:rgba(132,60,255,.14);
  box-shadow:0 0 22px rgba(139,65,255,.16);
  transform:translateY(-1px);
}
#rytni-event-page .top-nav .donate{
  margin-left:18px;
  color:#241400;
  background:linear-gradient(135deg,#ffd557,#ff9d16);
  box-shadow:0 0 24px rgba(255,181,27,.34),inset 0 1px 0 rgba(255,255,255,.55);
}

/* Main and hero */
#rytni-event-page .page{width:min(1180px,100%);padding:108px 18px 88px}
#rytni-event-page .hero{
  grid-template-columns:minmax(260px,370px) minmax(0,1fr);
  gap:46px;
  min-height:390px;
  padding:24px 20px 12px;
}
#rytni-event-page .avatar{
  width:min(100%,350px);
  justify-self:center;
  border-radius:50%;
  background:url("https://rytni.github.io/rytni-assets/logo2.webp") center/contain no-repeat;
  box-shadow:none;
  filter:drop-shadow(0 0 12px rgba(224,71,255,.6)) drop-shadow(0 0 34px rgba(90,69,255,.46));
  animation:eventLogoFloat 6s ease-in-out infinite alternate;
}
#rytni-event-page .eyebrow{
  border-color:rgba(190,94,255,.46);
  color:#e2d7ff;
  background:rgba(46,19,92,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px rgba(151,65,255,.12);
  font-size:13px;
}
#rytni-event-page .eyebrow::before{content:"◆";color:#c44cff;text-shadow:0 0 12px #c44cff}
#rytni-event-page .season-state-badge{
  border-color:rgba(49,219,170,.3);
  color:#6ce4bd;
  background:rgba(12,65,59,.4);
}
#rytni-event-page h1{
  margin:16px 0 13px;
  color:#fff;
  background:linear-gradient(180deg,#fff 4%,#eef0ff 42%,#bb40ff 62%,#772df0 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 8px 18px rgba(133,47,255,.2));
  font-family:Unbounded,Manrope,sans-serif;
  font-size:clamp(40px,5.2vw,68px);
  font-weight:800;
}
#rytni-event-page .lead{max-width:680px;color:#b7bad0;font-size:16px;line-height:1.65}
#rytni-event-page .hero-actions{margin-top:22px}

/* Shared public controls */
#rytni-event-page :is(.hero,.grid,.sticky-cta) :is(.btn,.ghost-btn,.gold-boost-btn){
  min-height:50px;
  border-radius:12px;
  color:#fff;
  transition:transform .2s ease,filter .2s ease,box-shadow .2s ease;
}
#rytni-event-page :is(.hero,.grid,.sticky-cta) .btn,
#rytni-event-page .energy-btn{
  border:1px solid rgba(127,98,255,.66);
  background:linear-gradient(115deg,#3e38ee,#7338ff 54%,#ae2dff);
  box-shadow:0 12px 30px rgba(94,48,240,.3),0 0 22px rgba(112,55,255,.16),inset 0 1px 0 rgba(255,255,255,.18);
}
#rytni-event-page :is(.hero,.grid) .ghost-btn{
  border:1px solid rgba(147,95,255,.4);
  color:#e7ddff;
  background:rgba(22,17,62,.62);
}
#rytni-event-page :is(.hero,.grid,.sticky-cta) :is(.btn,.ghost-btn,.gold-boost-btn):hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}
#rytni-event-page .gold-boost-btn{
  width:100%;
  border:1px solid rgba(131,83,255,.66);
  color:#fff;
  background:linear-gradient(105deg,#382af5,#772eff 56%,#bb28ee);
  box-shadow:0 12px 26px rgba(85,39,224,.32),0 0 22px rgba(153,47,255,.2);
}
#rytni-event-page .announcement-banner{
  border:1px solid rgba(177,79,255,.42);
  color:#f2ecff;
  background:rgba(11,14,48,.9);
}

/* Public content panels */
#rytni-event-page .grid{gap:18px;margin-top:18px}
#rytni-event-page .card{
  overflow:hidden;
  border:1px solid var(--event-line);
  border-radius:var(--event-radius);
  color:var(--event-text);
  background:
    linear-gradient(145deg,rgba(13,18,57,.9),rgba(7,10,36,.88)),
    var(--event-panel);
  box-shadow:var(--event-shadow),inset 0 1px 0 rgba(255,255,255,.055);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  animation:eventRise .55s ease both;
}
#rytni-event-page .card:nth-child(2){animation-delay:.05s}
#rytni-event-page .card:nth-child(3){animation-delay:.1s}
#rytni-event-page .card-inner{padding:24px}
#rytni-event-page .section-title{
  color:#ce82ff;
  font-family:Manrope,Onest,sans-serif;
  font-size:22px;
  font-weight:800;
  text-shadow:0 0 18px rgba(190,61,255,.24);
}
#rytni-event-page .small-title{color:#bd79ff;font-family:Manrope,sans-serif;font-size:14px;text-align:center}

/* Winner */
#rytni-event-page .winner-box{min-height:236px}
#rytni-event-page .grid>.card:first-child{overflow:visible}
#rytni-event-page .grid>.card:first-child .card-inner{overflow:visible}
#rytni-event-page .trophy{
  width:116px;
  overflow:visible;
  border:0;
  background:transparent;
  box-shadow:none;
}
#rytni-event-page .trophy img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,188,40,.5))}
#rytni-event-page .winner-count{
  border-color:rgba(178,99,255,.3);
  color:#c9b8e8;
  background:rgba(42,22,88,.48);
}
#rytni-event-page .winner-count strong{color:#d67aff}
#rytni-event-page .winner-item{
  border-color:rgba(118,104,218,.22);
  color:#fff;
  background:rgba(4,8,29,.48);
}
#rytni-event-page .winner-item.game{border-color:rgba(144,86,255,.28);background:rgba(11,10,41,.66)}
#rytni-event-page .winner-icon{
  width:42px;
  height:42px;
  border:0;
  border-radius:11px;
  color:transparent;
  background:center/contain no-repeat;
  font-size:0;
  box-shadow:0 0 16px rgba(143,64,255,.2);
}
#rytni-event-page .winner-item.game .winner-icon{background-image:url("https://rytni.github.io/rytni-assets/Games.webp")}
#rytni-event-page .winner-item.winner .winner-icon{background-image:url("https://rytni.github.io/rytni-assets/Name.webp")}
#rytni-event-page .winner-label{color:#747995}
#rytni-event-page .winner-value{color:#f7f5ff;font-size:15px}

/* Isolated game HUD countdown */
#rytni-event-page .season-connection-notice{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;margin:0 0 16px;padding:13px 14px;border:1px solid rgba(255,183,71,.38);border-radius:16px;color:#fff;background:linear-gradient(135deg,rgba(75,43,18,.86),rgba(29,18,51,.9));box-shadow:0 12px 30px rgba(3,6,22,.24)}
#rytni-event-page .season-connection-notice[hidden]{display:none!important}
#rytni-event-page .season-connection-notice[data-mode="cached"]{border-color:rgba(93,199,255,.34);background:linear-gradient(135deg,rgba(12,50,73,.86),rgba(28,20,66,.9))}
#rytni-event-page .season-connection-notice[data-mode="idle"]{border-color:rgba(93,199,255,.28);background:linear-gradient(135deg,rgba(12,43,68,.78),rgba(28,20,66,.84))}
#rytni-event-page .season-connection-icon{display:grid;width:40px;height:40px;place-items:center;border:1px solid rgba(255,255,255,.14);border-radius:13px;color:#ffd06b;background:rgba(255,255,255,.07)}
#rytni-event-page .season-connection-notice[data-mode="cached"] .season-connection-icon{color:#72dcff}
#rytni-event-page .season-connection-notice[data-mode="idle"] .season-connection-icon{color:#72dcff}
#rytni-event-page .season-connection-icon svg{width:20px;height:20px}
#rytni-event-page .season-connection-copy{display:grid;min-width:0;gap:2px}
#rytni-event-page .season-connection-copy strong{font-size:14px;line-height:1.35}
#rytni-event-page .season-connection-copy small{color:#c3cbe0;font-size:13px;line-height:1.45}
#rytni-event-page .season-connection-copy em{color:#8f9abb;font-size:12px;font-style:normal;letter-spacing:.06em}
#rytni-event-page .season-connection-retry{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:7px;padding:0 13px;border:1px solid rgba(153,124,255,.48);border-radius:11px;color:#fff;background:linear-gradient(135deg,rgba(77,55,176,.92),rgba(137,51,194,.92));font:800 14px/1 Manrope,system-ui,sans-serif;cursor:pointer}
#rytni-event-page .season-connection-retry:hover{filter:brightness(1.1)}
#rytni-event-page .season-connection-retry:disabled{cursor:wait;opacity:.65}
#rytni-event-page .season-connection-retry svg{width:15px;height:15px}
#rytni-event-page .rytni-countdown-season{margin-bottom:5px;color:#9e78ff;font-size:13px;letter-spacing:0;text-align:center}
#rytni-event-page .rytni-countdown-title{
  margin:0 0 clamp(10px,1.4vw,16px);
  color:#f7f5ff;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:clamp(15px,1.5vw,20px);
  line-height:1.2;
  letter-spacing:0;
  text-align:center;
}
#rytni-event-page .rytni-countdown-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr) 12px) minmax(0,1fr);
  align-items:center;
  gap:clamp(3px,.6vw,8px);
  width:100%;
  min-width:0;
}
#rytni-event-page .rytni-countdown-unit{
  position:relative;
  min-width:0;
  padding:clamp(7px,1vw,11px) clamp(3px,.6vw,8px) clamp(8px,1vw,10px);
  overflow:hidden;
  border:1px solid rgba(120,143,255,.36);
  border-radius:clamp(11px,1.1vw,15px);
  background:linear-gradient(160deg,rgba(18,27,69,.78),rgba(4,8,31,.68));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -12px 24px rgba(0,0,0,.13),0 0 20px rgba(70,89,255,.09);
  -webkit-backdrop-filter:blur(14px) saturate(135%);
  backdrop-filter:blur(14px) saturate(135%);
  text-align:center;
  animation:rytniCountdownBreathe 4.8s ease-in-out infinite;
}
#rytni-event-page .rytni-countdown-unit:nth-of-type(2n){animation-delay:-2.4s}
#rytni-event-page .rytni-countdown-unit::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(75,220,255,.08),transparent 34%,rgba(169,66,255,.09));
}
#rytni-event-page .rytni-countdown-flip{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(34px,4vw,50px);
  perspective:280px;
  transform-style:preserve-3d;
}
#rytni-event-page .rytni-countdown-flip::before,
#rytni-event-page .rytni-countdown-flip::after{
  content:"";
  position:absolute;
  z-index:2;
  top:50%;
  width:6px;
  height:1px;
  background:rgba(153,174,255,.46);
  box-shadow:0 0 8px rgba(85,142,255,.38);
}
#rytni-event-page .rytni-countdown-flip::before{left:-2px}
#rytni-event-page .rytni-countdown-flip::after{right:-2px}
#rytni-event-page .rytni-countdown-value{
  display:block;
  position:relative;
  z-index:1;
  color:#fff;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:clamp(21px,2.7vw,35px);
  font-variant-numeric:tabular-nums;
  font-weight:800;
  line-height:1;
  letter-spacing:0;
  text-shadow:0 2px 0 rgba(78,65,158,.58),0 0 16px rgba(109,123,255,.4);
  transform-origin:50% 50%;
}
#rytni-event-page .rytni-countdown-flip::selection{background:transparent}
#rytni-event-page .rytni-countdown-unit.is-flipping .rytni-countdown-value{animation:rytniCountdownFlip .4s cubic-bezier(.2,.7,.25,1)}
#rytni-event-page .rytni-countdown-unit small{
  display:block;
  position:relative;
  z-index:1;
  margin-top:4px;
  color:#8f98bb;
  font-size:clamp(12px,.9vw,13px);
  font-weight:800;
  line-height:1;
  letter-spacing:.02em;
}
#rytni-event-page .rytni-countdown-divider{display:grid;place-items:center;gap:6px}
#rytni-event-page .rytni-countdown-divider i{width:4px;height:4px;border-radius:50%;background:#7f76ff;box-shadow:0 0 8px #795cff}
@keyframes rytniCountdownFlip{
  0%{opacity:.72;transform:rotateX(0)}
  46%{opacity:.22;transform:rotateX(-82deg) translateY(2px)}
  54%{opacity:.22;transform:rotateX(78deg) translateY(-2px)}
  100%{opacity:1;transform:rotateX(0)}
}
@keyframes rytniCountdownBreathe{
  0%,100%{transform:scale(1);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 18px rgba(70,89,255,.08)}
  50%{transform:scale(1.012);box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 0 24px rgba(117,65,255,.16)}
}
#rytni-event-page .season-finished{border-color:rgba(192,70,255,.35);color:#efc9ff;background:rgba(71,22,90,.46)}
@media(max-width:620px){#rytni-event-page .season-connection-notice{grid-template-columns:36px minmax(0,1fr);gap:10px}#rytni-event-page .season-connection-icon{width:36px;height:36px}#rytni-event-page .season-connection-retry{grid-column:1/-1;width:100%}}

/* Entry form */
#rytni-event-page #giveawayForm{gap:15px}
#rytni-event-page #giveawayForm .title{color:#e7e5f1;font-size:14px}
#rytni-event-page #giveawayForm :is(input[type=text],input[type=url],select,textarea){
  min-height:52px;
  border:1px solid rgba(99,102,196,.38);
  border-radius:11px;
  color:#fff;
  background:rgba(3,7,29,.68);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
#rytni-event-page #giveawayForm select{width:100%;padding:0 44px 0 15px;appearance:none;-webkit-appearance:none;cursor:pointer;background-color:rgba(3,7,29,.86);background-image:linear-gradient(45deg,transparent 50%,#ae8bff 50%),linear-gradient(135deg,#ae8bff 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
#rytni-event-page #giveawayForm select:invalid{color:#747995}
#rytni-event-page #giveawayForm select option{color:#f6f3ff;background:#0c1030}
#rytni-event-page #giveawayForm :is(input,textarea)::placeholder{color:#696f8d}
#rytni-event-page #giveawayForm :is(input,select,textarea):focus{
  border-color:#9147ff;
  box-shadow:0 0 0 3px rgba(139,66,255,.14),inset 0 0 18px rgba(91,55,190,.08);
}
#rytni-event-page #giveawayForm textarea{min-height:126px}
#rytni-event-page #giveawayForm .hint{color:#747995}
#rytni-event-page #giveawayForm .check{
  border-color:rgba(106,99,181,.24);
  color:#deddea;
  background:rgba(4,8,29,.46);
}
#rytni-event-page #giveawayForm .check input{accent-color:#8d42ff}
#rytni-event-page #giveawayForm .form-status.ok{color:#55dfb7}
#rytni-event-page #giveawayForm .form-status.err{color:#ff6f91}
#rytni-event-page .email-confirm-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:13px 18px;padding:17px 18px;border:1px solid rgba(132,91,255,.52);border-radius:18px;background:radial-gradient(circle at 8% 0,rgba(141,66,255,.22),transparent 42%),linear-gradient(145deg,rgba(18,17,58,.92),rgba(9,15,43,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 36px rgba(0,0,0,.18)}
#rytni-event-page .email-confirm-copy{display:grid;gap:5px;min-width:0}
#rytni-event-page .email-confirm-copy strong{color:#fff;font:900 16px/1.25 Onest,Manrope,sans-serif}
#rytni-event-page .email-confirm-copy span{color:#b6bdd5;font-size:14px;line-height:1.5}
#rytni-event-page .email-confirm-btn{display:flex;align-items:center;justify-content:center;gap:10px;min-width:235px;min-height:54px;padding:12px 17px;border:1px solid rgba(133,238,255,.72);border-radius:15px;color:#06101e;background:linear-gradient(135deg,#79f2ff,#a68aff 58%,#e17aff);box-shadow:0 12px 30px rgba(100,83,255,.3),0 0 28px rgba(76,222,255,.14),inset 0 1px 0 rgba(255,255,255,.68);font:950 14px/1 Onest,Manrope,sans-serif;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
#rytni-event-page .email-confirm-btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 38px rgba(100,83,255,.4),0 0 34px rgba(76,222,255,.2)}
#rytni-event-page .email-confirm-btn:focus-visible{outline:3px solid rgba(119,238,255,.35);outline-offset:3px}
#rytni-event-page .email-confirm-btn svg{width:19px;height:19px}
#rytni-event-page .email-confirm-btn svg:last-child{width:17px;height:17px}
#rytni-event-page .email-confirm-reason{grid-column:1/-1;display:flex;align-items:flex-start;gap:8px;padding-top:11px;border-top:1px solid rgba(150,137,255,.2);color:#94a7c8;font-size:13px;line-height:1.5}
#rytni-event-page .email-confirm-reason svg{flex:0 0 16px;width:16px;height:16px;margin-top:1px;color:#66e7c2}

/* Rules */
#rytni-event-page .rules-card{
  min-height:360px;
  background:
    linear-gradient(90deg,rgba(9,10,42,.96),rgba(12,9,46,.78) 64%,rgba(12,7,42,.5)),
    url("https://rytni.github.io/rytni-assets/background-1920.webp") right center/cover no-repeat;
}
