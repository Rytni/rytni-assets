<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&family=Russo+One&family=Unbounded:wght@600;700;800&display=swap">
<style>
:root{
  --text:#111827;
  --muted:#5b6473;
  --line:rgba(17,24,39,.1);
  --panel:rgba(255,255,255,.86);
  --panel-strong:rgba(255,255,255,.94);
  --blue:#2563eb;
  --cyan:#38bdf8;
  --orange:#f97316;
  --green:#16a34a;
  --red:#dc2626;
  --shadow:0 18px 55px rgba(20,35,70,.14);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    linear-gradient(180deg,rgba(3,5,24,.12),rgba(2,4,18,.74)),
    url("https://rytni.github.io/rytni-assets/background-1920.webp") center top/cover fixed no-repeat,
    #030518;
}
button,input,textarea{font:inherit}
.top-nav{
  position:fixed;
  z-index:40;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:7px;
  width:max-content;
  max-width:calc(100% - 24px);
  padding:8px;
  overflow-x:auto;
  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;
  background:rgba(255,255,255,.18);
  box-shadow:0 10px 35px rgba(15,23,42,.14),0 0 30px rgba(56,189,248,.08);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  scrollbar-width:none;
}
.top-nav::-webkit-scrollbar{display:none}
.top-nav a{
  flex:0 0 auto;
  color:#172033;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  line-height:1;
  padding:12px 20px;
  border-radius:999px;
  text-shadow:0 1px 2px rgba(255,255,255,.28);
}
.top-nav a:hover,.top-nav a:focus-visible{background:rgba(255,255,255,.18)}
.top-nav .donate{
  margin-left:auto;
  color:#fff;
  background:linear-gradient(135deg,#f59e0b,var(--orange));
  box-shadow:0 0 20px rgba(245,158,11,.42),0 0 40px rgba(249,115,22,.18);
}
.top-nav .donate:hover,.top-nav .donate:focus-visible{
  color:#fff;
  background:linear-gradient(135deg,#fb923c,#ea580c);
  box-shadow:0 0 24px rgba(245,158,11,.58),0 0 55px rgba(249,115,22,.28);
}
.page{
  width:min(920px,100%);
  margin:0 auto;
  padding:88px 16px 80px;
}
.hero{
  display:grid;
  grid-template-columns:180px minmax(0,1fr);
  gap:22px;
  align-items:center;
  padding:18px 0 8px;
}
.avatar{
  width:180px;
  aspect-ratio:1;
  border-radius:50%;
  background:url("https://rytni.github.io/rytni-assets/legacy/podari-background.webp") center/cover;
  box-shadow:0 0 0 10px rgba(255,255,255,.72),0 18px 55px rgba(37,99,235,.24);
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  max-width:100%;
  padding:9px 13px;
  border:1px solid rgba(37,99,235,.12);
  border-radius:999px;
  background:rgba(255,255,255,.78);
  color:#1d4ed8;
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
}
h1{
  margin:14px 0 10px;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:clamp(30px,6vw,64px);
  line-height:1.02;
  letter-spacing:0;
  white-space:nowrap;
}
.lead{
  max-width:610px;
  margin:0;
  color:#3f4858;
  font-size:18px;
  line-height:1.5;
}
.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
.btn,.ghost-btn,.popup-btn{
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  border:0;
  border-radius:14px;
  cursor:pointer;
  font-weight:700;
  text-decoration:none;
}
.btn{
  position:relative;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  overflow:hidden;
  min-height:52px;
  padding:15px 20px;
  color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  box-shadow:0 14px 30px rgba(37,99,235,.24);
}
.btn:disabled{cursor:not-allowed;opacity:.7}
.energy-btn{
  font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:18px;
  font-weight:800;
  isolation:isolate;
  border:0;
  background:
    radial-gradient(circle at 18% 18%,rgba(255,255,255,.1),rgba(255,255,255,0) 28%),
    linear-gradient(135deg,#0369a1 0%,#1d4ed8 52%,#1e3a8a 100%);
  background-clip:padding-box;
  text-shadow:0 1px 1px rgba(15,23,42,.45);
  box-shadow:0 16px 34px rgba(30,64,175,.34),0 0 0 1px rgba(30,64,175,.2) inset;
  transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;
}
.energy-btn::before{
  content:"";
  position:absolute;
  z-index:0;
  top:3px;
  bottom:3px;
  left:3px;
  width:26%;
  border-radius:11px;
  transform:translateX(-150%);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.34),rgba(255,255,255,0));
  opacity:0;
  animation:energySweep 3.2s ease-in-out infinite;
  pointer-events:none;
}
.energy-btn::after{
  display:none;
}
.energy-btn:hover,.energy-btn:focus-visible{
  transform:translateY(-2px);
  filter:saturate(1.08);
  box-shadow:0 18px 42px rgba(37,99,235,.44),0 0 28px rgba(37,99,235,.3),0 0 0 1px rgba(30,64,175,.22) inset;
}
.energy-btn:disabled::before{animation:none}
@keyframes energySweep{
  0%,18%{transform:translateX(-150%);opacity:0}
  34%{opacity:.9}
  58%,100%{transform:translateX(430%);opacity:0}
}
.ghost-btn{
  display:inline-flex;
  align-items:center;
  min-height:52px;
  padding:14px 18px;
  color:#1d4ed8;
  border:1px solid rgba(37,99,235,.16);
  background:rgba(255,255,255,.78);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:20px;
}
.card{
  border:1px solid rgba(255,255,255,.82);
  border-radius:18px;
  background:var(--panel);
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.card-inner{padding:20px}
.span-2{grid-column:1/-1}
.compact-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 16px;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:22px;
  font-weight:700;
  line-height:1.2;
}
.small-title{
  margin:0 0 12px;
  color:#1d4ed8;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:15px;
  font-weight:800;
  text-transform:uppercase;
}
.winner-box{
  display:flex;
  align-items:center;
  gap:16px;
}
.winner-meta{
  min-width:0;
  flex:1;
}
.winner-count{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  padding:8px 12px;
  border:1px solid rgba(245,158,11,.2);
  border-radius:999px;
  background:rgba(255,247,204,.72);
  color:#9a6700;
  font-size:14px;
  font-weight:800;
}
.winner-count strong{
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:14px;
  color:#b45309;
}
.winner-line{
  display:grid;
  gap:8px;
}
.winner-item{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:10px 12px;
  border:1px solid rgba(37,99,235,.1);
  border-radius:14px;
  background:rgba(255,255,255,.64);
}
.winner-item.game{
  border-color:rgba(245,158,11,.18);
  background:rgba(255,251,235,.82);
}
.winner-icon{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex:0 0 auto;
  border-radius:12px;
  background:linear-gradient(135deg,#eff6ff,#dbeafe);
  color:#1d4ed8;
  font-size:16px;
  font-weight:800;
}
.winner-item.game .winner-icon{
  background:linear-gradient(135deg,#fff7cc,#fde68a);
  color:#b45309;
}
.winner-copy{
  min-width:0;
}
.winner-label{
  margin:0 0 2px;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.winner-value{
  font-size:18px;
  font-weight:800;
  line-height:1.2;
  overflow-wrap:anywhere;
}
.trophy{
  display:grid;
  place-items:center;
  width:72px;
  aspect-ratio:1;
  flex:0 0 auto;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(245,158,11,.35);
  border-radius:20px;
  background:
    radial-gradient(circle at 28% 22%,rgba(255,255,255,.95),rgba(255,255,255,0) 32%),
    linear-gradient(135deg,#fff7cc,#facc15 52%,#f59e0b);
  box-shadow:0 14px 28px rgba(245,158,11,.24),inset 0 1px 0 rgba(255,255,255,.62);
}
.trophy svg{
  width:48px;
  height:48px;
  filter:drop-shadow(0 6px 8px rgba(146,64,14,.22));
}
#lastWinner{font-size:18px;font-weight:800}
.season-finished{
  padding:18px;
  border:1px solid rgba(22,163,74,.18);
  border-radius:14px;
  color:#166534;
  background:rgba(220,252,231,.72);
  text-align:center;
  font-weight:800;
}
.rules-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.76);
  background:
    radial-gradient(circle at 10% 0%,rgba(56,189,248,.2),rgba(56,189,248,0) 32%),
    radial-gradient(circle at 92% 12%,rgba(245,158,11,.18),rgba(245,158,11,0) 28%),
    linear-gradient(135deg,rgba(255,255,255,.96),rgba(241,245,249,.88)),
    var(--panel);
  box-shadow:0 22px 70px rgba(15,23,42,.16);
}
.rules-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:1px;
  background:linear-gradient(90deg,rgba(56,189,248,0),rgba(56,189,248,.9),rgba(245,158,11,.9),rgba(56,189,248,0));
}
.rules-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}
.rules-head .section-title{margin:0}
.trust-list{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.trust-list::before{
  content:"";
  position:absolute;
  left:calc(12.5% + 19px);
  right:calc(12.5% + 19px);
  top:27px;
  height:2px;
  background:linear-gradient(90deg,rgba(37,99,235,.28),rgba(245,158,11,.5),rgba(37,99,235,.28));
  pointer-events:none;
}
.trust-item{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:148px;
  padding:16px;
  border:1px solid rgba(15,23,42,.08);
  border-radius:18px;
  background:rgba(255,255,255,.7);
  box-shadow:0 12px 30px rgba(15,23,42,.07),inset 0 1px 0 rgba(255,255,255,.82);
  color:#374151;
  font-size:14px;
  line-height:1.45;
}
.trust-icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:999px;
  background:linear-gradient(135deg,#0f172a,#1d4ed8);
  color:#fff;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:14px;
  font-weight:800;
  box-shadow:0 10px 22px rgba(37,99,235,.22);
}
.trust-item strong{
  display:block;
  color:#111827;
  margin-bottom:6px;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:14px;
  line-height:1.25;
}
.top-games-list{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  min-height:420px;
}
.top-games-card{
  position:relative;
  overflow:hidden;
  border-color:rgba(37,99,235,.14);
  background:
    radial-gradient(circle at 8% 0%,rgba(250,204,21,.18),rgba(250,204,21,0) 30%),
    radial-gradient(circle at 100% 12%,rgba(37,99,235,.16),rgba(37,99,235,0) 30%),
    rgba(255,255,255,.86);
}
.top-games-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:1px;
  background:linear-gradient(90deg,rgba(250,204,21,0),rgba(250,204,21,.9),rgba(37,99,235,.75),rgba(250,204,21,0));
}
.top-games-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.top-games-head .section-title{margin:0}
.rating-pill{
  flex:0 0 auto;
  padding:7px 10px;
  border:1px solid rgba(37,99,235,.12);
  border-radius:999px;
  background:rgba(255,255,255,.7);
  color:#1d4ed8;
  font-size:14px;
  font-weight:800;
}
.game-badge{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:11px 13px 11px 10px;
  border:1px solid rgba(37,99,235,.1);
  border-radius:16px;
  background:rgba(255,255,255,.72);
  color:#1d4ed8;
  font-size:14px;
  font-weight:800;
  box-shadow:0 10px 24px rgba(15,23,42,.055);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.game-badge:hover{
  transform:translateY(-1px);
  background:rgba(255,255,255,.88);
  box-shadow:0 14px 30px rgba(15,23,42,.085);
}
.game-badge.podium{
  border-color:rgba(245,158,11,.18);
  background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,251,235,.78));
}
.game-badge.place-1{
  border-color:rgba(245,158,11,.3);
  background:
    radial-gradient(circle at 100% 0%,rgba(250,204,21,.22),rgba(250,204,21,0) 38%),
    linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,247,204,.94));
  box-shadow:0 16px 34px rgba(245,158,11,.16);
}
.game-badge.place-2{
  border-color:rgba(148,163,184,.28);
  background:
    radial-gradient(circle at 100% 0%,rgba(203,213,225,.24),rgba(203,213,225,0) 38%),
    linear-gradient(135deg,rgba(255,255,255,.98),rgba(241,245,249,.96));
}
.game-badge.place-3{
  border-color:rgba(180,83,9,.2);
  background:
    radial-gradient(circle at 100% 0%,rgba(251,146,60,.22),rgba(251,146,60,0) 38%),
    linear-gradient(135deg,rgba(255,255,255,.98),rgba(255,237,213,.94));
}
.game-rank{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.72);
  border-radius:11px;
  background:linear-gradient(135deg,#0f172a,#1d4ed8);
  color:#fff;
  font-family:Unbounded,Manrope,system-ui,sans-serif;
  font-size:13px;
  font-weight:800;
  box-shadow:0 8px 18px rgba(37,99,235,.18);
}
.game-rank.gold{
  background:linear-gradient(135deg,#fff7cc,#facc15 52%,#f59e0b);
  color:#78350f;
  box-shadow:0 9px 20px rgba(245,158,11,.26);
}
.game-rank.silver{
  background:linear-gradient(135deg,#ffffff,#cbd5e1 55%,#94a3b8);
  color:#334155;
  box-shadow:0 9px 20px rgba(100,116,139,.2);
}
.game-rank.bronze{
  background:linear-gradient(135deg,#ffedd5,#fb923c 55%,#b45309);
  color:#431407;
  box-shadow:0 9px 20px rgba(180,83,9,.22);
}
.game-rank.leader{
  background:linear-gradient(135deg,#0f172a,#1d4ed8);
  color:#fff;
}
.game-name{
  min-width:0;
  flex:1 1 auto;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.game-count{
  flex:0 0 auto;
  min-width:26px;
  padding:3px 7px;
  border-radius:999px;
  background:rgba(15,23,42,.065);
  color:#0f172a;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
form{display:grid;gap:14px}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.group{display:grid;gap:7px}
.group.full{grid-column:1/-1}
label.title{font-weight:800}
.tiktok-connect-card{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:74px;padding:12px;border:1px solid rgba(89,230,255,.22);border-radius:16px;background:linear-gradient(135deg,rgba(15,29,54,.96),rgba(35,14,61,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tiktok-connect-avatar{width:48px;height:48px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#25f4ee,#8158ff 58%,#fe2c55);color:#07111f;font-weight:1000;font-size:20px;box-shadow:0 8px 24px rgba(37,244,238,.14)}
.tiktok-connect-avatar img{width:100%;height:100%;object-fit:cover;display:block}.tiktok-connect-copy{min-width:0;display:grid;gap:3px}.tiktok-connect-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.tiktok-connect-copy small{color:#95a3c1;font-size:13px;line-height:1.35}
.tiktok-connect-card.is-linked{border-color:rgba(52,235,190,.42);box-shadow:0 0 22px rgba(52,235,190,.08),inset 0 1px 0 rgba(255,255,255,.06)}.tiktok-connect-card.is-linked .tiktok-connect-copy strong::after{content:' ✓';color:#34ebbe}
.tiktok-connect-btn{min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 13px;background:linear-gradient(135deg,#25f4ee,#56c7ff);color:#07111f;font:900 14px/1.1 inherit;cursor:pointer;white-space:nowrap;transition:.2s transform,.2s filter}.tiktok-connect-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.tiktok-connect-btn:disabled{opacity:.62;cursor:wait;transform:none}
@media(max-width:620px){.tiktok-connect-card{grid-template-columns:44px minmax(0,1fr)}.tiktok-connect-avatar{width:44px;height:44px}.tiktok-connect-btn{grid-column:1/-1;width:100%}}
.hint{color:var(--muted);font-size:14px;line-height:1.45}
input[type=text],input[type=url],textarea{
  width:100%;
  border:1px solid rgba(37,99,235,.16);
  border-radius:14px;
  padding:15px 16px;
  background:rgba(255,255,255,.88);
  color:var(--text);
  outline:none;
}
textarea{min-height:108px;resize:vertical}
input:focus,textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 4px rgba(56,189,248,.18);
}
.check{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.64);
  font-weight:700;
}
.check input{
  width:20px;
  height:20px;
  margin:1px 0 0;
  flex:0 0 auto;
  accent-color:var(--blue);
}
.form-status{
  min-height:20px;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
}
.form-status.ok{color:var(--green)}
.form-status.err{color:var(--red)}
.participants-card{
  position:relative;
  overflow:hidden;
  border-color:rgba(37,99,235,.14);
  background:
    radial-gradient(circle at 12% 0%,rgba(37,99,235,.16),rgba(37,99,235,0) 32%),
    radial-gradient(circle at 100% 10%,rgba(56,189,248,.18),rgba(56,189,248,0) 30%),
    rgba(255,255,255,.86);
}
.participants-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:1px;
  background:linear-gradient(90deg,rgba(37,99,235,0),rgba(37,99,235,.8),rgba(56,189,248,.85),rgba(37,99,235,0));
}
.participants-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.participants-head .section-title{margin:0}
.chance-panel{

  background:#111;
  box-shadow:-4px 4px 0 #25f4ee,4px -4px 0 #fe2c55,0 16px 30px rgba(15,23,42,.2);

  background:#eff6ff;
