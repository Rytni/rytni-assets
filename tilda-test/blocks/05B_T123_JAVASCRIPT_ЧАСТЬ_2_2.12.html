<script>
document.getElementById("giveawayForm").addEventListener("invalid",playFormErrorSound,true);

document.getElementById("giveawayForm").addEventListener("submit", async function(event){
  event.preventDefault();
  const button = document.getElementById("submitBtn");
  const status = document.getElementById("formStatus");
  if(!authSession){registrationIntent=true;saveApplicationDraft();status.className="form-status err";status.textContent="Сначала подтвердите email шестизначным кодом.";showRegistrationAuthDialog();return;}
  if(!applicationsOpen){
    playFormErrorSound();
    status.className = "form-status err";
    status.textContent = "Приём заявок сейчас закрыт.";
    return;
  }
  button.disabled = true;
  button.textContent = "Отправка...";
  status.className = "form-status";
  status.textContent = "Проверяем заявку и отправляем данные.";

  const data = {
    name: normalizeText(document.getElementById("name").value),
    steamid: normalizeSteamFriendCode(document.getElementById("steamid").value),
    region: normalizeRegion(document.getElementById("region").value),
    games: normalizeGames(document.getElementById("games").value),
    tiktok: normalizeTikTok(document.getElementById("tiktok").value),
    minskAvailability: document.getElementById("minskAvailability").value,
    ageGroup: document.getElementById("ageGroup").value,
    subscribed: document.getElementById("subscribed").checked ? "Да" : "Нет",
    likes: "Да",
    website: document.getElementById("website").value
  };

  const validationError = validateApplication(data);

  if(validationError){
    playFormErrorSound();
    status.className = "form-status err";
    status.textContent = validationError;
    button.disabled = false;
    button.textContent = "Участвовать в событии";
    return;
  }

  try{
    const result = await submitApplication(data);

    if(result.status === "banned"){
      status.className = "form-status err";
      status.textContent = BANNED_APPLICATION_MESSAGE;
      currentApplication = null;
      showBannedApplicationState(result?.ban_reason);
      return;
    }

    if(result.status === "already_registered"){
      try{
        const mine=await callSupabaseRpc("get_my_active_application",{},10000);
        if(mine?.success){
          currentApplication=mine;
          clearApplicationDraft();
          registrationIntent=false;
          applicationClaimMode=false;
          syncParticipationVisibility();
          renderApplicationProfile(mine);
          status.className="form-status ok";
          status.textContent="Заявка уже была создана с этого подтверждённого email. Открыта ваша существующая заявка.";
          return;
        }
      }catch(recoveryError){
        reportRpcError("application_duplicate_recovery",recoveryError);
      }
      showPopup("duplicatePopup");
      status.className = "form-status err";
      status.textContent = result.error || "К этому подтверждённому email уже привязана заявка текущего сезона. Откройте «Мою заявку» или войдите заново.";
      return;
    }

    if(result.status === "steam_taken"){
      status.className = "form-status err";
      status.textContent = "Этот Steam-код уже используется в заявке текущего сезона. Проверьте код или привяжите существующую заявку через «Мою заявку».";
      return;
    }

    if(result.status === "tiktok_taken"){
      status.className = "form-status err";
      status.textContent = "Этот TikTok уже указан в другой заявке текущего сезона. Проверьте ссылку или обратитесь к организатору.";
      return;
    }

    if(["duplicate","duplicate_in_season"].includes(result.status)){
      status.className = "form-status err";
      status.textContent = result.error || "В заявке совпали данные с существующей записью. Проверьте Steam-код и TikTok.";
      return;
    }

    if(result.status === "validation_error"){
      status.className = "form-status err";
      status.textContent = result.error || "Проверьте данные в форме.";
      return;
    }

    const serverValidationMessages={invalid_name:"Проверьте имя: от 2 до 25 символов.",invalid_steam:"Введите только Steam-код дружбы из 6–10 цифр.",invalid_region:"Выберите страну магазина Steam из подсказок.",invalid_games:"Укажите от 1 до 4 игр через запятую.",tiktok_required:"Укажите аккаунт TikTok — для новой заявки это обязательное поле.",invalid_tiktok:"Проверьте ник или ссылку на профиль TikTok.",invalid_minsk_availability:"Укажите, можете ли вы приехать в Минск.",invalid_age_group:"Выберите возрастную группу.",invalid_email:"Не удалось подтвердить email. Выйдите из аккаунта и войдите снова.",not_authenticated:"Сессия входа закончилась. Войдите по email ещё раз.",consent_required:"Подтвердите подписку и принятие правил."};
    if(serverValidationMessages[result.status]){
      status.className="form-status err";
      status.textContent=serverValidationMessages[result.status];
      return;
    }

    if(["season_closed","form_closed"].includes(result.status)){
      setFormAvailability(false,result.error || "Приём заявок сейчас закрыт.");
      status.className = "form-status err";
      status.textContent = result.error || "Приём заявок сейчас закрыт.";
      return;
    }

    if(result.status === "rate_limited" || result.status === "rejected"){
      status.className = "form-status err";
      status.textContent = result.error || "Слишком много попыток. Повторите позже.";
      return;
    }

    if(!result.success || !["success","created"].includes(result.status)){
      throw new Error(result.error || "SUBMISSION_FAILED");
    }

    const currentCount = Number(result.participant_count || result.count || document.getElementById("participantCount").textContent.replace(/\D/g,"")) || 0;
    text("#participantCount", String(currentCount));
    status.className = "form-status ok";
    status.textContent = result.message || "Заявка успешно записана.";
    document.getElementById("successTitle").textContent = "Заявка отправлена";
    document.querySelector("#successPopup .popup > p").textContent = "Она передана на обработку. Сохраните карточку участника и поделитесь ей в TikTok.";
    playUiSound("formWin");
    showPopup("successPopup");
    renderSuccessCard(data.name,currentCount,data.games);
    currentApplication=result;recordFunnelEvent("application_created");syncParticipationVisibility();document.querySelectorAll('[data-tool-mode="card"]').forEach(item=>item.textContent="Моя заявка");clearApplicationDraft();registrationIntent=false;
    this.reset();
    window.setTimeout(loadData, 600);
  }catch(error){
    reportRpcError("application_submit",error);
    const userMessage=rpcUserMessage(error,"отправить заявку");
    status.className = "form-status err";
    status.textContent = userMessage;
    if(error?.kind === "auth"){
      saveApplicationDraft();
      saveAuthSession(null);
      registrationIntent=true;
      showRegistrationAuthDialog();
      showAuthStatus("Сессия подтверждения закончилась. Запросите новый код — заполненные данные сохранены.",true);
      return;
    }
    const popupCopy=document.querySelector("#errorPopup .popup > p");
    if(popupCopy)popupCopy.textContent=userMessage;
    showPopup("errorPopup");
  }finally{
    if(status.classList.contains("err")) playFormErrorSound();
    button.disabled = !applicationsOpen;
    button.textContent = "Участвовать в событии";
  }
});

function stopProgressionTimer(){
  window.clearInterval(progressionTimer);
  progressionTimer = 0;
}
function progressionRuntimeIsActive(){
  const popup = document.getElementById("applicationPopup");
  return applicationToolMode === "boost"
    && !document.hidden
    && popup
    && popup.getAttribute("aria-hidden") !== "true"
    && popup.style.display !== "none";
}
function resumeProgressionTimer(){
  stopProgressionTimer();
  if(!progressionRuntimeIsActive()) return;
  updateBoostAvailability();
  progressionTimer = window.setInterval(()=>{
    if(!progressionRuntimeIsActive()){
      stopProgressionTimer();
      return;
    }
    updateBoostAvailability();
  },30000);
}

let luckyCouponAudio = null;
let currentLuckyCouponKey = "";
function playLuckyCouponSound(url){
  if(soundMuted) return;
  const source = /^https:\/\//i.test(String(url || ""))
    ? String(url)
    : "https://rytni.github.io/rytni-assets/sounds/new-level.mp3";
  try{
    if(luckyCouponAudio) luckyCouponAudio.pause();
    luckyCouponAudio = new Audio(source);
    luckyCouponAudio.preload = "none";
    luckyCouponAudio.volume = .72;
    luckyCouponAudio.play().catch(() => playUiSound("success"));
  }catch(error){
    playUiSound("success");
  }
}

  document.getElementById("luckyCouponLead").textContent = `В сундуке оказался настоящий ключ на игру${Number(pointsAwarded) > 0 ? ` и +${Number(pointsAwarded)} очков` : ""}. Он уже закреплён за вами.`;

  image.src = /^https:\/\//i.test(String(coupon.asset_url || ""))
    ? String(coupon.asset_url)
    : "https://rytni.github.io/rytni-assets/coupon_optimized.webp";
  const copyButton = document.getElementById("copyLuckyCouponKey");
  copyButton.classList.remove("is-copied");

document.getElementById("copyLuckyCouponKey")?.addEventListener("click",async event => {
  if(!currentLuckyCouponKey) return;
  const button = event.currentTarget;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(currentLuckyCouponKey);
    }else{
      const helper = document.createElement("textarea");
      helper.value = currentLuckyCouponKey;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      helper.remove();
    }
    button.classList.add("is-copied");
    button.querySelector("span").textContent = "Ключ скопирован";
  }catch(error){
    button.querySelector("span").textContent = "Выделите ключ вручную";
  }
});

    row.append(key,copy);card.append(top,row);list.appendChild(card);

function formatRemaining(target){
  const milliseconds = new Date(target).getTime() - Date.now();
  if(!Number.isFinite(milliseconds) || milliseconds <= 0) return "";
  const totalMinutes = Math.ceil(milliseconds / 60000);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return [hours ? `${hours} ч` : "", minutes ? `${minutes} мин` : ""].filter(Boolean).join(" ");
}

function rankRarity(level){
  const value = Number(level) || 1;
  if(value >= 44) return {name:"Мифический", className:"rarity-mythic", accent:"#e11d48"};
  if(value >= 30) return {name:"Легендарный", className:"rarity-legendary", accent:"#f97316"};
  if(value >= 15) return {name:"Эпический", className:"rarity-epic", accent:"#a855f7"};
  if(value >= 7) return {name:"Редкий", className:"rarity-rare", accent:"#3b82f6"};
  if(value >= 3) return {name:"Необычный", className:"rarity-uncommon", accent:"#22c55e"};
  return {name:"Обычный", className:"rarity-common", accent:"#64748b"};
}

function chestEmblemSvg(tier="common"){
  const normalizedTier = tier==="uncommon" ? "rare" : (["common","rare","epic","legendary"].includes(tier) ? tier : "common");
  const tierInfo = CHEST_TIERS[normalizedTier] || CHEST_TIERS.common;
  if(tierInfo.asset){
    const fallbackAsset=tierInfo.assetFallback||"";
    return `<img class="chest-emblem-art chest-${normalizedTier}" src="${tierInfo.asset}" data-chest-tier="${normalizedTier}" data-chest-fallback-src="${fallbackAsset}" alt="" aria-hidden="true" loading="eager" decoding="async" referrerpolicy="no-referrer">`;
  }
  return chestFallbackSvg(normalizedTier);
}

document.addEventListener("error",event=>{
  const image=event.target;
  if(!image||image.tagName!=="IMG"||!image.classList.contains("chest-emblem-art"))return;
  const fallbackSrc=image.dataset.chestFallbackSrc||"";
  if(fallbackSrc&&image.dataset.chestFallbackTried!=="true"&&image.src!==fallbackSrc){
    image.dataset.chestFallbackTried="true";
    image.src=fallbackSrc;
    return;
  }
  const tier=image.dataset.chestTier||"common";
  const template=document.createElement("template");
  template.innerHTML=chestFallbackSvg(tier).trim();
  const fallback=template.content.firstElementChild;
  if(fallback)image.replaceWith(fallback);
},true);

function renderStreakPath(streakValue,nextBonusAtValue,bonusPointsValue){
  const streak = Math.max(0,Number(streakValue) || 0);
  const nextBonusAt = Math.max(3,Number(nextBonusAtValue) || (streak < 3 ? 3 : streak < 10 ? 10 : (Math.floor(streak / 10) + 1) * 10));
  const bonusPoints = Math.max(0,Number(bonusPointsValue) || (nextBonusAt === 3 ? 200 : 500));
  const previousMilestone = nextBonusAt === 3 ? 0 : nextBonusAt === 10 ? 3 : nextBonusAt - 10;
  const cellsCount = Math.max(1,nextBonusAt - previousMilestone);
  const progress = Math.max(0,Math.min(streak - previousMilestone,cellsCount));
  const playerCell = progress > 0 ? progress - 1 : 0;
  const track = document.getElementById("streakTrack");
  track.textContent = "";
  track.style.setProperty("--streak-cells",String(cellsCount));
  for(let index=0;index<cellsCount;index+=1){
    const cell = document.createElement("span");
    cell.className = "streak-cell";
    if(index < progress) cell.classList.add("is-complete");
    if(index === cellsCount - 1) cell.classList.add("is-bonus");
    if(index === playerCell){
      const player = document.createElement("span");
      player.className = "streak-player";
      const avatar = document.getElementById("profileAvatar");
      if(avatar&&avatar.src){const image=document.createElement("img");image.alt="";setSafeAvatar(image,avatar.src,"player");player.appendChild(image);}else appendLucideIcon(player,"gamepad-2");
      cell.appendChild(player);
    }
    const label = document.createElement("span");
    label.className = "streak-cell-label";
    label.textContent = index === cellsCount - 1 ? `+${bonusPoints}` : String(previousMilestone + index + 1);
    cell.appendChild(label);
    track.appendChild(cell);
  }
  document.getElementById("streakBonusLabel").textContent = `Верный ответ ${nextBonusAt}: бонус +${bonusPoints}`;
}

function progressionRankAt(levelValue){
  const level = Math.max(1,Number(levelValue) || 1);
  let current = PROGRESSION_RANKS[0];
  PROGRESSION_RANKS.forEach(rank => { if(level >= rank.level) current = rank; });
  return current;
}

function renderRankJourney(levelValue){
  const level = Math.max(1,Number(levelValue) || 1);
  const track = document.getElementById("rankJourneyTrack");
  const viewport = document.getElementById("rankJourneyScroll");
  track.textContent = "";
  let currentNode = null;
  PROGRESSION_RANKS.forEach((rank,index) => {
    const nextRank = PROGRESSION_RANKS[index + 1];
    const isCurrent = level >= rank.level && (!nextRank || level < nextRank.level);
    const node = document.createElement("div");
    node.className = "journey-node";
    if(level >= rank.level) node.classList.add("is-complete");
    if(isCurrent){
      node.classList.add("is-current");
      currentNode = node;
    }
    node.title = `${rank.name} — с ${rank.level} уровня`;
    const icon=document.createElement("span");icon.className="journey-node-icon";icon.innerHTML=rankEmblemSvg(rank,rankRarity(rank.level),"small");
    const levelLabel=document.createElement("span");levelLabel.className="journey-node-level";levelLabel.textContent=`ур. ${rank.level}`;
    const name=document.createElement("span");name.className="journey-node-name";name.textContent=rank.name;
    node.append(icon,levelLabel,name);
    track.appendChild(node);
  });
  const currentRank = progressionRankAt(level);
  const nextRank = PROGRESSION_RANKS.find(rank => rank.level > level);
  document.getElementById("rankJourneyNote").textContent = nextRank ? `Далее: ${nextRank.name}` : "Все ранги открыты";
  refreshRankIcons();
  window.requestAnimationFrame(() => {
    if(!currentNode) return;
    viewport.scrollLeft = Math.max(0,currentNode.offsetLeft - (viewport.clientWidth - currentNode.offsetWidth) / 2);
  });
}

function renderDailyChestChain(streak,canOpen,cycles=0){
  const chain = document.getElementById("dailyStreakChain");
  if(!chain) return;
  const progress = Math.max(0,Math.min(Number(streak) || 0,DAILY_CHAIN_LENGTH));
  const current = canOpen ? Math.min(progress + 1,DAILY_CHAIN_LENGTH) : progress;
  chain.textContent = "";
  for(let day=1;day<=DAILY_CHAIN_LENGTH;day+=1){
    const cell = document.createElement("span");
    cell.className = "daily-streak-day";
    if(day <= progress) cell.classList.add("is-done");
    if(day === current) cell.classList.add("is-current");
    if(day === 3) cell.classList.add("is-mid-bonus");
    if(day === DAILY_CHAIN_LENGTH) cell.classList.add("is-bonus");
    const icon = day <= progress ? "check" : day === DAILY_CHAIN_LENGTH ? "crown" : day === 3 ? "sparkles" : "gift";
    cell.title = day === DAILY_CHAIN_LENGTH
      ? "7-й сундук: гарантированно эпический. Затем начнётся новая цепочка"
      : day === 3
        ? "3-й сундук: гарантированно редкий"
        : `Сундук ${day}`;
    cell.innerHTML = `<i data-lucide="${icon}"></i><span>${day}</span>`;
    chain.appendChild(cell);
  }
  refreshRankIcons();
}

    item.title = `${reward.name}: ${reward.points.toLocaleString("ru-RU")} очков`;

  const canEdit = applicationToolMode === "card" && remaining>0 && Boolean(profile && profile.can_edit_application);
  button.hidden = applicationToolMode !== "card";
  note.hidden = applicationToolMode !== "card";
  button.disabled = !canEdit;
  button.innerHTML = canEdit
    ? '<i data-lucide="pencil"></i>Редактировать заявку'

function showLevelUpReward(previousProfile,nextProfile,result){
  const previousRank = progressionRankAt(previousProfile && previousProfile.level);
  const nextRank = progressionRankAt(nextProfile.level);
  const newAchievements = PROGRESSION_ACHIEVEMENTS.filter(item => item.test(nextProfile) && !item.test(previousProfile || {}));
  const rankUnlocked = previousRank.name !== nextRank.name;
  const rewardPopup = document.querySelector("#levelUpPopup .levelup-popup");
  rewardPopup.dataset.rewardType = rankUnlocked ? "rank" : "level";
  delete rewardPopup.dataset.chestTier;
  document.querySelector("#levelUpPopup .levelup-kicker").innerHTML = '<i data-lucide="sparkles"></i>Прокачка успешна';
  document.getElementById("levelUpRankIcon").innerHTML = rankEmblemSvg(nextRank,rankRarity(nextProfile.level));
  document.getElementById("levelUpTitle").textContent = rankUnlocked ? "Новый ранг открыт!" : `Уровень ${nextProfile.level}!`;
  document.getElementById("levelUpRankName").textContent = nextRank.name;
  document.getElementById("levelUpLevel").textContent = `Уровень ${nextProfile.level}`;
  document.getElementById("levelUpPoints").textContent = `+${Number(result.points_awarded) || 150} очков`;
  const unlocks = [];
  if(rankUnlocked) unlocks.push(`Открыт ранг «${nextRank.name}»`);
  if(newAchievements.length) unlocks.push(`Новые достижения: ${newAchievements.map(item => item.name).join(", ")}`);
  if(Number(result.bonus_points) > 0) unlocks.push(`Бонус серии: +${result.bonus_points} очков`);
  document.getElementById("levelUpUnlocks").textContent = unlocks.join(" · ");
  refreshRankIcons();
  showPopup("levelUpPopup");
}

async function handleStartBoostClick(button){
  if(!currentApplication) return;
  if(button.dataset.loading === "true") return;
  playUiSound("boostClick");
  const quizZone = document.getElementById("quizZone");
  const status = document.getElementById("quizStatus");
  button.dataset.loading = "true";
  button.disabled = true;
  button.textContent = "Загружаем вопрос...";
  setQuestionRetryVisible(false);
  try{
    const startRpc = currentApplication.test_mode ? "start_giveaway_test_boost_v25" : "start_giveaway_boost_v2";
    const result = await callSupabaseRpc(startRpc, {
      p_participant_id:currentApplication.id,
      p_client_token:getClientToken(),
      p_honeypot:""
    },7000);
    if(result.status === "cooldown"){
      currentApplication.next_boost_at = result.next_boost_at;
      currentApplication.can_boost = false;
      updateBoostAvailability();
      return;
    }
    if(result.status === "wrong_cooldown"){
      currentApplication.next_boost_at = result.retry_after;
      currentApplication.can_boost = false;
      updateBoostAvailability();
      showQuizLockout("3 неверных ответа. Прокачка заблокирована на 15 минут.");
      quizZone.hidden = false;
      return;
    }
    if(["season_closed","form_closed"].includes(result.status)){
      progressionStatus(status,"Сезон завершён, прокачка заявок остановлена.",true);
      quizZone.hidden = false;
      return;
    }
    if(result.status === "progression_blocked"){
      progressionStatus(status,result.reason || "Прокачка временно заблокирована организатором.",true);
      quizZone.hidden = false;
      return;
    }
    if(!result.success || result.status !== "question"){
      progressionStatus(status,result.status === "rate_limited" ? "Слишком много попыток с этого устройства." : "Не удалось получить вопрос.",true);
      quizZone.hidden = false;
      return;
    }
    activeChallengeId = result.challenge_id;
    lastReportableChallengeId = result.challenge_id;
    document.getElementById("quizQuestion").textContent = result.question;
    document.getElementById("quizAnswer").value = "";
    status.textContent = "";
    status.className = "form-status";
    quizZone.hidden = false;
    document.getElementById("questionReportBtn").hidden = false;
    document.getElementById("questionReportForm").hidden = true;
    setQuestionRetryVisible(false);
    document.getElementById("quizAnswer").focus();
  }catch(error){
    const message = String(error && error.message ? error.message : "");
    const needsSqlPatch = message.includes("digest(") || message.includes("function digest");
    progressionStatus(status,needsSqlPatch ? "Нужно обновить SQL прокачки в Supabase и повторить." : "Не удалось получить вопрос. Повторите позже.",true);
    quizZone.hidden = false;
  }finally{
    delete button.dataset.loading;
    button.disabled = false;
    if(button.id === "requestNewQuestionBtn") button.innerHTML = '<i data-lucide="refresh-cw"></i>Запросить новый вопрос';
    updateBoostAvailability();
  }
}

  }
});

function relativeActivityTime(value){
  const minutes = Math.max(0,Math.floor((Date.now() - new Date(value).getTime()) / 60000));
  if(minutes < 1) return "только что";
  if(minutes < 60) return `${minutes} мин назад`;
  const hours = Math.floor(minutes / 60);
  if(hours < 24) return `${hours} ч назад`;
  return new Date(value).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}

async function loadBoostFeed(providedItems=null){
  const list = document.getElementById("activityFeedList");
  if(!list) return;
  try{
    const result = providedItems ? {items:providedItems} : await cachedRpc("boost-feed","get_giveaway_boost_feed",{},6500,120000,false,"anonymous");
    const items = result && Array.isArray(result.items) ? result.items : [];
    list.textContent = "";
    if(!items.length){
      const empty = document.createElement("div");
      empty.className = "hint";
      empty.textContent = "Пока никто не повысил уровень.";
      list.appendChild(empty);
      return;
    }
    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "activity-item";
      const level = document.createElement("div");
      level.className = "activity-level";
      level.textContent = String(item.level || 1);
      const details = document.createElement("div");
      const name = document.createElement("div");
      name.className = "activity-name";
      name.textContent = item.name || "Участник";
      const rank = document.createElement("div");
      rank.className = "activity-rank";
      rank.textContent = `${item.rank_name} · ${relativeActivityTime(item.boosted_at)}`;
      details.append(name,rank);
      row.append(level,details);
      list.appendChild(row);
    });
  }catch(error){}
}

/* 2.15.18: бонус-коды — точные статусы, защищённая активация и обновление карточки. */
function bonusCodeErrorMessage(result){
  const status=String(result?.status||"");
  const date=value=>{try{return new Date(value).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});}catch(error){return "указанного времени";}};
  const messages={
    invalid_format:"Проверьте код: нужно от 6 до 40 букв или цифр.",
    not_found:"Такого бонус-кода нет. Проверьте символы и попробуйте ещё раз.",
    disabled:"Этот бонус-код отключён организатором.",
    expired:"Срок действия этого бонус-кода закончился.",
    global_limit:"Все доступные активации этого бонус-кода уже использованы.",
    participant_limit:"Вы уже использовали этот бонус-код максимальное количество раз.",
    coupon_unavailable:"Ключи для этой награды временно закончились. Код не потрачен — сообщите Rytni.",
    daily_chest_already_ready:"Ежедневный сундук уже доступен. Сначала откройте его, затем код можно активировать.",
    question_already_ready:"Игровой вопрос уже доступен. Сначала ответьте на него, затем код можно активировать.",
    sponsor_chest_already_ready:"Спонсорский сундук уже доступен. Сначала откройте его, затем код можно активировать.",
    too_many_attempts:"Слишком много неверных попыток. Новую можно сделать через 15 минут.",
    emergency_stopped:"Выдача бонус-кодов временно приостановлена организатором. Попробуйте немного позже.",
    progression_blocked:"Прокачка этой заявки временно ограничена организатором.",
    participant_not_found:"Активная заявка не найдена. Откройте «Моя заявка» и войдите по email.",
    forbidden:"Сессия входа устарела. Выйдите из аккаунта и войдите по email ещё раз."
  };
  if(status==="not_started")return `Код ещё не активен. Начало: ${date(result.starts_at)}.`;
  return messages[status]||"Не удалось проверить код. Соединение не потеряно — попробуйте ещё раз немного позже.";
}
function resetBonusCodePopup(){
  const form=document.getElementById("bonusCodeForm"),result=document.getElementById("bonusCodeResult"),status=document.getElementById("bonusCodeStatus"),button=document.getElementById("bonusCodeSubmit");
  if(form)form.hidden=false;if(result)result.hidden=true;if(status){status.textContent="";status.className="bonus-code-status";}if(button){button.disabled=false;button.querySelector("span").textContent="Получить награду";}document.querySelector(".bonus-code-input-row")?.classList.remove("has-value");
}
function recordBonusCodeEvent(eventName,code){
  const value=String(code||"").trim();if(!value)return;
  callSupabaseRpc("record_bonus_code_event_v21521",{p_event:eventName,p_code:value,p_source:window.rytniBonusCodeSource||"site",p_release:window.RYTNI_RELEASE||"unknown",p_session:getClientToken()},7000,false,"anonymous").catch(()=>{});
}
function openBonusCodePopup(prefilledCode=""){
  resetBonusCodePopup();const input=document.getElementById("bonusCodeInput");if(input){input.value=String(prefilledCode||"").toUpperCase().replace(/[^A-Z0-9\- ]/g,"").slice(0,54);input.dispatchEvent(new Event("input",{bubbles:true}));}showPopup("bonusCodePopup");recordBonusCodeEvent("modal_opened",input?.value);window.setTimeout(()=>input?.focus(),50);
}
document.getElementById("profileBonusCodeBtn")?.addEventListener("click",()=>{
  if(!currentApplication?.id){if(typeof showToast==="function")showToast("Сначала войдите по email и откройте свою заявку.","warning");return;}
  openBonusCodePopup();
});
document.getElementById("bonusCodeInput")?.addEventListener("input",event=>{
  const input=event.currentTarget;input.value=input.value.toUpperCase().replace(/[^A-Z0-9\- ]/g,"");input.closest(".bonus-code-input-row")?.classList.toggle("has-value",Boolean(input.value.trim()));
});
document.getElementById("bonusCodePasteBtn")?.addEventListener("click",async()=>{
  const input=document.getElementById("bonusCodeInput"),status=document.getElementById("bonusCodeStatus");
  if(!input)return;
  try{
    const value=await navigator.clipboard.readText();
    input.value=String(value||"").toUpperCase().replace(/[^A-Z0-9\- ]/g,"").slice(0,54);
    input.dispatchEvent(new Event("input",{bubbles:true}));input.focus();
    if(status){status.textContent=input.value?"Код вставлен — можно получать награду.":"В буфере обмена нет бонус-кода.";status.className=`bonus-code-status ${input.value?"is-waiting":"is-error"}`;}
  }catch(error){input.focus();if(status){status.textContent="Браузер не разрешил вставку. Нажмите и удерживайте поле, затем выберите «Вставить».";status.className="bonus-code-status is-error";}}
});
document.getElementById("bonusCodeForm")?.addEventListener("submit",async event=>{
  event.preventDefault();
  const input=document.getElementById("bonusCodeInput"),status=document.getElementById("bonusCodeStatus"),button=document.getElementById("bonusCodeSubmit"),form=event.currentTarget,resultBox=document.getElementById("bonusCodeResult");
  const value=String(input?.value||"").trim();
  if(value.replace(/[^A-Z0-9]/gi,"").length<6){status.textContent="Введите полный бонус-код.";status.className="bonus-code-status is-error";input?.focus();return;}
  if(!currentApplication?.id){status.textContent="Активная заявка не найдена. Войдите по email ещё раз.";status.className="bonus-code-status is-error";return;}
  button.disabled=true;button.querySelector("span").textContent="Проверяем…";status.textContent="Защищённо проверяем код и резервируем награду…";status.className="bonus-code-status is-waiting";
  try{
    const response=await callSupabaseRpc("redeem_giveaway_bonus_code_v21521",{p_participant_id:currentApplication.id,p_code:value,p_source:window.rytniBonusCodeSource||"site",p_release:window.RYTNI_RELEASE||"unknown",p_session:getClientToken()},10000,true,"authenticated");
    if(!response?.success){status.textContent=bonusCodeErrorMessage(response);status.className="bonus-code-status is-error";return;}
    form.hidden=true;resultBox.hidden=false;document.getElementById("bonusCodeReward").textContent=String(response.reward_summary||"Награда получена");
    playUiSound("success");launchLuckyCouponCelebration();
    try{const refreshed=await callSupabaseRpc("get_my_active_application",{},6000,true,"authenticated",true);if(refreshed?.success){currentApplication=refreshed;renderApplicationProfile(refreshed);}}catch(error){}
    if(response.reward_type==="coupon"&&response.key){
      window.setTimeout(()=>{closePopupLayer(document.getElementById("bonusCodePopup"));showLuckyCoupon({game:response.game,key:response.key},0);},650);
    }
  }catch(error){status.textContent=rpcUserMessage(error,"активировать бонус-код");status.className="bonus-code-status is-error";}
  finally{button.disabled=false;button.querySelector("span").textContent="Получить награду";}
});

(function initBonusCodeDeepLink(){
  try{
    const url=new URL(location.href),raw=String(url.searchParams.get("bonus")||"").toUpperCase().replace(/[^A-Z0-9\- ]/g,"").slice(0,54);
    const source=String(url.searchParams.get("source")||"direct").toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,32)||"direct";
    if(!raw)return;
    window.rytniPendingBonusCode=raw;window.rytniBonusCodeSource=source;recordBonusCodeEvent("deep_link_opened",raw);
    url.searchParams.delete("bonus");url.searchParams.delete("source");history.replaceState(history.state,"",url.toString());
    window.setTimeout(()=>{if(typeof openApplicationTool==="function")openApplicationTool("card");},700);
  }catch(error){}
})();
