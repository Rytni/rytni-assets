<template id="communityRankingTemplate">
<div class="popup-overlay" id="communityRankingPopup" role="dialog" aria-modal="true" aria-labelledby="communityRankingTitle" aria-describedby="communityRankingLead" aria-hidden="true" style="display:none">
  <section class="popup community-ranking" id="community-rating">
    <div class="cr-topbar"><span class="cr-eyebrow">Сообщество RYTNI · TikTok</span><button type="button" class="cr-close" data-close-popup tabindex="0" aria-label="Закрыть рейтинг">×</button></div>
    <div class="cr-body">
      <header class="cr-heading"><div class="cr-header-copy"><h2 id="communityRankingTitle">Рейтинг участников</h2><p id="communityRankingLead">Обсуждаете, поддерживаете, возвращаетесь.<br>Ваша общая активность в сообществе RYTNI.</p><div class="cr-context"><span>Последние 30 дней</span><span>Два канала вместе</span></div></div><img class="cr-seal" src="https://rytni.github.io/rytni-assets/Winer.webp" alt="" width="96" height="96"></header>
      <div class="cr-categories" role="tablist" aria-label="Категория рейтинга">
        <button type="button" class="cr-category" role="tab" id="crTabComments" aria-controls="crRankingPanel" aria-selected="false" data-kind="comments"><img src="https://rytni.github.io/rytni-assets/web/2/media-comments.webp" alt="" width="52" height="52"><span><b>Обсуждают</b><small>Комментарии</small></span></button>
        <button type="button" class="cr-category" role="tab" id="crTabProgression" aria-controls="crRankingPanel" aria-selected="false" data-kind="progression"><img src="https://rytni.github.io/rytni-assets/ui-v213/boost-core-mobile.webp" alt="" width="52" height="52"><span><b>Прокачка активных</b><small>Без раскрытия очков</small></span></button>
        <button type="button" class="cr-category" role="tab" id="crTabActivity" aria-controls="crRankingPanel" aria-selected="true" data-kind="activity"><img src="https://rytni.github.io/rytni-assets/web/community-v2/always-nearby-v1.webp" alt="" width="52" height="52"><span><b>Всегда рядом</b><small>Общая активность</small></span></button>
      </div>
      <div class="cr-winner-legend"><img src="https://rytni.github.io/rytni-assets/web/community-v2/winner-emblem-v1.webp" alt="" width="28" height="28"><span>Фирменный значок — участник уже выбран победителем RYTNI Подари.</span></div>
      <details class="cr-selection-note" data-selection-note hidden><summary>Только активные участники <span>Как попасть в топ</span></summary><p>Топ-50 одновременно по комментариям и общей активности, минимум 12 комментариев под 5 роликами, 8 дней и 3 разные недели с комментариями за 30 дней. Порядок определяется очками заявки; их количество закрыто.</p></details>
      <p class="cr-warning" data-warning hidden></p>
      <div id="crRankingPanel" role="tabpanel" aria-labelledby="crTabActivity" aria-live="polite"><div class="cr-empty" data-empty role="status"><strong>Загружаем рейтинг</strong><p>Проверяем опубликованную активность сообщества.</p></div><div class="cr-podium" data-podium hidden></div><ol class="cr-list" data-list start="4"></ol><button type="button" class="cr-more" data-more hidden>Показать больше</button></div>
      <form class="cr-find" data-find><label for="communityFind">Найти себя</label><input id="communityFind" maxlength="25" placeholder="@username" autocomplete="off" spellcheck="false"><button type="submit" class="cr-more">Найти</button><output data-found></output></form>
      <footer class="cr-meta"><span class="cr-live">По собранным данным TikTok</span><span data-period></span><time data-updated></time></footer>
      <details class="cr-method"><summary tabindex="0">Как считается рейтинг</summary><p>Статистика собирается сразу с двух каналов: <a href="https://www.tiktok.com/@rytni.tv" target="_blank" rel="noopener noreferrer">Gaming — @rytni.tv</a> и <a href="https://www.tiktok.com/@rytni.blic" target="_blank" rel="noopener noreferrer">Tech — @rytni.blic</a>. Действия на обоих каналах объединяются в один рейтинг за последние 30 дней.</p><p>В рейтинг входят участники текущего сезона с точным совпадением указанного @username. Неоднозначные совпадения проходят отдельную проверку. Аккаунты организатора, заблокированные и тестовые заявки в рейтинге не участвуют.</p><p>«Обсуждают» — число собранных комментариев. «Всегда рядом» — индекс: 3 за каждый разный ролик с комментарием + 1 за ролик с обнаруженным лайком + 2 за каждый активный день UTC. Повторные комментарии к одному ролику не увеличивают его вклад в индекс. Отдельного рейтинга лайков нет.</p><p>«Прокачка активных» — порядок по очкам заявки только среди тех, кто одновременно входит в топ-50 двух социальных разделов и за 30 дней оставил минимум 12 комментариев под 5 разными роликами, комментировал в 8 разных днях и 3 разных календарных неделях UTC. При равных очках выше участник, раньше достигший этой суммы. Очки и время их начисления публично не передаются. Если условия выполнили только несколько человек, список остаётся коротким; неактивные заявки не добавляются для заполнения мест.</p><p>Золотое выделение и фирменный значок означают, что участник уже записан победителем организатором. Значок не подтверждает отправку или получение подарка и не даёт бонуса к месту.</p><p>История частичная. Для лайков учитывается время первого обнаружения, а не точное время нажатия. TikTok не раскрывает просмотры конкретных людей; этот рейтинг не доказывает факт просмотра. Репосты не учитываются. Социальный индекс не меняет баланс заявки. Этот публичный отбор не меняет правила гарантированных мест и не выбирает победителей автоматически.</p></details>
    </div>
  </section>
</div>
</template>
<script>
(() => {
  'use strict';
  const mount=document.getElementById('communityRankingMount');
  if(!mount)return;
  mount.append(document.getElementById('communityRankingTemplate').content.cloneNode(true));
  const overlay=mount.querySelector('#communityRankingPopup'),root=overlay.querySelector('#community-rating'),$=s=>root.querySelector(s);
  const channel=mount.dataset.channel==='main'?'main':'test';
  // Public presentation is deliberately fixed: both channels combined, 30 days.
  let snapshot=null,kind='activity',limit=10,busy=false,timer;
  const assetBase='https://rytni.github.io/rytni-assets/';
  const number=v=>Number(v).toLocaleString('ru-RU');
  const date=v=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Minsk'}).format(new Date(v));
  const updated=v=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Minsk'}).format(new Date(v));
  const field=()=>({comments:'comments',activity:'score'})[kind];
  const unit=()=>({comments:'комментариев',progression:'место в прокачке',activity:'индекс активности'})[kind];
  const period=()=>snapshot?.periods.find(p=>p.days===30);
  const rows=()=>period()?.scopes?.all?.[kind]||[];
  const isOpen=()=>overlay.getAttribute('aria-hidden')==='false';
  function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  function person(row){const wrap=el('div','cr-identity'),a=el('a','cr-person','@'+row.handle);a.href='https://www.tiktok.com/@'+row.handle;a.target='_blank';a.rel='noopener noreferrer';wrap.append(a);if(row.winner_selected){const badge=el('span','cr-winner-badge');badge.setAttribute('role','img');badge.setAttribute('aria-label','Выбран победителем RYTNI Подари');badge.title='Выбран победителем RYTNI Подари';const image=el('img');image.src=assetBase+'web/community-v2/winner-emblem-v1.webp';image.alt='';image.width=34;image.height=34;badge.append(image);wrap.append(badge);}return wrap;}
  function render(){
    root.querySelectorAll('[data-kind]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.kind===kind));b.tabIndex=b.dataset.kind===kind?0:-1;if(b.dataset.kind===kind)$('#crRankingPanel').setAttribute('aria-labelledby',b.id);});
    const board=rows();$('[data-podium]').replaceChildren();$('[data-list]').replaceChildren();
    $('[data-selection-note]').hidden=kind!=='progression';
    $('[data-empty]').hidden=board.length>0;$('[data-podium]').hidden=!board.length;
    $('[data-more]').hidden=board.length<=limit;$('[data-found]').textContent='';
    if(!board.length){$('[data-empty] strong').textContent=snapshot?'Пока без лидеров':'Рейтинг готовится';$('[data-empty] p').textContent=snapshot?(kind==='progression'?'Пока никто не выполнил все условия регулярной активности. Очки сами по себе не дают места в этом разделе.':'За последние 30 дней совпадений с участниками ещё нет. После следующего сбора рейтинг обновится.'):'Первая проверенная публикация появится здесь автоматически.';}
    board.slice(0,limit).forEach((row,index)=>{
      if(index<3){const card=el('article',row.winner_selected?'cr-winner':'');card.dataset.handle=row.handle;const badge=el('img','cr-place');badge.src=assetBase+(index+1)+'.webp';badge.alt=(index+1)+'-е место';badge.width=76;badge.height=66;card.append(badge,person(row),el('strong','cr-value'+(kind==='progression'?' cr-position':''),kind==='progression'?'#'+(index+1):number(row[field()])),el('span','cr-unit',unit()),el('p','cr-details',kind==='progression'?'Регулярная активность подтверждена':number(row.active_days)+' активных дн. · '+number(row.commented_posts+row.liked_posts)+' действий с роликами'));$('[data-podium]').append(card);}
      else{const item=el('li',row.winner_selected?'cr-winner':'');item.dataset.handle=row.handle;const value=el('strong',kind==='progression'?'cr-progression-label':'',kind==='progression'?'В топе':number(row[field()]));if(kind!=='progression')value.append(el('small','',kind==='activity'?'индекс':'комм.'));item.append(el('span','cr-rank',String(index+1).padStart(2,'0')),person(row),value);$('[data-list]').append(item);}
    });
    if(snapshot){$('[data-updated]').dateTime=snapshot.generated_at;$('[data-updated]').textContent='Обновлено '+updated(snapshot.generated_at)+' · Минск';$('[data-period]').textContent=date(period().start)+' — '+date(period().end);const old=Date.now()-Date.parse(snapshot.generated_at)>86400000;$('[data-warning]').hidden=!old;$('[data-warning]').textContent='Показан последний опубликованный рейтинг. Ожидаем обновления данных.';}
    else{$('[data-updated]').textContent='';$('[data-period]').textContent='';}
  }
  function open(){showPopup('communityRankingPopup');$('.cr-body').scrollTop=0;load();}
  document.addEventListener('click',event=>{const button=event.target.closest?.('[data-open-community-ranking]');if(button){event.preventDefault();open();}});
  overlay.addEventListener('pointerdown',event=>{if(event.target===overlay)closePopupLayer(overlay);});
  // The shared popup stack owns Escape/restore. Keep Tab within visible controls;
  // closed <details> descendants may still report layout boxes in Chromium.
  overlay.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const items=[...overlay.querySelectorAll('button,a[href],input,summary,[tabindex]')].filter(e=>{
      const closed=e.closest('details:not([open])');
      return !e.disabled&&e.tabIndex>=0&&!e.closest('[hidden]')&&(!closed||e===closed.querySelector('summary'))&&e.getClientRects().length;
    });
    event.stopPropagation();
    const first=items[0],last=items[items.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
  });
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.kind){kind=button.dataset.kind;limit=10;render();}if(button.hasAttribute('data-more')){limit=50;render();}});
  $('.cr-categories').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...root.querySelectorAll('[data-kind]')];let i=buttons.findIndex(b=>b.dataset.kind===kind);i=event.key==='Home'?0:event.key==='End'?2:(i+(event.key==='ArrowRight'?1:2))%3;buttons[i].click();buttons[i].focus();});
  $('[data-find]').addEventListener('submit',event=>{event.preventDefault();const query=$('input').value.trim().replace(/^@/,'').toLowerCase();const index=rows().findIndex(row=>row.handle===query);if(index<0){$('[data-found]').textContent='В опубликованном топ-50 этого раздела аккаунт не найден.';return;}if(index>=limit){limit=50;render();}$('[data-found]').textContent='Ваше место: '+(index+1);root.querySelectorAll('[data-handle]').forEach(e=>e.classList.toggle('cr-found',e.dataset.handle===query));});
  function validate(value){
    if(value?.schema!==2||value.algorithm!=='active_community_v2'||!Number.isFinite(Date.parse(value.generated_at)))throw Error('Invalid snapshot');
    const selected=value.periods?.find(p=>p.days===30);
    if(!selected||!Number.isFinite(Date.parse(selected.start))||selected.end!==value.generated_at||Date.parse(selected.end)-Date.parse(selected.start)!==30*86400000)throw Error('Invalid period');
    const fields=['active_days','comment_days','comment_weeks','commented_posts','comments','handle','liked_posts','score','winner_selected'];
    for(const k of ['comments','progression','activity']){const board=selected.scopes?.all?.[k];if(!Array.isArray(board)||board.length>50)throw Error('Invalid board');for(const r of board)if(Object.keys(r).sort().join()!==fields.join()||!/^[a-z0-9_.]{1,24}$/.test(r.handle)||typeof r.winner_selected!=='boolean'||fields.filter(f=>!['handle','winner_selected'].includes(f)).some(f=>!Number.isSafeInteger(r[f])||r[f]<0))throw Error('Invalid row');}
    return value;
  }
  async function load(){
    if(busy||document.hidden||!isOpen())return;busy=true;
    try{const result=await callSupabaseRpc('giveaway_social_rankings_v2',{p_channel:channel},12000,false,'anonymous',true);if(result.status==='READY')snapshot=validate(result.snapshot);else if(result.status==='NOT_PUBLISHED')snapshot=null;else throw Error('Unavailable');$('[data-warning]').hidden=true;render();}
    catch(error){if(snapshot){$('[data-warning]').hidden=false;$('[data-warning]').textContent='Не удалось получить обновление. Показаны ранее загруженные данные.';}else{$('[data-empty] strong').textContent='Рейтинг временно недоступен';$('[data-empty] p').textContent='Попробуем подключиться снова автоматически.';}}
    finally{busy=false;}
  }
  render();
  function poll(){clearInterval(timer);timer=window.setInterval(load,60000);load();}
  poll();window.addEventListener('pageshow',poll);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
  window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
  window.addEventListener('hashchange',()=>{if(location.hash==='#community-rating')open();});
  if(location.hash==='#community-rating')open();
})();
</script>
