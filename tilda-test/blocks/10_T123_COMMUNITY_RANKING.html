<style>
#community-rating{--cr-purple:#a68aff;--cr-cyan:#64dcf7;--cr-gold:#f6d48b;position:relative;overflow:hidden;scroll-margin-top:130px;border:1px solid #a68aff35;border-radius:26px;background:radial-gradient(ellipse at 85% 0,#7352c126,transparent 55%),linear-gradient(145deg,#131b31,#0d1426);color:#edf0ff;padding:clamp(20px,4vw,40px);font-family:inherit}
#community-rating *{box-sizing:border-box}#community-rating [hidden]{display:none!important}
.cr-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}.cr-eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--cr-purple);text-transform:uppercase;display:flex;align-items:center;gap:9px}.cr-dot{width:6px;height:6px;border-radius:50%;background:var(--cr-cyan);box-shadow:0 0 14px #64dcf766}
#community-rating h2{margin:10px 0;font-size:clamp(25px,4vw,36px);line-height:1.15;letter-spacing:-.8px;color:#f4f2ff}#community-rating p{margin:0;color:#aeb8d3;font-size:14px;line-height:1.65}.cr-header-copy{max-width:580px}.cr-seal{display:grid;place-items:center;width:60px;height:60px;flex:0 0 60px;color:var(--cr-gold);border:1px solid #f6d48b35;border-radius:20px;background:linear-gradient(140deg,#f6d48b18,#f6d48b04)}.cr-seal svg{width:28px;height:28px}
.cr-categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}
#community-rating button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#community-rating button:focus-visible,#community-rating input:focus-visible{outline:2px solid var(--cr-cyan);outline-offset:4px}
.cr-category{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #b3bfe01a;border-radius:16px;color:#aeb8d3;background:#ffffff03;text-align:left;transition:background .18s,border-color .18s}.cr-category:hover{background:#ffffff08}.cr-category[aria-selected=true]{border-color:#a68aff88;color:#fff;background:linear-gradient(110deg,#8a63e329,#7256ba0b);box-shadow:inset 0 1px #cbb7ff12}.cr-category svg{width:22px;height:22px;flex:none;color:var(--cr-purple)}.cr-category span{display:grid;gap:4px}.cr-category b{font-size:14px;font-weight:700}.cr-category small{font-size:11px;color:#9ca8c6}
.cr-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}.cr-switch{display:inline-flex;gap:3px;border:1px solid #b3bfe01a;border-radius:11px;padding:4px;background:#060c193d}.cr-switch button{padding:8px 12px;border:0;border-radius:7px;background:transparent;color:#9daac7;font-size:12px!important;white-space:nowrap}.cr-switch button[aria-pressed=true]{background:#a68aff22;color:#eee6ff;box-shadow:inset 0 0 0 1px #a68aff26}
.cr-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch;margin-bottom:20px}.cr-podium article{min-width:0;position:relative;padding:24px 14px 20px;border:1px solid #b6c4e624;border-radius:18px;background:linear-gradient(155deg,#ffffff05,#ffffff01);text-align:center}.cr-podium article:first-child{border-color:#f6d48b55;background:radial-gradient(ellipse at 50% 0,#f6d48b12,transparent 80%),#ffffff02}.cr-place{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 16px;font-size:18px;font-weight:800;border-radius:15px;color:#bbc9ed;background:#bbc9ed10;border:1px solid #bbc9ed30}.cr-podium article:first-child .cr-place{color:var(--cr-gold);border-color:#f6d48b50;background:#f6d48b12}.cr-podium article:nth-child(3) .cr-place{color:#e2b29a;border-color:#e2b29a33}.cr-person{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#edf0ff;text-decoration:none;font-size:14px;font-weight:650}.cr-person:hover{color:var(--cr-cyan)}.cr-value{display:block;color:#f6f2ff;font-size:30px;font-weight:800;line-height:1.3;letter-spacing:-.5px;margin:12px 0 2px;font-variant-numeric:tabular-nums}.cr-unit{display:block;font-size:11px;color:#9ca8c6}.cr-details{margin-top:14px!important;font-size:11px!important;color:#8e9cbd!important}
.cr-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}.cr-list li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 16px;border:1px solid #b3bfe00f;border-radius:12px;background:#ffffff02}.cr-list .cr-rank{font-size:12px;font-weight:700;color:#7e8bad}.cr-list .cr-person{font-size:13px}.cr-list strong{font-size:15px;color:#dcd5f5;font-variant-numeric:tabular-nums}.cr-list small{font-size:10px;font-weight:400;color:#8f9dbf;margin-left:8px}.cr-list li.cr-found{border-color:#64dcf788;background:#64dcf70a}
.cr-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid #b3bfe015;margin-top:20px}.cr-meta time,.cr-period{font-size:11px;color:#8492b5}.cr-empty{padding:38px 16px;text-align:center;border:1px dashed #a68aff35;border-radius:16px}.cr-empty strong{display:block;font-size:17px;margin-bottom:10px}.cr-more{display:block;margin:18px auto 0;padding:10px 20px;color:#cfc0ff;background:#a68aff0d;border:1px solid #a68aff33;border-radius:10px;font-size:12px!important}.cr-find{display:flex;gap:8px;align-items:center;margin:20px 0 12px;flex-wrap:wrap}.cr-find label{font-size:12px;color:#aeb8d3}.cr-find input{width:180px;max-width:100%;background:#070e1c;color:#edf0ff;border:1px solid #b3bfe026;border-radius:8px;font:inherit;font-size:12px;padding:10px 12px}.cr-find output{color:#aeb8d3;font-size:12px}.cr-method{border-top:1px solid #b3bfe015;margin-top:20px;padding-top:16px;font-size:12px;color:#9eacc9}.cr-method summary{cursor:pointer;color:#bdafe9;padding:4px 0}.cr-method p{font-size:12px!important;margin-top:10px!important}.cr-warning{color:#edc788!important;margin-bottom:14px!important}.cr-live{font-size:11px;color:#91cabb;display:flex;align-items:center;gap:6px}.cr-live:before{content:'';width:5px;height:5px;border-radius:50%;background:#74c6ae}
@media(max-width:620px){.cr-heading{gap:12px}.cr-seal{width:44px;height:44px;flex-basis:44px;border-radius:14px}.cr-seal svg{width:23px;height:23px}.cr-category{padding:12px 7px;gap:8px;flex-direction:column;text-align:center}.cr-category b{font-size:11px}.cr-category small{font-size:10px}.cr-category svg{width:19px;height:19px}.cr-podium{gap:7px}.cr-podium article{padding:16px 6px}.cr-place{width:32px;height:32px;border-radius:11px;font-size:14px;margin-bottom:12px}.cr-person{font-size:11px}.cr-value{font-size:25px}.cr-details{font-size:10px!important}.cr-list li{padding:12px 10px;gap:6px;grid-template-columns:24px minmax(0,1fr) auto}.cr-list small{display:none}.cr-controls{gap:8px}.cr-switch{width:100%;justify-content:space-between}.cr-switch button{flex:1;padding:8px}.cr-meta{align-items:flex-start;flex-direction:column}.cr-header-copy p{font-size:12px!important}}
@media(prefers-reduced-motion:reduce){.cr-category{transition:none}}
@media(max-width:480px){.cr-podium{grid-template-columns:repeat(2,minmax(0,1fr))}.cr-podium article:first-child{grid-column:1/-1;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;padding:18px 12px}.cr-podium article:first-child .cr-place{grid-row:1/3;margin:0}.cr-podium article:first-child .cr-person{font-size:12px}.cr-podium article:first-child .cr-value{grid-column:3;grid-row:1/3;margin:0;font-size:27px}.cr-podium article:first-child .cr-unit{grid-column:2;font-size:10px}.cr-podium article:first-child .cr-details{grid-column:1/-1;margin-top:8px!important}.cr-podium article:not(:first-child) .cr-person{font-size:12px}.cr-find label{flex:0 0 100%}.cr-find input{flex:1;width:120px}.cr-find button{flex-shrink:0}}
</style>
<template id="communityRankingTemplate">
<section id="community-rating" aria-labelledby="communityRankingTitle">
  <header class="cr-heading"><div class="cr-header-copy"><div class="cr-eyebrow"><span class="cr-dot" aria-hidden="true"></span>Сообщество RYTNI · TikTok</div><h2 id="communityRankingTitle">Те, кто рядом</h2><p>Обсуждаете, поддерживаете, возвращаетесь.<br>Здесь — активность участников Rytni Подари.</p></div><div class="cr-seal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3h8v5a4 4 0 0 1-8 0V3ZM8 5H4v2a4 4 0 0 0 5 4m7-6h4v2a4 4 0 0 1-5 4M12 12v6m-4 3h8m-8-3h8v3H8z"/></svg></div></header>
  <div class="cr-categories" role="tablist" aria-label="Категория рейтинга">
    <button type="button" class="cr-category" role="tab" aria-selected="false" data-kind="comments"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11a9 9 0 0 1-9 9H4l-3 2 2-6a9 9 0 1 1 18-5Z"/><path d="M7 9h10M7 13h7"/></svg><span><b>Обсуждают</b><small>Комментарии</small></span></button>
    <button type="button" class="cr-category" role="tab" aria-selected="false" data-kind="likes"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span><b>Поддерживают</b><small>Лайки роликов</small></span></button>
    <button type="button" class="cr-category" role="tab" aria-selected="true" data-kind="activity"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m13 2-9 12h7l-1 8 10-13h-7l1-7Z"/></svg><span><b>Всегда рядом</b><small>Общая активность</small></span></button>
  </div>
  <div class="cr-controls"><div class="cr-switch" role="group" aria-label="Канал"><button type="button" data-scope="all" aria-pressed="true">Оба канала</button><button type="button" data-scope="gaming" aria-pressed="false">Gaming</button><button type="button" data-scope="tech" aria-pressed="false">Tech</button></div><div class="cr-switch" role="group" aria-label="Период"><button type="button" data-days="7" aria-pressed="false">7 дней</button><button type="button" data-days="14" aria-pressed="false">14 дней</button><button type="button" data-days="30" aria-pressed="true">30 дней</button></div></div>
  <p class="cr-warning" data-warning hidden></p>
  <div role="tabpanel" aria-label="Участники рейтинга" aria-live="polite"><div class="cr-empty" data-empty role="status"><strong>Загружаем рейтинг</strong><p>Собираем подтверждённую активность сообщества.</p></div><div class="cr-podium" data-podium hidden></div><ol class="cr-list" data-list start="4"></ol><button type="button" class="cr-more" data-more hidden>Показать больше</button></div>
  <form class="cr-find" data-find><label for="communityFind">Найти себя</label><input id="communityFind" maxlength="25" placeholder="@username" autocomplete="off" spellcheck="false"><button type="submit" class="cr-more" style="margin:0">Найти</button><output data-found></output></form>
  <footer class="cr-meta"><span class="cr-live">По собранным данным TikTok</span><span class="cr-period" data-period></span><time data-updated></time></footer>
  <details class="cr-method"><summary>Как считается рейтинг</summary><p>В рейтинг входят участники текущего сезона с точным совпадением указанного @username. Неоднозначные совпадения проходят отдельную проверку. Аккаунты организатора, заблокированные и тестовые заявки в рейтинге не участвуют.</p><p>«Обсуждают» — число собранных комментариев. «Поддерживают» — разные ролики с обнаруженным лайком. «Всегда рядом» — индекс: 3 за каждый разный ролик с комментарием + 1 за ролик с лайком + 2 за каждый активный день UTC. Повторные комментарии к одному ролику не увеличивают его вклад в индекс.</p><p>История частичная. Для лайков период означает время первого обнаружения приложением, а не точное время нажатия. Репосты в индекс не входят: надёжный список авторов репостов недоступен. Индекс не меняет приватный баланс очков заявки и не определяет победителей автоматически.</p></details>
</section>
</template>
<script>
(() => {
  'use strict';
  const mount=document.getElementById('communityRankingMount');
  if(!mount)return;
  mount.append(document.getElementById('communityRankingTemplate').content.cloneNode(true));
  const root=mount.querySelector('#community-rating'),$=s=>root.querySelector(s);
  const channel=mount.dataset.channel==='main'?'main':'test';
  let snapshot=null,kind='activity',scope='all',days=30,limit=10,busy=false,near=false,timer;
  const number=v=>Number(v).toLocaleString('ru-RU');
  const date=v=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Minsk'}).format(new Date(v));
  const updated=v=>new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Minsk'}).format(new Date(v));
  const field=()=>({comments:'comments',likes:'liked_posts',activity:'score'})[kind];
  const unit=()=>({comments:'комментариев',likes:'роликов с лайком',activity:'индекс активности'})[kind];
  const period=()=>snapshot?.periods.find(p=>p.days===days);
  const rows=()=>period()?.scopes?.[scope]?.[kind]||[];
  function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  function person(row){const a=el('a','cr-person','@'+row.handle);a.href='https://www.tiktok.com/@'+row.handle;a.target='_blank';a.rel='noopener noreferrer';return a;}
  function render(){
    root.querySelectorAll('[data-kind]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.kind===kind));b.tabIndex=b.dataset.kind===kind?0:-1;});
    root.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));
    root.querySelectorAll('[data-days]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.days)===days)));
    const board=rows();$('[data-podium]').replaceChildren();$('[data-list]').replaceChildren();
    $('[data-empty]').hidden=board.length>0;$('[data-podium]').hidden=!board.length;
    $('[data-more]').hidden=board.length<=limit;$('[data-found]').textContent='';
    if(!board.length){$('[data-empty] strong').textContent=snapshot?'Пока без лидеров':'Рейтинг готовится';$('[data-empty] p').textContent=snapshot?'За этот период совпадений с участниками ещё нет. После следующего сбора рейтинг обновится.':'Первая проверенная публикация появится здесь автоматически.';}
    board.slice(0,limit).forEach((row,index)=>{
      if(index<3){const card=el('article');card.append(el('span','cr-place',String(index+1)),person(row),el('strong','cr-value',number(row[field()])),el('span','cr-unit',unit()),el('p','cr-details',number(row.active_days)+' активных дн. · '+number(row.commented_posts+row.liked_posts)+' действий с роликами'));$('[data-podium]').append(card);}
      else{const item=el('li');item.dataset.handle=row.handle;const value=el('strong','',number(row[field()]));value.append(el('small','',kind==='activity'?'индекс':kind==='likes'?'роликов':'комм.'));item.append(el('span','cr-rank',String(index+1).padStart(2,'0')),person(row),value);$('[data-list]').append(item);}
    });
    if(snapshot){$('[data-updated]').dateTime=snapshot.generated_at;$('[data-updated]').textContent='Обновлено '+updated(snapshot.generated_at)+' · Минск';$('[data-period]').textContent=date(period().start)+' — '+date(period().end);const old=Date.now()-Date.parse(snapshot.generated_at)>86400000;$('[data-warning]').hidden=!old;$('[data-warning]').textContent='Показан последний опубликованный рейтинг. Ожидаем обновления данных.';}
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.kind){kind=button.dataset.kind;limit=10;render();}
    if(button.dataset.scope){scope=button.dataset.scope;limit=10;render();}
    if(button.dataset.days){days=Number(button.dataset.days);limit=10;render();}
    if(button.hasAttribute('data-more')){limit=50;render();}
  });
  $('.cr-categories').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...root.querySelectorAll('[data-kind]')];let i=buttons.findIndex(b=>b.dataset.kind===kind);i=event.key==='Home'?0:event.key==='End'?2:(i+(event.key==='ArrowRight'?1:2))%3;buttons[i].click();buttons[i].focus();});
  $('[data-find]').addEventListener('submit',event=>{event.preventDefault();const query=$('input').value.trim().replace(/^@/,'').toLowerCase();const index=rows().findIndex(row=>row.handle===query);if(index<0){$('[data-found]').textContent='В опубликованном топ-50 этого раздела аккаунт не найден.';return;}if(index>=limit){limit=50;render();}$('[data-found]').textContent='Ваше место: '+(index+1);root.querySelectorAll('[data-handle]').forEach(e=>e.classList.toggle('cr-found',e.dataset.handle===query));});
  function validate(value){
    if(value?.schema!==1||value.algorithm!=='social_activity_v1'||!Number.isFinite(Date.parse(value.generated_at))||value.periods?.length!==3)throw Error('Invalid snapshot');
    for(const [i,p] of value.periods.entries()){
      if(p.days!==[7,14,30][i]||!Number.isFinite(Date.parse(p.start))||p.end!==value.generated_at)throw Error('Invalid period');
      for(const s of ['all','gaming','tech'])for(const k of ['comments','likes','activity']){
        const board=p.scopes?.[s]?.[k];if(!Array.isArray(board)||board.length>50)throw Error('Invalid board');
        for(const r of board)if(!/^[a-z0-9_.]{1,24}$/.test(r.handle)||['comments','commented_posts','liked_posts','active_days','score'].some(f=>!Number.isSafeInteger(r[f])||r[f]<0))throw Error('Invalid row');
      }
    }return value;
  }
  async function load(){
    if(busy||document.hidden||!near)return;busy=true;
    try{const result=await callSupabaseRpc('giveaway_social_rankings_v1',{p_channel:channel},12000,false,'anonymous',true);if(result.status==='READY')snapshot=validate(result.snapshot);else if(result.status==='NOT_PUBLISHED')snapshot=null;else throw Error('Unavailable');$('[data-warning]').hidden=true;render();}
    catch(error){if(snapshot){$('[data-warning]').hidden=false;$('[data-warning]').textContent='Не удалось получить обновление. Показаны ранее загруженные данные.';}else{$('[data-empty] strong').textContent='Рейтинг временно недоступен';$('[data-empty] p').textContent='Попробуем подключиться снова автоматически.';}}
    finally{busy=false;}
  }
  render();
  new IntersectionObserver(entries=>{near=entries[0].isIntersecting;if(near)load();},{rootMargin:'400px'}).observe(root);
  function poll(){clearInterval(timer);timer=window.setInterval(load,60000);load();}
  poll();window.addEventListener('pageshow',poll);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
  window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
})();
</script>
