async function probeSupabaseOrigin(origin){

async function selectSupabaseOrigin(force=false){
  if(!force&&Date.now()-supabaseRouteCheckedAt<SUPABASE_ROUTE_TTL)return supabaseActiveOrigin;
  if(supabaseRouteProbe)return supabaseRouteProbe;
  supabaseRouteProbe=(async()=>{
    if(await probeSupabaseOrigin(SUPABASE_DIRECT_URL)){rememberSupabaseOrigin(SUPABASE_DIRECT_URL);return SUPABASE_DIRECT_URL;}
    if(await probeSupabaseOrigin(SUPABASE_FALLBACK_URL)){rememberSupabaseOrigin(SUPABASE_FALLBACK_URL);return SUPABASE_FALLBACK_URL;}
    rememberSupabaseOrigin(SUPABASE_DIRECT_URL);return SUPABASE_DIRECT_URL;
  })().finally(()=>{supabaseRouteProbe=null;});

}
async function supabaseFetch(path,options={},safeRetry=false){
  const origin=await selectSupabaseOrigin();
  const alternate=origin===SUPABASE_DIRECT_URL?SUPABASE_FALLBACK_URL:SUPABASE_DIRECT_URL;
  try{
    const response=await fetch(`${origin}${path}`,options);
    if(safeRetry&&origin!==alternate&&[500,502,503,504].includes(response.status)&&!options?.signal?.aborted){
      rememberSupabaseOrigin(alternate);
      return fetch(`${alternate}${path}`,options);
    }
    return response;
  }
  catch(error){
    if(safeRetry&&error?.name!=="AbortError"&&!options?.signal?.aborted){rememberSupabaseOrigin(alternate);return fetch(`${alternate}${path}`,options);}
    if(origin===SUPABASE_DIRECT_URL)rememberSupabaseOrigin(SUPABASE_FALLBACK_URL);
    throw error;
  }
}

function readSessionCache(key,ttl){

async function cachedRpc(cacheName,rpcName,body={},timeoutMs=5000,ttl=PUBLIC_CACHE_TTL,force=false,authMode="auto"){
  const key=`rytni_rpc:${cacheName}:${activeSeason?.id||"active"}`;
  if(!force){const cached=readSessionCache(key,ttl);if(cached){egressDiagnostic(rpcName,{rows:Array.isArray(cached)?cached.length:1,cache:true,size:JSON.stringify(cached).length});return cached;}}
  if(requestInFlight.has(key))return requestInFlight.get(key);
  const started=performance.now();
  const pending=callSupabaseRpc(rpcName,body,timeoutMs,false,authMode,true).then(result=>{
    const encoded=JSON.stringify(result);writeSessionCache(key,result);
    egressDiagnostic(rpcName,{rows:Array.isArray(result)?result.length:Array.isArray(result?.items)?result.items.length:1,elapsed:performance.now()-started,size:encoded.length});
    return result;
  }).finally(()=>requestInFlight.delete(key));
  requestInFlight.set(key,pending);return pending;
}

function saveAuthSession(session){

}

async function authRequest(path,body,token=""){

}
async function restoreAuthSession(){

  if(!stored?.access_token){saveAuthSession(null);return null;}

async function ensureAuthSession(){
  if(!authSession)return null;
  if(Number(authSession.expires_at||0)>Math.floor(Date.now()/1000)+60){renderAuthState();return authSession;}
  if(!authSession.refresh_token){saveAuthSession(null);return null;}
  if(authRefreshInFlight)return authRefreshInFlight;
  const refreshLocked=async()=>{
    const stored=readAuthSession();
    if(stored?.access_token&&Number(stored.expires_at||0)>Math.floor(Date.now()/1000)+60){authSession=stored;renderAuthState();return stored;}
    const candidate=stored?.refresh_token?stored:authSession;
    if(!candidate?.refresh_token){saveAuthSession(null);return null;}
    try{
      const refreshed=await authRequest("token?grant_type=refresh_token",{refresh_token:candidate.refresh_token});
      saveAuthSession(refreshed);return refreshed;
    }catch(error){
      const latest=readAuthSession();
      if(latest?.access_token&&latest.refresh_token!==candidate.refresh_token){
        authSession=latest;
        if(Number(latest.expires_at||0)>Math.floor(Date.now()/1000)+60){renderAuthState();return latest;}
        try{const recovered=await authRequest("token?grant_type=refresh_token",{refresh_token:latest.refresh_token});saveAuthSession(recovered);return recovered;}catch(retryError){error=retryError;}
      }
      if(error?.code==="refresh_token_not_found"||error?.code==="refresh_token_already_used"){saveAuthSession(null);}
      else renderAuthState();
      return null;
    }
  };
  const refreshTask=()=>navigator.locks?.request?navigator.locks.request(AUTH_REFRESH_LOCK,refreshLocked):refreshLocked();
  authRefreshInFlight=refreshTask().finally(()=>{authRefreshInFlight=null;});
  return authRefreshInFlight;
}

function authOtpErrorMessage(error,phase="send"){
  const status=Number(error?.status||0),code=String(error?.code||"").toLowerCase();
  if(status===429||code.includes("rate_limit"))return phase==="verify"?"Слишком много попыток. Подождите минуту и затем введите код из самого нового письма.":"Код уже запрошен. Подождите минуту перед повторной отправкой.";
  if(phase==="verify"&&(status===400||status===403||status===422||code.includes("otp")))return "Код не подошёл или устарел. Используйте 6 цифр из самого нового письма либо запросите новый код после таймера.";
  if(phase==="send"&&(status===400||status===422))return "Не удалось принять этот адрес. Проверьте email и исправьте опечатку.";
  if(status>=500)return "Сервис подтверждения временно недоступен. Подождите немного и повторите попытку.";
  if(!navigator.onLine||error?.name==="TypeError")return "Нет соединения с сервером. Проверьте интернет и повторите попытку.";
  return phase==="verify"?"Не удалось проверить код. Повторите попытку или запросите новый код после таймера.":"Не удалось отправить письмо. Проверьте соединение и повторите попытку позже.";
}

async function sendAuthOtp(isResend=false){
  if(authOtpRequestInFlight)return;
  const emailInput=document.getElementById("authEmail"),sendButton=document.getElementById("sendOtpBtn");
  const nextEmail=isResend?authEmail:normalizeAuthEmail(emailInput?.value);
  if(!/^\S+@\S+\.\S+$/.test(nextEmail)){showAuthStatus("Введите корректный email.",true);emailInput?.focus();return;}
  authEmail=nextEmail;if(emailInput)emailInput.value=authEmail;
  const remaining=pendingOtpSeconds();if(isResend&&remaining>0){showAuthStatus(`Новый код можно запросить через ${remaining} с.`,true);renderOtpResendState();return;}
  authOtpRequestInFlight=true;if(sendButton)sendButton.disabled=true;renderOtpResendState();
  try{
    await authRequest("otp",{email:authEmail,create_user:true});recordFunnelEvent("otp_sent");rememberPendingOtp(authEmail);
    const otpInput=document.getElementById("authOtp");if(otpInput)otpInput.value="";
    showOtpVerify(isResend?"Новый код отправлен. Предыдущий код больше не используйте.":"");
  }catch(error){
    const rateLimited=Number(error?.status||0)===429||String(error?.code||"").toLowerCase().includes("rate_limit");
    if(rateLimited&&!readPendingOtp())rememberPendingOtp(authEmail);
    if(isResend||rateLimited)showOtpVerify(authOtpErrorMessage(error,"send"));else showAuthStatus(authOtpErrorMessage(error,"send"),true);
  }finally{authOtpRequestInFlight=false;if(sendButton)sendButton.disabled=false;renderOtpResendState();}
}

function playSynthSound(type){
  if(soundMuted) return;
  try{
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioContext.currentTime;
    const master = audioContext.createGain();
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(type === "wrong" ? 0.035 : 0.055,now + 0.015);
    master.gain.exponentialRampToValueAtTime(0.0001,now + (type === "chest" ? 0.55 : 0.34));
    master.connect(audioContext.destination);
    const notes = type === "chest"
      ? [392,523.25,659.25,783.99]
      : type === "wrong"
        ? [220,174.61]
        : [523.25,659.25,783.99];
    notes.forEach((frequency,index) => {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = type === "chest" ? "triangle" : "sine";
      oscillator.frequency.setValueAtTime(frequency,now + index * 0.07);
      gain.gain.setValueAtTime(0.0001,now + index * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.34,now + index * 0.07 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001,now + index * 0.07 + 0.16);
      oscillator.connect(gain);
      gain.connect(master);
      oscillator.start(now + index * 0.07);
      oscillator.stop(now + index * 0.07 + 0.18);
    });
  }catch(error){}
}
function playUiSound(type){
  if(soundMuted) return;
  const player = uiSoundPlayers[type] || uiSoundPlayers.success;
  if(!player){
    playSynthSound(type);
    return;
  }
  try{
    player.pause();
    player.currentTime = 0;
    const playback = player.play();
    if(playback && typeof playback.catch === "function") playback.catch(() => playSynthSound(type));
  }catch(error){
    playSynthSound(type);
  }
}
function playRandomMushroomSound(){

  const next = MUSHROOM_SOUND_FILES[Math.floor(Math.random() * MUSHROOM_SOUND_FILES.length)];
  try{
    mushroomAudio.pause();

  }catch(error){}
}
function unlockSiteAudio(){
  if(soundMuted) return;
  try{
    audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
    if(audioContext.state === "suspended") audioContext.resume().catch(() => {});
  }catch(error){}
  if(audioUnlocked)return;
  audioUnlocked=true;
  Object.values(uiSoundPlayers).forEach(player => {
    player.load();
    player.muted = true;
    const unlock = player.play();
    if(unlock && typeof unlock.then === "function"){
      unlock.then(() => {
        player.pause();
        player.currentTime = 0;
        player.muted = false;
      }).catch(() => { player.muted = false; });
    }else{
      player.muted = false;
    }
  });
}

function restorePopupFocusBeforeHide(closing){
  if(!closing.some(popup=>popup.contains(document.activeElement)))return;
  const eligible=element=>element instanceof HTMLElement&&element.isConnected&&!closing.some(popup=>popup.contains(element))&&!element.closest('[aria-hidden="true"]')&&!element.disabled&&element.getClientRects().length&&getComputedStyle(element).visibility!=="hidden";

  const candidates=[...(underlying?popupFocusable(underlying):[]),popupReturnFocus,document.getElementById("mushroomSoundBtn"),...document.querySelectorAll('button,a[href],[tabindex="0"]')];
  for(const target of candidates){if(eligible(target)){target.focus({preventScroll:true});if(document.activeElement===target)return;}}

function closePopupLayer(popup=activePopup){

    try{document.getElementById("ttqPlayer")?.contentWindow?.postMessage({type:"pause","x-tiktok-player":true},"https://www.tiktok.com");}catch(error){}

  activePopup=popupLayers[popupLayers.length-1]||[...document.querySelectorAll(".popup-overlay")].reverse().find(isPopupVisible)||null;

    if(!popupLayers.includes(activePopup))popupLayers.push(activePopup);

  if(event.key==="Escape"){
    if(activePopup.id==="applicationPopup"&&window.RytniArcadeHub?.ownsFullscreenEscape?.(event))return;
    event.preventDefault();
    if(window.__RYTNI_ARCADE_DIAG__?.host)window.__RYTNI_ARCADE_DIAG__.host.popupCloses++;
    closePopupLayer(activePopup);return;
  }
  if(event.key!=="Tab")return;
  const items=popupFocusable(activePopup);if(!items.length){event.preventDefault();return;}
  const first=items[0],last=items[items.length-1];

  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
});

function updateTimer(){
  const now = Date.now();
  const left = endDate - now;
  const timer = document.getElementById("timer");
  const finished = document.getElementById("seasonFinished");
  const badge = document.getElementById("seasonStateBadge");
  if(Number.isFinite(startDate) && startDate > now){
    if(badge){badge.dataset.state="upcoming";badge.textContent="Сезон скоро начнётся";}
    setFormAvailability(false,"Приём заявок ещё не начался.");
  }else if(seasonState === "active" && left > 0 && badge?.dataset.state === "upcoming"){
    badge.dataset.state="active";
    badge.textContent="Сезон активен";
    setFormAvailability(seasonFormEnabled,seasonFormEnabled?"":"Приём заявок сейчас закрыт.");
  }
  if(left <= 0){
    if(!seasonSettingsLoaded) return;
    if(timer) timer.hidden = true;
    if(finished) finished.hidden = false;
    if(badge){ badge.dataset.state = "finished"; badge.textContent = "Сезон завершён"; }
    setFormAvailability(false,"Сезон завершён. Новые заявки больше не принимаются.");
    return;
  }
  if(timer) timer.hidden = false;
  if(finished) finished.hidden = true;
  updateCountdownDigit("d",Math.floor(left / 86400000));
  updateCountdownDigit("h",Math.floor((left % 86400000) / 3600000));
  updateCountdownDigit("m",Math.floor((left % 3600000) / 60000));
  updateCountdownDigit("s",Math.floor((left % 60000) / 1000));
}
function updateCountdownDigit(id,value){
  const digit = document.getElementById(id);
  if(!digit) return;
  const formatted = String(Math.max(0,value)).padStart(2,"0");
  if(digit.dataset.value === formatted) return;
  digit.dataset.value = formatted;
  digit.textContent = formatted;
}

function renderTopGames(games){
  const list = document.getElementById("topGamesList");
  list.textContent = "";
  const mergedGames = new Map();
  (games || []).forEach(game => {
    const rawName = String((game && game.name) || "").trim();
    if(!rawName) return;
    const key = rawName
      .toLowerCase()
      .replace(/\s+/g," ")
      .replace(/[.,!?:;"'`~]+$/g,"");
    const current = mergedGames.get(key);
    if(current){
      current.count += Number(game.count || 0);
      if(rawName.length > current.name.length) current.name = rawName;
      return;
    }
    mergedGames.set(key,{
      name: rawName,
      count: Number(game.count || 0)
    });
  });
  [...mergedGames.values()]
    .sort((a,b) => b.count - a.count || a.name.localeCompare(b.name))
    .slice(0,10)
    .forEach((game,index) => {
      const badge = document.createElement("span");
      const placeClass = index === 0 ? " place-1" : index === 1 ? " place-2" : index === 2 ? " place-3" : "";
      badge.className = (index < 3 ? "game-badge podium" : "game-badge") + placeClass;
      const rank = document.createElement("span");
      const name = document.createElement("span");
      const count = document.createElement("span");
      const rankClass = index === 0 ? "gold" : index === 1 ? "silver" : index === 2 ? "bronze" : "leader";
      rank.className = "game-rank " + rankClass;
      name.className = "game-name";
      count.className = "game-count";
      rank.textContent = index < 3 ? String(index + 1) : "\u2605";
      name.textContent = game.name;
      count.textContent = game.count;
      badge.append(rank,name,count);
      list.appendChild(badge);
  });
  if(!list.children.length) list.textContent = "\u0414\u0430\u043d\u043d\u044b\u0445 \u043f\u043e\u043a\u0430 \u043d\u0435\u0442";

    }

        headers:supabaseHeaders(), cache:"no-store"
      },true);
      if(!response.ok) return;
      const rows = await response.json();
      config = rows && rows[0];
      if(config)writeSessionCache("rytni_game_config",config);
    }
    if(!config) return;
    if(Array.isArray(config.ranks) && config.ranks.length){
      PROGRESSION_RANKS.splice(0,PROGRESSION_RANKS.length,...config.ranks.map(item => ({
        level:Math.max(1,Math.min(999,Number(item.level) || 1)), name:safeConfigText(item.name,"Ранг",80), icon:safeLucideIcon(item.icon,"shield")
      })));

        rank.asset = RANK_ICON_ASSETS[assetIndex];
      });
    }
    if(Array.isArray(config.achievements) && config.achievements.length){
      const defaults = new Map(PROGRESSION_ACHIEVEMENTS.map(item => [item.id,item]));
      PROGRESSION_ACHIEVEMENTS.splice(0,PROGRESSION_ACHIEVEMENTS.length,...config.achievements.map(item => {

async function loadSeasonSettings(force=false){

const READ_ONLY_RPC_NAMES=new Set([
  "get_active_giveaway_season","get_public_stats","get_public_giveaway_summary","get_my_ban_notice",
  "get_my_active_application","get_giveaway_tiktok_hub_v28","get_my_lucky_coupons","get_my_top10_status",
  "get_my_telegram_settings_v2180","find_giveaway_application"
]);
async function callSupabaseRpc(name, body, timeoutMs, requireAuth=false,authMode="auto",safeRetry=false){
  const verifiedSession=authMode==="anonymous"?null:await ensureAuthSession();
  if(requireAuth&&!verifiedSession?.access_token){
    const authError=new Error(`RPC_${name.toUpperCase()}_AUTH_REQUIRED`);
    authError.name="RytniRpcError";
    authError.kind="auth";
    authError.httpStatus=401;
    authError.rpc=name;
    throw authError;
  }
  const timeout = Math.max(1000,Number(timeoutMs) || 9000);
  const controller = new AbortController();
  const timeoutId = window.setTimeout(() => controller.abort(), timeout);

  try{
    const response = await supabaseFetch(`/rest/v1/rpc/${name}`, {
      method:"POST",
      headers:supabaseHeaders(),
      body:JSON.stringify(body || {}),
      signal:controller.signal,
      cache:"no-store"
    },safeRetry||READ_ONLY_RPC_NAMES.has(name));

    if(!response.ok){
      let payload = null;
      try{ payload = await response.json(); }catch(error){}
      const rpcError = new Error(payload?.message || `RPC_${name.toUpperCase()}_FAILED`);
      rpcError.name = "RytniRpcError";
      rpcError.kind = response.status === 401 || response.status === 403 ? "auth" : response.status >= 500 ? "server" : "http";
      rpcError.httpStatus = response.status;
      rpcError.code = payload?.code || "";
      rpcError.rpc = name;
      throw rpcError;
    }

    return await response.json();
  }catch(error){
    if(error?.name === "AbortError"){
      const timeoutError = new Error(`RPC_${name.toUpperCase()}_TIMEOUT`);
      timeoutError.name = "RytniRpcError";
      timeoutError.kind = "timeout";
      timeoutError.rpc = name;
      timeoutError.timeoutMs = timeout;
      throw timeoutError;
    }
    if(error instanceof TypeError && !error.kind){
      const networkError = new Error(`RPC_${name.toUpperCase()}_NETWORK`);
      networkError.name = "RytniRpcError";
      networkError.kind = "network";
      networkError.rpc = name;
      throw networkError;
    }
    throw error;
  }finally{
    window.clearTimeout(timeoutId);
  }
}

  if(error?.kind === "auth") return `Сессия закончилась. Войдите по email снова, чтобы ${action}.`;

function normalizeText(value){
  return String(value || "").trim().replace(/\s+/g," ");
}

function normalizeSteam(value){
  const raw=normalizeText(value);
  if(/^\d{6,20}$/.test(raw))return raw;
  try{
    const candidate=/^https?:\/\//i.test(raw)?raw:`https://${raw}`;
    const url=new URL(candidate);
    if(url.hostname.replace(/^www\./,"").toLowerCase()!=="steamcommunity.com")return "";
    const match=url.pathname.match(/^\/profiles\/(\d{15,20})\/?$/i);
    return match?match[1]:"";
  }catch(error){return "";}
}
function normalizeSteamFriendCode(value){
  const raw=String(value||"").trim();
  return /^\d{6,10}$/.test(raw)?raw:"";
}
function validateSteamField(showEmpty=false){

  input.classList.toggle("is-valid",Boolean(normalized));

  if(normalized){hint.textContent=`Steam-код дружбы: ${normalized}`;hint.classList.add("is-valid");hint.classList.remove("is-invalid");}
  else if(raw||showEmpty){hint.textContent="Введите только Steam-код дружбы из 6–10 цифр, без ссылки, SteamID64 и пробелов.";hint.classList.add("is-invalid");hint.classList.remove("is-valid");}

}

function normalizeTikTok(value){
  let textValue = normalizeText(value);
  if(/^tiktok\.com\//i.test(textValue) || /^(www|m|vm|vt)\.tiktok\.com\//i.test(textValue)){
    textValue = "https://" + textValue;
  }

  try{
    const url = new URL(textValue);
    const host = url.hostname.replace(/^(www|m|vm|vt)\./,"").toLowerCase();
    const match = url.pathname.match(/^\/(@[\w.-]+)\/?$/i);

    if(host === "tiktok.com" && match){
      return "https://www.tiktok.com/" + match[1].toLowerCase();
    }

    if(host === "tiktok.com"){
      return "https://www.tiktok.com" + url.pathname.replace(/\/+$/,"").toLowerCase();
    }
  }catch(error){}

  return textValue.toLowerCase().replace(/\/+$/,"");
}

function isTikTokUrl(value){
  try{
    let textValue = normalizeText(value);
    if(/^tiktok\.com\//i.test(textValue) || /^(www|m|vm|vt)\.tiktok\.com\//i.test(textValue)){
      textValue = "https://" + textValue;
    }
    const url = new URL(textValue);
    const host = url.hostname.replace(/^(www|m|vm|vt)\./,"").toLowerCase();
    return (url.protocol === "https:" || url.protocol === "http:") && host === "tiktok.com";
  }catch(error){
    return false;
  }
}

  if(data.tiktok.length < 2 || data.tiktok.length>120) return "Проверьте ник или ссылку на профиль TikTok.";

}

function hasMatchingParticipant(participants, data){
  const name = normalizeText(data.name).toLowerCase();
  const region = normalizeText(data.region).toLowerCase();
  const game = normalizeText(data.games).toLowerCase();

  return (participants || []).some(item => {
    return normalizeText(item.name).toLowerCase() === name &&
      normalizeText(item.region).toLowerCase() === region &&
      normalizeText(item.game).toLowerCase() === game;
  });
}

function fitCanvasText(context,text,maxWidth,maxFontSize,minFontSize){
  let value = normalizeText(text).toUpperCase();
  let fontSize = maxFontSize;
  const setFont = () => {
    context.font = `900 ${fontSize}px "Arial Black",Arial,sans-serif`;
  };
  setFont();

  while(fontSize > minFontSize && context.measureText(value).width > maxWidth){
    fontSize -= 2;
    setFont();
  }

  if(context.measureText(value).width > maxWidth){
    while(value.length > 2 && context.measureText(value + "…").width > maxWidth){
      value = value.slice(0,-1);
    }
    value += "…";
  }
  return value;
}

async function drawParticipantCard(canvas,count,game,stats={}){
  const template = await loadParticipantCardTemplate();
  const context = canvas.getContext("2d");
  context.clearRect(0,0,canvas.width,canvas.height);
  context.drawImage(template,0,0,canvas.width,canvas.height);
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillStyle = "#2b1708";
  context.strokeStyle = "rgba(255,244,214,.7)";
  context.lineWidth = 1;
  context.shadowColor = "rgba(83,42,11,.2)";
  context.shadowBlur = 1;
  context.shadowOffsetY = 1;

  context.font = '900 11px "Arial Black",Arial,sans-serif';
  context.fillText("ИГРОК",145,55);
  context.fillText("НОМЕР",345,55);
  const fittedName = fitCanvasText(context,stats.name || "ИГРОК",220,31,18);
  context.strokeText(fittedName,145,87);
  context.fillText(fittedName,145,87);
  const participantNumber = count ? `№ ${count}` : "—";
  const fittedNumber = fitCanvasText(context,participantNumber,105,27,17);
  context.strokeText(fittedNumber,345,87);
  context.fillText(fittedNumber,345,87);

  const points = Math.max(0,Number(stats.points) || 0);
  const fittedPoints = fitCanvasText(context,`${points.toLocaleString("ru-RU")} ОЧКОВ`,330,25,16);
  context.strokeText(fittedPoints,225,128);
  context.fillText(fittedPoints,225,128);

  const level = Math.max(1,Number(stats.level) || 1);
  const streak = Math.max(0,Number(stats.question_combo_current ?? stats.correct_streak) || 0);
  const rank = normalizeText(stats.rank_name || "Новобранец");

  context.shadowColor = "rgba(0,0,0,.7)";
  context.shadowBlur = 3;
  context.fillStyle = "#facc15";
  context.strokeStyle = "rgba(0,0,0,.55)";
  context.font = '900 9px "Arial Black",Arial,sans-serif';
  [[104,"УРОВЕНЬ"],[225,"РАНГ"],[345,"ВЕРНЫХ"]].forEach(([x,label]) => context.fillText(label,x,608));
  context.fillStyle = "#fff7d6";
  const fittedLevel = fitCanvasText(context,String(level),82,20,14);
  context.strokeText(fittedLevel,104,631); context.fillText(fittedLevel,104,631);
  const rankWords = rank.toUpperCase().split(/\s+/).filter(Boolean);
  if(rankWords.length > 1){
    let splitAt = 1;
    let bestDifference = Infinity;
    for(let index=1;index<rankWords.length;index+=1){
      const difference = Math.abs(rankWords.slice(0,index).join(" ").length - rankWords.slice(index).join(" ").length);
      if(difference < bestDifference){ bestDifference = difference; splitAt = index; }
    }
    const rankLineOne = fitCanvasText(context,rankWords.slice(0,splitAt).join(" "),100,11,7);
    const rankLineTwo = fitCanvasText(context,rankWords.slice(splitAt).join(" "),100,11,7);
    context.strokeText(rankLineOne,225,625); context.fillText(rankLineOne,225,625);
    context.strokeText(rankLineTwo,225,638); context.fillText(rankLineTwo,225,638);
  }else{
    const fittedRank = fitCanvasText(context,rank,100,17,9);
    context.strokeText(fittedRank,225,631); context.fillText(fittedRank,225,631);
  }
  const fittedStreak = fitCanvasText(context,String(streak),82,20,14);
  context.strokeText(fittedStreak,345,631); context.fillText(fittedStreak,345,631);

  context.shadowColor = "rgba(83,42,11,.2)";
  context.shadowBlur = 1;
  context.fillStyle = "#2b1708";
  context.strokeStyle = "rgba(255,244,214,.7)";
  context.font = '900 11px "Arial Black",Arial,sans-serif';
  context.fillText("ЖЕЛАЕМАЯ ИГРА",225,697);
  const fittedGame = fitCanvasText(context,game,340,31,17);
  context.strokeText(fittedGame,225,742);
  context.fillText(fittedGame,225,742);
  canvas.dataset.ready = "true";
}

function canvasToPngBlob(canvas){
  return new Promise((resolve,reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("CARD_EXPORT_FAILED")),"image/png",1);
  });
}

function participantCardFileName(count){
  return `rytni-podari-${count || "participant"}.png`;
}

function downloadBlob(blob,fileName){
  const link = document.createElement("a");
  const objectUrl = URL.createObjectURL(blob);
  link.href = objectUrl;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(objectUrl),1000);
}

async function saveParticipantCard(blob,count,hint){
  downloadBlob(blob,participantCardFileName(count));
  hint.textContent = "Карточка сохранена — можно загружать её в TikTok";
}

async function shareTikTokParticipation(blob,name,count,game,hint,stats={}){
  const fileName = participantCardFileName(count);
  const caption = `${name} участвует в RYTNI ПОДАРИ: ${stats.points || 0} очков, уровень ${stats.level || 1}, ${stats.correct_streak || 0} верных ответов подряд. Хочу получить ${game}! @rytni.tv #Rytniподари`;

  if(navigator.share && window.File){
    const file = new File([blob],fileName,{type:"image/png"});
    const shareData = {files:[file]};
    let canShareFile = true;
    if(navigator.canShare){
      try{ canShareFile = navigator.canShare({files:[file]}); }catch(error){ canShareFile = false; }
    }

    if(canShareFile){
      try{
        await navigator.share(shareData);
        hint.textContent = "Готово. Если ещё не отправили — выберите TikTok в меню смартфона";
        return;
      }catch(error){
        if(error && error.name === "AbortError") return;
      }
    }
  }

  downloadBlob(blob,fileName);
  try{ await navigator.clipboard.writeText(caption); }catch(error){}
  hint.textContent = navigator.share
    ? "Браузер не смог передать PNG. Карточка сохранена — выберите её в приложении TikTok"
    : "Карточка сохранена, а подпись скопирована. Выберите PNG в приложении TikTok";
}

function renderSuccessCard(name,count,games,target=document.getElementById("playerCard"),celebrate=true,stats={}){
  const playerCard = target || document.getElementById("playerCard");
  playerCard.textContent = "";
  const firstGame = firstDesiredGame(games);
  const shareCard = document.createElement("section");
  shareCard.className = "tiktok-share-card";

  const shareHead = document.createElement("div");
  shareHead.className = "tiktok-share-head";
  const shareIcon = document.createElement("span");
  shareIcon.className = "tiktok-share-icon";
  shareIcon.setAttribute("aria-hidden","true");
  shareIcon.textContent = "♪";
  const shareHeading = document.createElement("div");
  const shareKicker = document.createElement("div");
  shareKicker.className = "tiktok-share-kicker";
  shareKicker.textContent = "Готово к публикации";
  const shareTitle = document.createElement("h4");
  shareTitle.className = "tiktok-share-title";
  const cardStats = {name,points:0,level:1,rank_name:"Новобранец",correct_streak:0,...stats};
  shareTitle.textContent = `${Number(cardStats.points || 0).toLocaleString("ru-RU")} очков`;
  shareHeading.append(shareKicker,shareTitle);
  shareHead.append(shareIcon,shareHeading);

  const shareText = document.createElement("p");
  shareText.className = "tiktok-share-text";
  shareText.textContent = "Поделись карточкой в TikTok и отметь Rytni — пусть твой выбор увидят.";
  const canvas = document.createElement("canvas");
  canvas.className = "participant-card-preview";
  canvas.width = 450;
  canvas.height = 799;
  canvas.setAttribute("role","img");
  canvas.setAttribute("aria-label",`Карточка участника №${count || ""}, желаемая игра: ${firstGame}`);
  const shareTags = document.createElement("div");
  shareTags.className = "tiktok-share-tags";
  ["@rytni.tv","#Rytniподари",`Верных подряд: ${cardStats.correct_streak || 0}`].forEach(value => {
    const tag = document.createElement("span");
    tag.textContent = value;
    shareTags.appendChild(tag);
  });
  const actions = document.createElement("div");
  actions.className = "participant-card-actions";
  const saveButton = document.createElement("button");
  saveButton.type = "button";
  saveButton.className = "participant-save-btn";
  saveButton.innerHTML = '<i data-lucide="save"></i><span>Сохранить карточку</span>';
  saveButton.disabled = true;
  const shareButton = document.createElement("button");
  shareButton.type = "button";
  shareButton.className = "tiktok-share-btn";
  shareButton.innerHTML = '<i data-lucide="share"></i><span>Открыть меню «Поделиться»</span><i data-lucide="chevron-right"></i>';
  shareButton.disabled = true;
  const shareHint = document.createElement("div");
  shareHint.className = "tiktok-share-hint";
  shareHint.setAttribute("aria-live","polite");
  shareHint.textContent = "Создаём персональную карточку…";
  const cardReady = drawParticipantCard(canvas,count,firstGame,cardStats)
    .then(() => canvasToPngBlob(canvas))
    .then(blob => {
      saveButton.disabled = false;
      shareButton.disabled = false;
      shareHint.textContent = "Карточка готова — откроется системное меню смартфона";
      return blob;
    })
    .catch(() => {
      shareHint.textContent = "Не удалось загрузить шаблон карточки. Проверьте интернет";
      return false;
    });
  saveButton.addEventListener("click", async () => {
    try{
      const blob = await cardReady;
      if(blob) await saveParticipantCard(blob,count,shareHint);
    }catch(error){}
  });
  shareButton.addEventListener("click", async () => {
    try{
      const blob = await cardReady;
      if(blob) await shareTikTokParticipation(blob,name,count,firstGame,shareHint,cardStats);
    }catch(error){}
  });
  actions.append(shareButton,saveButton);

  shareCard.append(shareHead,shareText,canvas,shareTags,actions,shareHint);
  playerCard.append(shareCard);
  refreshRankIcons();
  if(celebrate && window.confetti && !prefersReducedMotion){
    confetti({particleCount:120,spread:90,origin:{y:.62}});
  }
}

let lastFormErrorSoundAt = 0;
function playFormErrorSound(){
  const now = Date.now();
  if(now - lastFormErrorSoundAt < 500) return;
  lastFormErrorSoundAt = now;
  playUiSound("formError");
}
